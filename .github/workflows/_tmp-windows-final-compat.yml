name: Temporary final Windows 2022 2025 compatibility probe
on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2022, windows-2025]
    runs-on: ${{ matrix.image }}
    steps:
      - name: Probe AppX compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = '${{ matrix.image }}'
          $packages = @(); $available = $true
          try {
            Import-Module Appx -ErrorAction Stop
            try { $packages = @(Get-AppxPackage -AllUsers -ErrorAction Stop) }
            catch { $packages = @(Get-AppxPackage -ErrorAction Stop) }
          } catch {
            $available = $false
            Write-Host "FINAL_COMPAT_APPX_UNAVAILABLE image=$image reason=$($_.Exception.Message)"
          }
          if ($image -eq 'windows-2025' -and (-not $available -or $packages.Count -eq 0)) {
            throw "windows-2025 AppX capability regression available=$available count=$($packages.Count)"
          }
          Write-Host "FINAL_COMPAT_APPX_OK image=$image available=$available count=$($packages.Count)"

      - name: Probe stale local SID ACL rewrite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = '${{ matrix.image }}'
          $root = Join-Path $env:RUNNER_TEMP 'final-acl-probe'
          $data = Join-Path $root 'data'
          $aclFile = Join-Path $root 'acl.txt'
          $rewriteFile = Join-Path $root 'acl-rewritten.txt'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $data 'probe.txt') -Value 'final-acl-probe' -Encoding UTF8
          $managedSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $m = [regex]::Match($managedSid,'^(S-1-5-21-[0-9]+-[0-9]+-[0-9]+)-([0-9]+)$')
          if (-not $m.Success) { throw "Current user is not machine-local SID: $managedSid" }
          $targetPrefix=$m.Groups[1].Value; $managedRid=$m.Groups[2].Value
          $rid500 = Get-LocalUser -ErrorAction SilentlyContinue | Where-Object { ([string]$_.SID.Value) -match '-500$' } | Select-Object -First 1
          if ($null -eq $rid500) { throw 'RID 500 local account missing' }
          $rid500Sid=[string]$rid500.SID.Value
          & icacls.exe $data /grant "*$managedSid`:(OI)(CI)F" "*$rid500Sid`:(OI)(CI)F" /t /q | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "grant failed exit=$LASTEXITCODE" }
          Push-Location $root
          try { & icacls.exe 'data' /save $aclFile /t /c /q | Out-Null; if($LASTEXITCODE -ne 0){ throw "save failed exit=$LASTEXITCODE" } }
          finally { Pop-Location }
          $sourcePrefix='S-1-5-21-111111111-222222222-333333333'
          $aclText=[Text.Encoding]::Unicode.GetString([IO.File]::ReadAllBytes($aclFile))
          $aclText=$aclText.Replace($targetPrefix,$sourcePrefix)
          if(-not $aclText.Contains($sourcePrefix)){ throw "failed to synthesize stale machine SID image=$image" }
          $targetByRid=@{}
          $rewriteCount=0
          foreach($u in @(Get-LocalUser -ErrorAction SilentlyContinue)){
            $sid=[string]$u.SID.Value; $rm=[regex]::Match($sid,'-([0-9]+)$'); if($rm.Success){$targetByRid[$rm.Groups[1].Value]=$sid}
          }
          foreach($sm in [regex]::Matches($aclText,[regex]::Escape($sourcePrefix)+'-([0-9]+)')){
            $old=$sm.Value; $rid=$sm.Groups[1].Value
            if($targetByRid.ContainsKey($rid)){
              $new=[string]$targetByRid[$rid]
              $aclText=$aclText.Replace($old,$new)
              $rewriteCount++
              Write-Host "FINAL_COMPAT_ACL_REWRITE image=$image old=$old new=$new rid=$rid"
            }
          }
          if($rewriteCount -lt 1){ throw "no stale SID was rewritten image=$image" }
          if($aclText.Contains($sourcePrefix)){ throw "stale source machine SID remained after rewrite image=$image" }
          [IO.File]::WriteAllBytes($rewriteFile,[Text.Encoding]::Unicode.GetBytes($aclText))
          $out=@(& icacls.exe $root /restore $rewriteFile /c /q 2>&1); $code=$LASTEXITCODE; $out | Out-Host
          if($code -ne 0){ throw "acl restore failed image=$image exit=$code" }
          Write-Host "FINAL_COMPAT_ACL_OK image=$image managedRid=$managedRid rid500=$rid500Sid"
