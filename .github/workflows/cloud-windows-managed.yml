name: Managed Windows Cloud PC
run-name: ${{ inputs.machine_name || 'Managed Windows' }} · ${{ inputs.machine_id || '001' }} / ${{ inputs.runner_image || 'windows-2025' }} / ${{ inputs.mode || 'new' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Start fresh or restore the latest managed user-data backup
        required: true
        default: new
        type: choice
        options:
          - new
          - restore
      machine_id:
        description: Logical machine ID
        required: true
        default: '001'
        type: string
      machine_name:
        description: Friendly Windows machine name
        required: false
        default: 'WINDOWS-001'
        type: string
      runner_image:
        description: Windows GitHub-hosted runner image selected from the live actions/runner-images catalog
        required: true
        default: windows-2025
        type: string
      desktop_username:
        description: Windows local account used for RDP
        required: true
        default: admin
        type: string
      bootstrap_ticket:
        description: Cloudflare bootstrap ticket
        required: true
        type: string
      web_url:
        description: Current Web URL
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: managed-windows-${{ inputs.machine_id || '001' }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ${{ inputs.runner_image }}
    timeout-minutes: 360
    env:
      MACHINE_ID: ${{ inputs.machine_id || '001' }}
      MACHINE_NAME: ${{ inputs.machine_name || 'WINDOWS-001' }}
      DESKTOP_USERNAME: ${{ inputs.desktop_username || 'admin' }}
      RUNNER_IMAGE: ${{ inputs.runner_image }}
      MACHINE_MODE: ${{ inputs.mode || 'new' }}
      WEB_URL: ${{ inputs.web_url }}
    steps:
      - name: Bootstrap runtime from Cloudflare
        env:
          BOOTSTRAP_TICKET: ${{ inputs.bootstrap_ticket }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "::add-mask::$env:BOOTSTRAP_TICKET"
          $instanceKey = "instance:windows:$env:MACHINE_ID"
          $payload = @{
            instanceKey = $instanceKey
            repository = $env:GITHUB_REPOSITORY
            runId = [int64]$env:GITHUB_RUN_ID
          } | ConvertTo-Json -Compress
          $headers = @{ 'X-Bootstrap-Ticket' = $env:BOOTSTRAP_TICKET }
          $controlUrl = ([string]$env:WEB_URL).TrimEnd('/')
          if (-not $controlUrl.StartsWith('https://')) { throw 'Cloudflare control URL is invalid' }
          $bootstrap = Invoke-RestMethod -Method Post -Uri "$controlUrl/api/runner/bootstrap" -Headers $headers -ContentType 'application/json' -Body $payload
          foreach ($value in @($bootstrap.tailscaleClientId, $bootstrap.tailscaleClientSecret, $bootstrap.desktopPassword, $bootstrap.cloudflareTunnelToken)) {
            if (-not [string]::IsNullOrWhiteSpace([string]$value)) { Write-Host "::add-mask::$value" }
          }
          if ([string]::IsNullOrWhiteSpace([string]$bootstrap.tailscaleClientId) -or [string]::IsNullOrWhiteSpace([string]$bootstrap.tailscaleClientSecret)) { throw 'Cloudflare Tailscale configuration is incomplete' }
          if ([string]::IsNullOrWhiteSpace([string]$bootstrap.desktopPassword)) { throw 'Cloudflare desktop password is empty' }
          $tunnelMode = [string]$bootstrap.tunnelMode
          if ($tunnelMode -in @('cloudflare','dual')) {
            if ([string]::IsNullOrWhiteSpace([string]$bootstrap.cloudflareTunnelToken) -or [string]::IsNullOrWhiteSpace([string]$bootstrap.cloudflareHostname)) { throw 'Cloudflare Tunnel bootstrap is incomplete' }
          }
          "TS_CLIENT_ID=$($bootstrap.tailscaleClientId)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TS_CLIENT_SECRET=$($bootstrap.tailscaleClientSecret)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLOUD_PASSWORD=$($bootstrap.desktopPassword)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTANCE_KEY=$instanceKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TUNNEL_MODE=$tunnelMode" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TS_DNS_HOSTNAME=$([string]$bootstrap.tailscaleHostname)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CF_TUNNEL_HOSTNAME=$([string]$bootstrap.cloudflareHostname)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CF_TUNNEL_TOKEN=$([string]$bootstrap.cloudflareTunnelToken)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'CLOUDFLARE_BOOTSTRAP_OK'

      - name: Validate inputs
        shell: pwsh
        run: |
          if ($env:MACHINE_ID -notmatch '^\d+$') { throw 'machine_id must contain digits only' }
          if ($env:DESKTOP_USERNAME -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,19}$') { throw 'desktop_username contains unsupported characters' }
          if ($env:DESKTOP_USERNAME.ToLowerInvariant() -in @('administrator','guest','defaultaccount','wdagutilityaccount')) { throw 'desktop_username cannot use a built-in Windows account name' }
          if ($env:RUNNER_IMAGE -notmatch '^windows-\d{4}$') { throw "Unsupported Windows runner image label: $env:RUNNER_IMAGE" }
          if ($env:MACHINE_MODE -notin @('new','restore')) { throw "Unsupported mode: $env:MACHINE_MODE" }
          if ([string]::IsNullOrWhiteSpace($env:CLOUD_PASSWORD)) { throw 'Desktop password secret is empty' }

      - name: Prepare Tailscale hostname
        id: identity
        shell: pwsh
        run: |
          # Network identity is independent from the display/business name.
          # The same machine ID always reuses the same Tailscale/MagicDNS hostname.
          $tsHostname = "win-$env:MACHINE_ID"
          "ts_hostname=$tsHostname" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "TAILSCALE_STABLE_HOSTNAME=$tsHostname"

      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_CLIENT_ID }}
          oauth-secret: ${{ env.TS_CLIENT_SECRET }}
          tags: tag:github-phone
          hostname: ${{ steps.identity.outputs.ts_hostname }}
          version: latest

      - name: Verify Tailscale presence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ip = (& tailscale ip -4 | Select-Object -First 1).Trim()
          if (-not $ip) { throw 'No Tailscale IPv4 address was assigned' }
          # Do not publish RDP connectivity yet. The control plane must only expose
          # a connectable address after RDP is ready and the Runner consoles are hidden.
          Write-Host "TAILSCALE_NETWORK_JOINED=$ip"

      - name: Capture runner software baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $baselineRoot = Join-Path $env:RUNNER_TEMP 'managed-software-baseline'
          New-Item -ItemType Directory -Path $baselineRoot -Force | Out-Null

          function Get-InstalledAppInventory {
            $items = [System.Collections.Generic.List[object]]::new()
            foreach ($uninstallRoot in @(
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKCU:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
            )) {
              Get-ItemProperty $uninstallRoot -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName } | ForEach-Object {
                $registryPath = ([string]$_.PSPath -replace '^Microsoft\.PowerShell\.Core\\Registry::','')
                [void]$items.Add([pscustomobject]@{
                  registry_path = $registryPath
                  name = [string]$_.DisplayName
                  version = [string]$_.DisplayVersion
                  publisher = [string]$_.Publisher
                  install_location = [string]$_.InstallLocation
                  display_icon = [string]$_.DisplayIcon
                  uninstall = [string]$_.UninstallString
                  quiet_uninstall = [string]$_.QuietUninstallString
                })
              }
            }
            return @($items | Sort-Object registry_path -Unique)
          }

          if (Get-Command winget.exe -ErrorAction SilentlyContinue) {
            try {
              $path = Join-Path $baselineRoot 'winget.json'
              & winget.exe export -o $path --accept-source-agreements --disable-interactivity
              if ($LASTEXITCODE -ne 0) { Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue }
            } catch { }
          }
          if (Get-Command choco.exe -ErrorAction SilentlyContinue) {
            try {
              $items = @(& choco.exe list --local-only --limit-output 2>$null)
              if ($LASTEXITCODE -ne 0) { $items = @(& choco.exe list --limit-output 2>$null) }
              $items | Set-Content -LiteralPath (Join-Path $baselineRoot 'choco-packages.txt') -Encoding UTF8
            } catch { }
          }
          if (Get-Command scoop -ErrorAction SilentlyContinue) {
            try { & scoop export | Set-Content -LiteralPath (Join-Path $baselineRoot 'scoop.json') -Encoding UTF8 } catch { }
          }

          $baselineApps = @(Get-InstalledAppInventory)
          ConvertTo-Json -InputObject $baselineApps -Depth 6 | Set-Content -LiteralPath (Join-Path $baselineRoot 'installed-apps.json') -Encoding UTF8

          # Snapshot shallow Program Files directory topology. Some installers (including
          # per-user uninstall registrations) omit InstallLocation/DisplayIcon paths, so
          # backup also detects directories created after this pristine runner baseline.
          $baselineProgramDirs = [System.Collections.Generic.List[string]]::new()
          foreach ($programRoot in @([string]$env:ProgramFiles, [string]${env:ProgramFiles(x86)})) {
            if ([string]::IsNullOrWhiteSpace($programRoot) -or -not (Test-Path -LiteralPath $programRoot -PathType Container)) { continue }
            try {
              $rootFull = [IO.Path]::GetFullPath($programRoot).TrimEnd('\')
              Get-ChildItem -LiteralPath $rootFull -Directory -Recurse -Depth 2 -Force -ErrorAction SilentlyContinue | ForEach-Object {
                try { [void]$baselineProgramDirs.Add([IO.Path]::GetFullPath($_.FullName).TrimEnd('\')) } catch { }
              }
            } catch { }
          }
          $baselineProgramDirs = @($baselineProgramDirs | Sort-Object -Unique)
          ConvertTo-Json -InputObject @($baselineProgramDirs) -Depth 3 | Set-Content -LiteralPath (Join-Path $baselineRoot 'program-dirs.json') -Encoding UTF8

          # V9 also snapshots ProgramData topology because desktop/remote-control apps often keep
          # machine-scoped runtime state outside Program Files.
          $programDataRoot = [Environment]::GetFolderPath('CommonApplicationData')
          $baselineProgramDataDirs = [System.Collections.Generic.List[string]]::new()
          if ($programDataRoot -and (Test-Path -LiteralPath $programDataRoot -PathType Container)) {
            Get-ChildItem -LiteralPath $programDataRoot -Directory -Recurse -Depth 2 -Force -ErrorAction SilentlyContinue | ForEach-Object {
              try { [void]$baselineProgramDataDirs.Add([IO.Path]::GetFullPath($_.FullName).TrimEnd('\')) } catch { }
            }
          }
          $baselineProgramDataDirs = @($baselineProgramDataDirs | Sort-Object -Unique)
          ConvertTo-Json -InputObject @($baselineProgramDataDirs) -Depth 3 | Set-Content -LiteralPath (Join-Path $baselineRoot 'programdata-dirs.json') -Encoding UTF8

          # Snapshot shallow user-application topology. The profile itself is copied by VSS;
          # this baseline is only for identifying which AppData directories belong to apps
          # installed after the pristine runner started.
          $baselineAppDataDirs = [System.Collections.Generic.List[string]]::new()
          foreach ($appDataRoot in @([Environment]::GetFolderPath('ApplicationData'), [Environment]::GetFolderPath('LocalApplicationData'))) {
            if ([string]::IsNullOrWhiteSpace($appDataRoot) -or -not (Test-Path -LiteralPath $appDataRoot -PathType Container)) { continue }
            Get-ChildItem -LiteralPath $appDataRoot -Directory -Recurse -Depth 2 -Force -ErrorAction SilentlyContinue | ForEach-Object {
              try { [void]$baselineAppDataDirs.Add([IO.Path]::GetFullPath($_.FullName).TrimEnd('\')) } catch { }
            }
          }
          ConvertTo-Json -InputObject @($baselineAppDataDirs | Sort-Object -Unique) -Depth 3 | Set-Content -LiteralPath (Join-Path $baselineRoot 'appdata-dirs.json') -Encoding UTF8

          # Snapshot shallow application registry topology. We never restore the whole HKCU hive;
          # only new app/vendor subtrees created after this baseline are exported later.
          $baselineAppRegistryKeys = [System.Collections.Generic.List[string]]::new()
          foreach ($registryRoot in @('HKCU:\SOFTWARE','HKLM:\SOFTWARE','HKLM:\SOFTWARE\WOW6432Node')) {
            if (-not (Test-Path -LiteralPath $registryRoot)) { continue }
            Get-ChildItem -LiteralPath $registryRoot -Recurse -Depth 3 -ErrorAction SilentlyContinue | ForEach-Object {
              try { [void]$baselineAppRegistryKeys.Add([string]$_.Name) } catch { }
            }
          }
          ConvertTo-Json -InputObject @($baselineAppRegistryKeys | Sort-Object -Unique) -Depth 3 | Set-Content -LiteralPath (Join-Path $baselineRoot 'app-registry-keys.json') -Encoding UTF8

          # Generic installer-state baselines. These are intentionally app-agnostic and are diffed later.
          function Get-RegistryValueInventory {
            param([Parameter(Mandatory=$true)][string]$Path)
            $result = [System.Collections.Generic.List[object]]::new()
            if (-not (Test-Path -LiteralPath $Path)) { return @() }
            $key = Get-Item -LiteralPath $Path -ErrorAction Stop
            foreach ($name in $key.GetValueNames()) {
              if ([string]::IsNullOrWhiteSpace($name)) { continue }
              $kind = $key.GetValueKind($name).ToString()
              $raw = $key.GetValue($name,$null,[Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
              $entry = [ordered]@{ path=$Path; name=$name; kind=$kind; value=$null; value_b64=''; value_multi=@() }
              if ($raw -is [byte[]]) { $entry.value_b64 = [Convert]::ToBase64String($raw) }
              elseif ($raw -is [string[]]) { $entry.value_multi = @($raw) }
              else { $entry.value = $raw }
              [void]$result.Add([pscustomobject]$entry)
            }
            return @($result)
          }
          $installerValueRoots = @(
            'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment',
            'HKCU:\Environment',
            'HKLM:\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\FirewallRules',
            'HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\FirewallRules',
            'HKLM:\SOFTWARE\RegisteredApplications',
            'HKCU:\SOFTWARE\RegisteredApplications',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Shell Extensions\Approved',
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Shell Extensions\Approved'
          )
          $baselineInstallerValues = [System.Collections.Generic.List[object]]::new()
          foreach ($root in $installerValueRoots) { foreach ($entry in @(Get-RegistryValueInventory -Path $root)) { [void]$baselineInstallerValues.Add($entry) } }
          ConvertTo-Json -InputObject @($baselineInstallerValues) -Depth 8 | Set-Content -LiteralPath (Join-Path $baselineRoot 'installer-registry-values.json') -Encoding UTF8

          $baselineIdentitySid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $installerTreeRoots = @(
            [pscustomobject]@{ id='hklm_classes'; provider='HKLM:\SOFTWARE\Classes'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Classes' },
            [pscustomobject]@{ id='hklm_app_paths'; provider='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths' },
            [pscustomobject]@{ id='hkcu_app_paths'; provider='HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths'; reg='HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths' },
            [pscustomobject]@{ id='hklm_shell_overlays'; provider='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\ShellIconOverlayIdentifiers'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\ShellIconOverlayIdentifiers' },
            [pscustomobject]@{ id='hkcu_shell_overlays'; provider='HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\ShellIconOverlayIdentifiers'; reg='HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\ShellIconOverlayIdentifiers' },
            [pscustomobject]@{ id='hklm_clsid'; provider='HKLM:\SOFTWARE\Classes\CLSID'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Classes\CLSID' },
            [pscustomobject]@{ id='hklm_appid'; provider='HKLM:\SOFTWARE\Classes\AppID'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Classes\AppID' },
            [pscustomobject]@{ id='hklm_typelib'; provider='HKLM:\SOFTWARE\Classes\TypeLib'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Classes\TypeLib' },
            [pscustomobject]@{ id='hklm_interface'; provider='HKLM:\SOFTWARE\Classes\Interface'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Classes\Interface' },
            [pscustomobject]@{ id='hkcu_classes'; provider='HKCU:\SOFTWARE\Classes'; reg='HKEY_CURRENT_USER\SOFTWARE\Classes' },
            [pscustomobject]@{ id='hkcu_clsid'; provider='HKCU:\SOFTWARE\Classes\CLSID'; reg='HKEY_CURRENT_USER\SOFTWARE\Classes\CLSID' },
            [pscustomobject]@{ id='hkcu_appid'; provider='HKCU:\SOFTWARE\Classes\AppID'; reg='HKEY_CURRENT_USER\SOFTWARE\Classes\AppID' },
            [pscustomobject]@{ id='hkcu_typelib'; provider='HKCU:\SOFTWARE\Classes\TypeLib'; reg='HKEY_CURRENT_USER\SOFTWARE\Classes\TypeLib' },
            [pscustomobject]@{ id='msi_products'; provider='HKLM:\SOFTWARE\Classes\Installer\Products'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Classes\Installer\Products' },
            [pscustomobject]@{ id='msi_features'; provider='HKLM:\SOFTWARE\Classes\Installer\Features'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Classes\Installer\Features' },
            [pscustomobject]@{ id='msi_upgradecodes'; provider='HKLM:\SOFTWARE\Classes\Installer\UpgradeCodes'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Classes\Installer\UpgradeCodes' },
            [pscustomobject]@{ id='msi_machine_products'; provider='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\UserData\S-1-5-18\Products'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\UserData\S-1-5-18\Products' },
            [pscustomobject]@{ id='msi_user_products'; provider="HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\UserData\$baselineIdentitySid\Products"; reg="HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\UserData\$baselineIdentitySid\Products" }
          )
          $baselineInstallerTrees = [System.Collections.Generic.List[object]]::new()
          foreach ($root in $installerTreeRoots) {
            if (-not (Test-Path -LiteralPath $root.provider)) { continue }
            foreach ($child in @(Get-ChildItem -LiteralPath $root.provider -ErrorAction Stop)) {
              [void]$baselineInstallerTrees.Add([pscustomobject]@{ root_id=$root.id; child=[string]$child.PSChildName })
            }
          }
          ConvertTo-Json -InputObject @($baselineInstallerTrees) -Depth 5 | Set-Content -LiteralPath (Join-Path $baselineRoot 'installer-registry-trees.json') -Encoding UTF8
          $installerCache = Join-Path $env:WINDIR 'Installer'
          $baselineInstallerCacheFiles = @()
          if (Test-Path -LiteralPath $installerCache -PathType Container) {
            $baselineInstallerCacheFiles = @(Get-ChildItem -LiteralPath $installerCache -File -Recurse -Force -ErrorAction Stop | ForEach-Object { $_.FullName.Substring($installerCache.Length).TrimStart('\\') } | Sort-Object -Unique)
          }
          ConvertTo-Json -InputObject @($baselineInstallerCacheFiles) -Depth 3 | Set-Content -LiteralPath (Join-Path $baselineRoot 'installer-cache-files.json') -Encoding UTF8

          function Get-StartupEntryInventory {
            $entries = [System.Collections.Generic.List[object]]::new()
            foreach ($path in @(
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run',
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Run',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\RunOnce',
              'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run',
              'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce'
            )) {
              if (-not (Test-Path -LiteralPath $path)) { continue }
              $key = Get-Item -LiteralPath $path
              foreach ($name in $key.GetValueNames()) {
                if ([string]::IsNullOrWhiteSpace($name)) { continue }
                $kind = $key.GetValueKind($name).ToString()
                if ($kind -notin @('String','ExpandString')) { continue }
                $value = $key.GetValue($name, $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
                [void]$entries.Add([pscustomobject]@{ path=$path; name=$name; value=[string]$value; kind=$kind })
              }
            }
            return @($entries)
          }
          ConvertTo-Json -InputObject @(Get-StartupEntryInventory) -Depth 5 | Set-Content -LiteralPath (Join-Path $baselineRoot 'startup-entries.json') -Encoding UTF8

          $commonStartup = [Environment]::GetFolderPath('CommonStartup')
          $baselineCommonStartup = @()
          if ($commonStartup -and (Test-Path -LiteralPath $commonStartup)) {
            $baselineCommonStartup = @(Get-ChildItem -LiteralPath $commonStartup -File -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName.Substring($commonStartup.Length).TrimStart('\') })
          }
          ConvertTo-Json -InputObject @($baselineCommonStartup | Sort-Object -Unique) -Depth 3 | Set-Content -LiteralPath (Join-Path $baselineRoot 'common-startup-files.json') -Encoding UTF8

          # Managed backup boundary:
          # - portable/no-install files belong under the user profile and are preserved by the profile snapshot;
          # - installed software is discovered only from explicit install evidence and baseline deltas.
          function Get-RegistryServiceInventory {
            param([Parameter(Mandatory=$true)][ValidateSet('service','driver')][string]$Kind)
            $items = [System.Collections.Generic.List[object]]::new()
            $servicesRoot = 'HKLM:\SYSTEM\CurrentControlSet\Services'
            foreach ($key in @(Get-ChildItem -LiteralPath $servicesRoot -ErrorAction Stop)) {
              $props = Get-ItemProperty -LiteralPath $key.PSPath -ErrorAction Stop
              $type = if ($null -eq $props.Type) { 0 } else { [int64]$props.Type }
              if ($Kind -eq 'service') {
                if (($type -band 0x30) -eq 0) { continue }
              } else {
                if (($type -band 0x3) -eq 0) { continue }
              }
              $start = if ($null -eq $props.Start) { -1 } else { [int]$props.Start }
              $startMode = switch ($start) { 0 {'Boot'} 1 {'System'} 2 {'Auto'} 3 {'Manual'} 4 {'Disabled'} default {'Unknown'} }
              [void]$items.Add([pscustomobject]@{
                name=[string]$key.PSChildName; path=[string]$props.ImagePath; start_mode=$startMode;
                start=[int]$start; start_name=[string]$props.ObjectName; display_name=[string]$props.DisplayName;
                type=[int64]$type; error_control=if ($null -eq $props.ErrorControl) { -1 } else { [int]$props.ErrorControl }
              })
            }
            return @($items | Sort-Object name -Unique)
          }
          $baselineServices = @(Get-RegistryServiceInventory -Kind service)
          if ($baselineServices.Count -lt 100) { throw "Service registry inventory sanity check failed: count=$($baselineServices.Count)" }
          ConvertTo-Json -InputObject $baselineServices -Depth 5 | Set-Content -LiteralPath (Join-Path $baselineRoot 'services.json') -Encoding UTF8

          $baselineDrivers = @(Get-RegistryServiceInventory -Kind driver)
          if ($baselineDrivers.Count -lt 100) { throw "Driver registry inventory sanity check failed: count=$($baselineDrivers.Count)" }
          ConvertTo-Json -InputObject $baselineDrivers -Depth 5 | Set-Content -LiteralPath (Join-Path $baselineRoot 'drivers.json') -Encoding UTF8
          $pnputilBaselineDevices = (& pnputil.exe /enum-devices 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "pnputil baseline device inventory failed exit=$LASTEXITCODE" }
          $baselinePnpIds = @([regex]::Matches($pnputilBaselineDevices, '(?im)^\s*Instance ID\s*:\s*(.+?)\s*$') | ForEach-Object { $_.Groups[1].Value.Trim() } | Sort-Object -Unique)
          if ($baselinePnpIds.Count -lt 20) { throw "PnP baseline inventory sanity check failed: count=$($baselinePnpIds.Count)" }
          $baselinePnpIds | Set-Content -LiteralPath (Join-Path $baselineRoot 'pnp-device-ids.txt') -Encoding UTF8
          try {
            $pnputilBaseline = (& pnputil.exe /enum-drivers 2>$null) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "pnputil baseline driver package inventory failed exit=$LASTEXITCODE" }
            $baselineOemInf = @([regex]::Matches($pnputilBaseline, '(?im)^\s*Published Name\s*:\s*(oem\d+\.inf)\s*$') | ForEach-Object { $_.Groups[1].Value.ToLowerInvariant() } | Sort-Object -Unique)
            $baselineOemInf | Set-Content -LiteralPath (Join-Path $baselineRoot 'driver-packages.txt') -Encoding UTF8
          } catch { throw "Driver package baseline inventory failed: $($_.Exception.Message)" }

          @{ captured_at=[DateTime]::UtcNow.ToString('o'); installed_apps=@($baselineApps).Count; services=@($baselineServices).Count; drivers=@($baselineDrivers).Count } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $baselineRoot 'baseline.json') -Encoding UTF8
          Write-Host "MANAGED_WINDOWS_SOFTWARE_BASELINE_READY apps=$(@($baselineApps).Count) services=$(@($baselineServices).Count) drivers=$(@($baselineDrivers).Count)"

      - name: Initialize RDP stack for single managed session
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rdpStartedAt = Get-Date
          $terminalServer = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
          $rdpTcp = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          if (-not (Test-Path -LiteralPath $rdpTcp)) { throw 'RDP-Tcp WinStation registry key is missing' }

          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          Write-Host "RDP_PRE_RENAME_IDENTITY=$($identity.Name) sid=$($identity.User.Value)"

          Set-ItemProperty -Path $terminalServer -Name fDenyTSConnections -Value 0 -Force
          Set-ItemProperty -Path $terminalServer -Name fSingleSessionPerUser -Value 1 -Force
          Set-ItemProperty -Path $rdpTcp -Name fEnableWinStation -Value 1 -Force
          Set-ItemProperty -Path $rdpTcp -Name PortNumber -Value 3389 -Force
          Set-ItemProperty -Path $rdpTcp -Name LanAdapter -Value 0 -Force
          Set-ItemProperty -Path $rdpTcp -Name fDisableClip -Value 0 -Force
          Set-ItemProperty -Path $rdpTcp -Name fDisableCdm -Value 1 -Force
          $rdpPolicy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item -Path $rdpPolicy -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name fSingleSessionPerUser -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name fDisableClip -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name fDisableCdm -PropertyType DWord -Value 1 -Force | Out-Null
          Write-Host 'MANAGED_RDP_REDIRECTION_POLICY=clipboard-only-drives-disabled'

          try {
            $tsSetting = Get-CimInstance -Namespace 'root/cimv2/terminalservices' -ClassName Win32_TerminalServiceSetting -ErrorAction Stop
            Write-Host "RDP_WMI_PRE_RENAME_BEFORE AllowTSConnections=$($tsSetting.AllowTSConnections) PolicySource=$($tsSetting.PolicySourceAllowTSConnections)"
            $allowResult = Invoke-CimMethod -InputObject $tsSetting -MethodName SetAllowTSConnections -Arguments @{ AllowTSConnections = [uint32]1; ModifyFirewallException = [uint32]0 } -ErrorAction Stop
            Write-Host "RDP_WMI_PRE_RENAME_RETURN=$($allowResult.ReturnValue)"
          } catch {
            Write-Warning "Terminal Services WMI pre-rename enable failed: $($_.Exception.Message)"
          }

          # Configure firewall while the current logon name still matches its security token.
          # This avoids Windows account-name/SID mapping failures after Rename-LocalUser.
          & netsh.exe advfirewall firewall set rule group="remote desktop" new enable=Yes | Out-Host
          Get-NetFirewallRule -DisplayName 'Managed Cloudflare RDP Loopback' -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue
          & netsh.exe advfirewall firewall add rule name="Managed Cloudflare RDP Loopback" dir=in action=allow protocol=TCP localport=3389 remoteip=127.0.0.1 | Out-Host

          foreach ($serviceName in @('SessionEnv','UmRdpService')) {
            try {
              Set-Service -Name $serviceName -StartupType Manual -ErrorAction Stop
              Start-Service -Name $serviceName -ErrorAction SilentlyContinue
            } catch { Write-Warning "$serviceName pre-rename initialization failed: $($_.Exception.Message)" }
          }
          Set-Service -Name TermService -StartupType Automatic
          if ((Get-Service TermService).Status -eq 'Running') { Restart-Service TermService -Force } else { Start-Service TermService }

          $listenerReady = $false
          for ($i = 0; $i -lt 90; $i++) {
            if (Get-NetTCPConnection -State Listen -LocalPort 3389 -ErrorAction SilentlyContinue) {
              $listenerReady = $true
              break
            }
            if ((Get-Service TermService).Status -ne 'Running') { Start-Service TermService -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 1
          }
          if (-not $listenerReady) {
            Write-Host '===== PRE-RENAME RDP DIAGNOSTICS ====='
            try {
              $tsAfter = Get-CimInstance -Namespace 'root/cimv2/terminalservices' -ClassName Win32_TerminalServiceSetting -ErrorAction Stop
              Write-Host "RDP_WMI_PRE_RENAME_AFTER AllowTSConnections=$($tsAfter.AllowTSConnections) PolicySource=$($tsAfter.PolicySourceAllowTSConnections)"
            } catch { Write-Warning "RDP WMI read failed: $($_.Exception.Message)" }
            Get-ItemProperty -Path $rdpTcp -ErrorAction SilentlyContinue | Select-Object fEnableWinStation,PortNumber,LanAdapter,UserAuthentication,SecurityLayer,MinEncryptionLevel | Format-List
            Get-Service TermService,SessionEnv,UmRdpService -ErrorAction SilentlyContinue | Format-Table Name,Status,StartType -AutoSize
            & qwinsta.exe 2>&1 | Out-Host
            & sc.exe query termdd 2>&1 | Out-Host
            Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Sort-Object LocalPort | Select-Object LocalAddress,LocalPort,OwningProcess | Format-Table -AutoSize
            foreach ($logName in @('Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational','Microsoft-Windows-TerminalServices-LocalSessionManager/Operational')) {
              Write-Host "--- $logName ---"
              Get-WinEvent -FilterHashtable @{ LogName = $logName; StartTime = $rdpStartedAt.AddSeconds(-5) } -MaxEvents 30 -ErrorAction SilentlyContinue | Format-List TimeCreated,Id,LevelDisplayName,Message
            }
            throw 'RDP TCP/3389 listener did not become ready before account rename'
          }
          Write-Host 'RDP_PRE_RENAME_READY=3389'

      - name: Finalize installer-state baseline after platform init
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baselineRoot = Join-Path $env:RUNNER_TEMP 'managed-software-baseline'
          if (-not (Test-Path -LiteralPath $baselineRoot)) { throw 'Managed software baseline directory is missing' }

          function Get-RegistryServiceInventory {
            param([Parameter(Mandatory=$true)][ValidateSet('service','driver')][string]$Kind)
            $items = [System.Collections.Generic.List[object]]::new()
            foreach ($key in @(Get-ChildItem -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Services' -ErrorAction Stop)) {
              $props = Get-ItemProperty -LiteralPath $key.PSPath -ErrorAction Stop
              $type = if ($null -eq $props.Type) { 0 } else { [int64]$props.Type }
              if ($Kind -eq 'service') { if (($type -band 0x30) -eq 0) { continue } }
              else { if (($type -band 0x3) -eq 0) { continue } }
              $start = if ($null -eq $props.Start) { -1 } else { [int]$props.Start }
              $startMode = switch ($start) { 0 {'Boot'} 1 {'System'} 2 {'Auto'} 3 {'Manual'} 4 {'Disabled'} default {'Unknown'} }
              [void]$items.Add([pscustomobject]@{
                name=[string]$key.PSChildName; path=[string]$props.ImagePath; start_mode=$startMode;
                start=[int]$start; start_name=[string]$props.ObjectName; display_name=[string]$props.DisplayName;
                type=[int64]$type; error_control=if ($null -eq $props.ErrorControl) { 1 } else { [int]$props.ErrorControl }
              })
            }
            return @($items | Sort-Object name -Unique)
          }
          $baselineServices = @(Get-RegistryServiceInventory -Kind service)
          $baselineDrivers = @(Get-RegistryServiceInventory -Kind driver)
          if ($baselineServices.Count -lt 100 -or $baselineDrivers.Count -lt 100) { throw "Final machine baseline sanity failure services=$($baselineServices.Count) drivers=$($baselineDrivers.Count)" }
          ConvertTo-Json -InputObject $baselineServices -Depth 5 | Set-Content -LiteralPath (Join-Path $baselineRoot 'services.json') -Encoding UTF8
          ConvertTo-Json -InputObject $baselineDrivers -Depth 5 | Set-Content -LiteralPath (Join-Path $baselineRoot 'drivers.json') -Encoding UTF8

          $pnpText = (& pnputil.exe /enum-devices 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "Final PnP baseline failed exit=$LASTEXITCODE" }
          $pnpIds = @([regex]::Matches($pnpText, '(?im)^\s*Instance ID\s*:\s*(.+?)\s*$') | ForEach-Object { $_.Groups[1].Value.Trim() } | Sort-Object -Unique)
          if ($pnpIds.Count -lt 20) { throw "Final PnP baseline sanity failure count=$($pnpIds.Count)" }
          $pnpIds | Set-Content -LiteralPath (Join-Path $baselineRoot 'pnp-device-ids.txt') -Encoding UTF8
          $driverText = (& pnputil.exe /enum-drivers 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "Final driver-package baseline failed exit=$LASTEXITCODE" }
          @([regex]::Matches($driverText, '(?im)^\s*Published Name\s*:\s*(oem\d+\.inf)\s*$') | ForEach-Object { $_.Groups[1].Value.ToLowerInvariant() } | Sort-Object -Unique) |
            Set-Content -LiteralPath (Join-Path $baselineRoot 'driver-packages.txt') -Encoding UTF8

          function Get-RegistryValueInventory {
            param([Parameter(Mandatory=$true)][string]$Path)
            $result = [System.Collections.Generic.List[object]]::new()
            if (-not (Test-Path -LiteralPath $Path)) { return @() }
            $key = Get-Item -LiteralPath $Path -ErrorAction Stop
            foreach ($name in $key.GetValueNames()) {
              if ([string]::IsNullOrWhiteSpace($name)) { continue }
              $kind = $key.GetValueKind($name).ToString()
              $raw = $key.GetValue($name,$null,[Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
              $entry = [ordered]@{ path=$Path; name=$name; kind=$kind; value=$null; value_b64=''; value_multi=@() }
              if ($raw -is [byte[]]) { $entry.value_b64 = [Convert]::ToBase64String($raw) }
              elseif ($raw -is [string[]]) { $entry.value_multi = @($raw) }
              else { $entry.value = $raw }
              [void]$result.Add([pscustomobject]$entry)
            }
            return @($result)
          }
          $valueRoots = @(
            'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment',
            'HKCU:\Environment',
            'HKLM:\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\FirewallRules',
            'HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\FirewallRules',
            'HKLM:\SOFTWARE\RegisteredApplications',
            'HKCU:\SOFTWARE\RegisteredApplications',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Shell Extensions\Approved',
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Shell Extensions\Approved'
          )
          $values = [System.Collections.Generic.List[object]]::new()
          foreach ($root in $valueRoots) { foreach ($entry in @(Get-RegistryValueInventory -Path $root)) { [void]$values.Add($entry) } }
          ConvertTo-Json -InputObject @($values) -Depth 8 | Set-Content -LiteralPath (Join-Path $baselineRoot 'installer-registry-values.json') -Encoding UTF8
          Write-Host "MANAGED_WINDOWS_INSTALLER_BASELINE_FINAL services=$($baselineServices.Count) drivers=$($baselineDrivers.Count) pnp=$($pnpIds.Count) values=$($values.Count)"

      - name: Restore latest Windows user backup
        if: ${{ inputs.mode == 'restore' }}
        uses: actions/cache/restore@v5
        with:
          path: '${{ runner.temp }}\managed-desktop-backup'
          key: managed-desktop-windows-${{ inputs.machine_id }}-restore-${{ github.run_id }}
          restore-keys: |
            managed-desktop-windows-${{ inputs.machine_id }}-

      - name: Restore Windows software delta
        if: ${{ inputs.mode == 'restore' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $restoreRoot = Join-Path $env:RUNNER_TEMP 'managed-desktop-backup'
          $stateRoot = Join-Path $restoreRoot 'state'
          $softwareRoot = Join-Path $restoreRoot 'software'
          $manifestPath = Join-Path $stateRoot 'software-roots.json'
          if (-not (Test-Path -LiteralPath $manifestPath) -or -not (Test-Path -LiteralPath $softwareRoot)) {
            Write-Host 'MANAGED_WINDOWS_SOFTWARE_DELTA_LEGACY_BACKUP none'
            exit 0
          }

          $restoredRoots = 0
          $manifestEntries = @(Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json)
          $backupVersion = 1
          $metadataPath = Join-Path $restoreRoot 'metadata.json'
          if (Test-Path -LiteralPath $metadataPath) {
            try { $backupVersion = [int](Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json).version } catch { }
          }
          $fixedVolumes = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' -ErrorAction SilentlyContinue | Where-Object { $_.DeviceID } | ForEach-Object {
            [void]$fixedVolumes.Add(([string]$_.DeviceID).ToUpperInvariant())
          }
          foreach ($entry in $manifestEntries) {
            $volume = ([string]$entry.volume).ToUpperInvariant()
            $relative = ([string]$entry.relative).TrimStart('\')
            if ($volume -notmatch '^[A-Z]:$' -or -not $fixedVolumes.Contains($volume)) { throw "Software restore volume is unavailable/unsafe: $volume" }
            if ([string]::IsNullOrWhiteSpace($relative) -or [IO.Path]::IsPathRooted($relative) -or $relative.Split('\') -contains '..') { throw "Unsafe software restore relative path: $relative" }
            $volumeKey = $volume.TrimEnd(':')
            $source = Join-Path (Join-Path $softwareRoot $volumeKey) $relative
            if (-not (Test-Path -LiteralPath $source -PathType Container)) { Write-Warning "Software backup root missing: $volume/$relative"; continue }
            $destination = Join-Path "$volume\" $relative
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            & robocopy.exe $source $destination /E /COPY:DAT /DCOPY:DAT /R:2 /W:1 /XJ /NFL /NDL /NP | Out-Host
            $copyExit = $LASTEXITCODE
            if ($copyExit -ge 8) { throw "Software restore failed exit=$copyExit root=$volume/$relative" }
            $restoredRoots++
            Write-Host "MANAGED_WINDOWS_SOFTWARE_ROOT_RESTORED volume=$volume relative=$relative exit=$copyExit"
          }
          if ($backupVersion -ge 9 -and $restoredRoots -lt @($manifestEntries).Count) {
            throw "V9 software-root restore incomplete expected=$(@($manifestEntries).Count) actual=$restoredRoots"
          }
          Write-Host "MANAGED_WINDOWS_SOFTWARE_FILES_RESTORED roots=$restoredRoots"
          # Robocopy uses exit codes 1-7 for successful copies. GitHub's pwsh wrapper
          # propagates the last native exit code unless we normalize it explicitly.
          exit 0

      - name: Bind managed desktop to runner session and restore profile data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $username = $env:DESKTOP_USERNAME
          $secure = ConvertTo-SecureString $env:CLOUD_PASSWORD -AsPlainText -Force

          # Use the GitHub runner's existing local SID/profile/session as the managed desktop.
          # In restore mode, overlay the profile before Rename-LocalUser so the rename remains
          # the final identity operation, matching the proven fresh-start timing path.
          $currentSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $runnerUser = Get-LocalUser | Where-Object { $_.SID.Value -eq $currentSid } | Select-Object -First 1
          if ($null -eq $runnerUser) { throw "Current runner identity is not a local Windows account: $currentSid" }
          $existingTarget = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if ($null -ne $existingTarget -and $existingTarget.SID.Value -ne $currentSid) {
            throw "desktop_username '$username' is already used by another local SID"
          }
          $originalName = [string]$runnerUser.Name
          $sid = $currentSid
          $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"
          $profileRoot = (Get-ItemProperty -Path $profileKey -ErrorAction SilentlyContinue).ProfileImagePath
          if ([string]::IsNullOrWhiteSpace($profileRoot)) { $profileRoot = $env:USERPROFILE }
          $profileRoot = [Environment]::ExpandEnvironmentVariables($profileRoot)
          if (-not (Test-Path -LiteralPath $profileRoot)) { throw "Runner profile not found: $profileRoot" }

          function Write-ManagedRdpProbe {
            param([Parameter(Mandatory=$true)][string]$Stage)
            $tcp = [bool](Get-NetTCPConnection -State Listen -LocalPort 3389 -ErrorAction SilentlyContinue)
            $term = Get-Service TermService -ErrorAction SilentlyContinue
            $termStatus = if ($null -eq $term) { 'missing' } else { [string]$term.Status }
            $tokenName = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
            $sidAccount = Get-LocalUser | Where-Object { $_.SID.Value -eq $currentSid } | Select-Object -First 1
            $accountName = if ($null -eq $sidAccount) { 'missing' } else { [string]$sidAccount.Name }
            $netstatLine = @(& netstat.exe -ano -p tcp 2>$null | Select-String -Pattern ':3389\s+.*LISTENING' | ForEach-Object { $_.Line.Trim() }) -join ';'
            if ([string]::IsNullOrWhiteSpace($netstatLine)) { $netstatLine = 'none' }
            Write-Host "MANAGED_RDP_PROBE stage=$Stage tcp3389=$tcp termService=$termStatus token=$tokenName sidAccount=$accountName netstat=$netstatLine"
          }

          Write-ManagedRdpProbe -Stage 'step10-before-profile'

          if ($env:MACHINE_MODE -eq 'restore') {
            $restoreRoot = Join-Path $env:RUNNER_TEMP 'managed-desktop-backup'
            $restoreProfile = Join-Path $restoreRoot 'profile'
            $metadataPath = Join-Path $restoreRoot 'metadata.json'
            if (-not (Test-Path $metadataPath) -or -not (Test-Path $restoreProfile)) {
              throw 'Restore mode requested, but no managed Windows backup was found.'
            }
            $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
            if ([string]$metadata.system_type -ne 'windows') { throw 'Backup system type is not Windows.' }
            if ([string]$metadata.machine_id -ne [string]$env:MACHINE_ID) { throw 'Backup machine ID does not match this instance.' }

            # The workflow itself runs inside this same Windows profile. A small set of
            # Windows shell/cache databases is therefore legitimately locked on the
            # destination even before RDP is published. They are volatile runtime cache,
            # not durable user state; registry state is restored separately below.
            # Keep machine-bound Windows shell/runtime state from the fresh runner.
            # Only portable user/application data is overlaid from the previous VM.
            $volatileDirs = @(
              'AppData\Local\Temp',
              'AppData\Local\Microsoft\Windows',
              'AppData\Local\Microsoft\TokenBroker',
              'AppData\Local\Microsoft\IdentityCache',
              'AppData\Local\Microsoft\OneAuth',
              'AppData\Local\ConnectedDevicesPlatform',
              'AppData\Local\D3DSCache',
              'AppData\Local\CrashDumps',
              'AppData\Local\Packages\Microsoft.Windows.Search_cw5n1h2txyewy',
              'AppData\Local\Packages\Microsoft.Windows.StartMenuExperienceHost_cw5n1h2txyewy',
              'AppData\Local\Packages\Microsoft.Windows.ShellExperienceHost_cw5n1h2txyewy',
              'AppData\Local\Packages\MicrosoftWindows.Client.CBS_cw5n1h2txyewy',
              'AppData\Local\Packages\Microsoft.Windows.CloudExperienceHost_cw5n1h2txyewy',
              'AppData\Local\Packages\Microsoft.AAD.BrokerPlugin_cw5n1h2txyewy'
            )
            $volatileFiles = @(
              'AppData\Local\Packages\Microsoft.Windows.Search_cw5n1h2txyewy\Settings\settings.dat',
              'AppData\Local\Packages\Microsoft.Windows.StartMenuExperienceHost_cw5n1h2txyewy\Settings\settings.dat'
            )
            # Credential/DPAPI stores are deliberately copied, but Windows may rewrite
            # their encrypted records immediately on a new runner. Verify presence/count
            # separately instead of requiring byte-for-byte stability after copy.
            $nonByteStableVerifyDirs = @(
              'AppData\Roaming\Microsoft\Protect',
              'AppData\Roaming\Microsoft\Credentials',
              'AppData\Local\Microsoft\Credentials',
              'AppData\Local\Microsoft\Vault'
            )
            # Keep verification aligned with robocopy /XF. These are transactional/
            # runtime files that are intentionally not overlaid onto the live runner profile.
            $volatileLeafFiles = @(
              'NTUSER.DAT*',
              'ntuser.ini',
              'UsrClass.dat*',
              'WebCacheLock.dat',
              'iconcache_*.db',
              'thumbcache_*.db',
              'settings.dat.LOG*',
              'WPNPRMRY.tmp',
              'wpndatabase.db-shm',
              'wpndatabase.db-wal',
              'StartupProfileData-*'
            )
            function Test-ManagedVolatilePath {
              param([Parameter(Mandatory=$true)][string]$Relative)
              $normalized = $Relative.Replace('/','\').TrimStart('\')
              foreach ($dir in $volatileDirs) {
                if ($normalized.Equals($dir, [System.StringComparison]::OrdinalIgnoreCase) -or
                    $normalized.StartsWith("$dir\", [System.StringComparison]::OrdinalIgnoreCase)) { return $true }
              }
              foreach ($pattern in $volatileFiles) {
                if ($normalized -like $pattern) { return $true }
              }
              $leaf = [IO.Path]::GetFileName($normalized)
              foreach ($pattern in $volatileLeafFiles) {
                if ($leaf -like $pattern) { return $true }
              }
              return $false
            }
            function Test-ManagedNonByteStableVerifyPath {
              param([Parameter(Mandatory=$true)][string]$Relative)
              $normalized = $Relative.Replace('/','\').TrimStart('\')
              foreach ($dir in $nonByteStableVerifyDirs) {
                if ($normalized.Equals($dir, [System.StringComparison]::OrdinalIgnoreCase) -or
                    $normalized.StartsWith("$dir\", [System.StringComparison]::OrdinalIgnoreCase)) { return $true }
              }
              return $false
            }

            $restoreArgs = @(
              $restoreProfile, $profileRoot,
              '/E','/COPY:DAT','/DCOPY:DAT','/R:1','/W:1','/XJ','/NFL','/NDL','/NP',
              '/XF',
              'NTUSER.DAT*','ntuser.ini','UsrClass.dat*',
              'WebCacheLock.dat','iconcache_*.db','thumbcache_*.db','settings.dat.LOG*','WPNPRMRY.tmp','wpndatabase.db-shm','wpndatabase.db-wal','StartupProfileData-*'
            )
            $restoreArgs += '/XD'
            foreach ($dir in $volatileDirs) {
              $restoreArgs += (Join-Path $restoreProfile $dir)
            }
            & robocopy.exe @restoreArgs | Out-Host
            $restoreExit = $LASTEXITCODE
            if ($restoreExit -ge 8) {
              Write-Warning "robocopy reported partial restore exit=$restoreExit; durable-file verification below decides whether restore can continue"
            } else {
              Write-Host "MANAGED_WINDOWS_PROFILE_COPY_OK exit=$restoreExit"
            }
            # Grant by the still-valid current account name. ACLs store the SID, so the
            # permission remains valid after the account is renamed below.
            & icacls.exe $profileRoot /grant:r "${originalName}:(OI)(CI)F" /T /C | Out-Null

            $checked = 0
            $skippedVolatile = 0
            $skippedNonByteStable = 0
            $repairedLive = 0
            $missing = 0
            $mismatch = 0
            $missingDetails = [System.Collections.Generic.List[string]]::new()
            $mismatchDetails = [System.Collections.Generic.List[string]]::new()

            function Repair-ManagedProfileFileExact {
              param(
                [Parameter(Mandatory=$true)][string]$Source,
                [Parameter(Mandatory=$true)][string]$Target,
                [Parameter(Mandatory=$true)][string]$Relative
              )
              $lastError = ''
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                try {
                  $parent = [IO.Path]::GetDirectoryName($Target)
                  if ($parent) { New-Item -ItemType Directory -Path $parent -Force -ErrorAction Stop | Out-Null }
                  Copy-Item -LiteralPath $Source -Destination $Target -Force -ErrorAction Stop
                  if (-not (Test-Path -LiteralPath $Target -PathType Leaf)) { throw 'target disappeared immediately after targeted replay' }
                  $sourceLength = (Get-Item -LiteralPath $Source -Force -ErrorAction Stop).Length
                  $targetLength = (Get-Item -LiteralPath $Target -Force -ErrorAction Stop).Length
                  if ($sourceLength -ne $targetLength) { throw "length mismatch source=$sourceLength target=$targetLength" }
                  $sourceHash = (Get-FileHash -LiteralPath $Source -Algorithm SHA256 -ErrorAction Stop).Hash
                  $targetHash = (Get-FileHash -LiteralPath $Target -Algorithm SHA256 -ErrorAction Stop).Hash
                  if ($sourceHash -ne $targetHash) { throw 'SHA256 mismatch immediately after targeted replay' }
                  Write-Host "MANAGED_WINDOWS_PROFILE_TARGETED_REPLAY_OK relative=$Relative attempt=$attempt sha256=$sourceHash"
                  return $true
                } catch {
                  $lastError = $_.Exception.Message
                  Start-Sleep -Milliseconds 150
                }
              }
              Write-Warning "MANAGED_WINDOWS_PROFILE_TARGETED_REPLAY_FAILED relative=$Relative error=$lastError"
              return $false
            }

            Get-ChildItem -LiteralPath $restoreProfile -Recurse -File -Force -ErrorAction SilentlyContinue | ForEach-Object {
              $source = $_.FullName
              $relative = $source.Substring($restoreProfile.Length).TrimStart('\')
              if (Test-ManagedVolatilePath -Relative $relative) { $skippedVolatile++; return }
              $target = Join-Path $profileRoot $relative
              $checked++
              if (Test-ManagedNonByteStableVerifyPath -Relative $relative) {
                $skippedNonByteStable++
                return
              }
              if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
                if (Repair-ManagedProfileFileExact -Source $source -Target $target -Relative $relative) { $repairedLive++; return }
                $missing++
                if ($missingDetails.Count -lt 20) { [void]$missingDetails.Add($relative) }
                return
              }
              $targetLength = (Get-Item -LiteralPath $target -Force).Length
              if ($targetLength -ne $_.Length) {
                if (Repair-ManagedProfileFileExact -Source $source -Target $target -Relative $relative) { $repairedLive++; return }
                $mismatch++
                if ($mismatchDetails.Count -lt 20) {
                  [void]$mismatchDetails.Add("$relative sourceBytes=$($_.Length) targetBytes=$targetLength")
                }
              }
            }
            foreach ($detail in $missingDetails) { Write-Warning "MANAGED_WINDOWS_PROFILE_VERIFY_MISSING $detail" }
            foreach ($detail in $mismatchDetails) { Write-Warning "MANAGED_WINDOWS_PROFILE_VERIFY_MISMATCH $detail" }
            if ($missing -gt 0 -or $mismatch -gt 0) {
              throw "Windows profile restore verification failed: checked=$checked skippedVolatile=$skippedVolatile skippedNonByteStable=$skippedNonByteStable repairedLive=$repairedLive missing=$missing sizeMismatch=$mismatch"
            }
            Write-Host "MANAGED_WINDOWS_PROFILE_VERIFY_OK files=$checked skippedVolatile=$skippedVolatile skippedNonByteStable=$skippedNonByteStable repairedLive=$repairedLive"
            Write-Host 'MANAGED_DESKTOP_RESTORE_APPLIED'
            Write-Host 'MANAGED_DESKTOP_RESTORE_APPLIED'
          } else {
            Write-Host 'MANAGED_DESKTOP_FRESH_START'
          }

          Write-ManagedRdpProbe -Stage 'step10-after-profile-before-rename'

          # Rename only after all potentially long profile I/O. The SID/profile/session stay
          # unchanged; this minimizes the interval where the current token still shows the
          # pre-rename account name before the final RDP verification.
          if ($originalName -ne $username) {
            Rename-LocalUser -Name $originalName -NewName $username
          }
          Set-LocalUser -Name $username -Password $secure -PasswordNeverExpires $true
          Enable-LocalUser -Name $username
          foreach ($group in @('Administrators','Remote Desktop Users')) {
            try { Add-LocalGroupMember -Group $group -Member $username -ErrorAction Stop } catch { }
          }
          $renamedUser = Get-LocalUser -Name $username -ErrorAction Stop
          if ($renamedUser.SID.Value -ne $currentSid) { throw 'Managed desktop SID changed unexpectedly' }
          Write-Host "MANAGED_WINDOWS_BASE_IDENTITY=$originalName->$username sid=$currentSid profile=$profileRoot"
          Write-ManagedRdpProbe -Stage 'step10-after-rename'
          Write-Host "MANAGED_DESKTOP_ACCOUNT_READY=$username"
      - name: Restore Windows state v2
        if: ${{ inputs.mode == 'restore' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $restoreRoot = Join-Path $env:RUNNER_TEMP 'managed-desktop-backup'
          $stateRoot = Join-Path $restoreRoot 'state'
          $metadataPath = Join-Path $restoreRoot 'metadata.json'
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          $version = if ($null -eq $metadata.version) { 1 } else { [int]$metadata.version }
          if ($version -lt 2 -or -not (Test-Path -LiteralPath $stateRoot)) {
            Write-Host 'MANAGED_WINDOWS_LEGACY_BACKUP_RESTORED profile-only'
            exit 0
          }

          $username = $env:DESKTOP_USERNAME
          $sid = (Get-LocalUser -Name $username -ErrorAction Stop).SID.Value
          $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"
          $profileRoot = (Get-ItemProperty -Path $profileKey -ErrorAction SilentlyContinue).ProfileImagePath
          if ([string]::IsNullOrWhiteSpace($profileRoot)) { $profileRoot = $env:USERPROFILE }
          $profileRoot = [Environment]::ExpandEnvironmentVariables($profileRoot)

          function Write-ManagedRdpProbe {
            param([Parameter(Mandatory=$true)][string]$Stage)
            $tcp = [bool](Get-NetTCPConnection -State Listen -LocalPort 3389 -ErrorAction SilentlyContinue)
            $term = Get-Service TermService -ErrorAction SilentlyContinue
            $termStatus = if ($null -eq $term) { 'missing' } else { [string]$term.Status }
            $tokenName = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
            $sidAccount = Get-LocalUser | Where-Object { $_.SID.Value -eq $sid } | Select-Object -First 1
            $accountName = if ($null -eq $sidAccount) { 'missing' } else { [string]$sidAccount.Name }
            $netstatLine = @(& netstat.exe -ano -p tcp 2>$null | Select-String -Pattern ':3389\s+.*LISTENING' | ForEach-Object { $_.Line.Trim() }) -join ';'
            if ([string]::IsNullOrWhiteSpace($netstatLine)) { $netstatLine = 'none' }
            Write-Host "MANAGED_RDP_PROBE stage=$Stage tcp3389=$tcp termService=$termStatus token=$tokenName sidAccount=$accountName netstat=$netstatLine"
          }

          Write-ManagedRdpProbe -Stage 'step11-start'

          # Reinstall package-managed applications first so restored AppData/registry overlays their fresh defaults.
          $softwareOk = 0
          $softwareFailed = 0
          $wingetManifest = Join-Path $stateRoot 'winget.json'
          if ((Test-Path -LiteralPath $wingetManifest) -and (Get-Command winget.exe -ErrorAction SilentlyContinue)) {
            try {
              & winget.exe import -i $wingetManifest --accept-package-agreements --accept-source-agreements --ignore-unavailable --disable-interactivity
              if ($LASTEXITCODE -eq 0) { $softwareOk++ } else { $softwareFailed++; Write-Warning "winget import exited $LASTEXITCODE" }
            } catch { $softwareFailed++; Write-Warning "winget import failed: $($_.Exception.Message)" }
          }

          $chocoManifest = Join-Path $stateRoot 'choco-packages.txt'
          if ((Test-Path -LiteralPath $chocoManifest) -and (Get-Command choco.exe -ErrorAction SilentlyContinue)) {
            Get-Content -LiteralPath $chocoManifest | ForEach-Object {
              $line = [string]$_
              if ([string]::IsNullOrWhiteSpace($line) -or $line.StartsWith('Chocolatey ')) { return }
              $parts = $line -split '\|', 2
              $name = $parts[0].Trim()
              if (-not $name) { return }
              try {
                $args = @('install', $name, '-y', '--no-progress')
                if ($parts.Count -gt 1 -and $parts[1].Trim()) { $args += @('--version', $parts[1].Trim()) }
                & choco.exe @args
                if ($LASTEXITCODE -eq 0) { $softwareOk++ } else { $softwareFailed++; Write-Warning "choco restore failed for $name" }
              } catch { $softwareFailed++; Write-Warning "choco restore failed for ${name}: $($_.Exception.Message)" }
            }
          }

          $scoopManifest = Join-Path $stateRoot 'scoop.json'
          if ((Test-Path -LiteralPath $scoopManifest) -and (Get-Command scoop -ErrorAction SilentlyContinue)) {
            try {
              & scoop import $scoopManifest
              if ($LASTEXITCODE -eq 0) { $softwareOk++ } else { $softwareFailed++; Write-Warning "scoop import exited $LASTEXITCODE" }
            } catch { $softwareFailed++; Write-Warning "scoop import failed: $($_.Exception.Message)" }
          }
          Write-Host "MANAGED_WINDOWS_SOFTWARE_REHYDRATE packagesOk=$softwareOk packagesFailed=$softwareFailed"

          $uninstallRegistryRestored = 0
          $uninstallRegistryManifestPath = Join-Path $stateRoot 'uninstall-registry.json'
          if (Test-Path -LiteralPath $uninstallRegistryManifestPath) {
            foreach ($entry in @(Get-Content -LiteralPath $uninstallRegistryManifestPath -Raw | ConvertFrom-Json)) {
              $file = Join-Path (Join-Path $stateRoot 'uninstall-registry') ([string]$entry.file)
              if (-not (Test-Path -LiteralPath $file)) { Write-Warning "Uninstall registry backup missing for $($entry.name)"; continue }
              & reg.exe import $file | Out-Null
              if ($LASTEXITCODE -eq 0) { $uninstallRegistryRestored++ }
              else { Write-Warning "Uninstall registry restore failed for $($entry.name) exit=$LASTEXITCODE" }
            }
          }
          Write-Host "MANAGED_WINDOWS_UNINSTALL_REGISTRY_RESTORED count=$uninstallRegistryRestored"

          $appRegistryRestored = 0
          $appRegistryManifestPath = Join-Path $stateRoot 'app-registry.json'
          if (Test-Path -LiteralPath $appRegistryManifestPath) {
            foreach ($entry in @(Get-Content -LiteralPath $appRegistryManifestPath -Raw | ConvertFrom-Json)) {
              $file = Join-Path (Join-Path $stateRoot 'app-registry') ([string]$entry.file)
              if (-not (Test-Path -LiteralPath $file)) { Write-Warning "Application registry backup missing: $($entry.registry_path)"; continue }
              & reg.exe import $file | Out-Null
              if ($LASTEXITCODE -eq 0) {
                $appRegistryRestored++
                Write-Host "MANAGED_WINDOWS_APP_REGISTRY_RESTORED path=$($entry.registry_path)"
              } else { Write-Warning "Application registry restore failed: $($entry.registry_path) exit=$LASTEXITCODE" }
            }
          }

          # Restore generic installer-state deltas before driver/service activation.
          $installerCacheRestored = 0
          $installerCacheManifestPath = Join-Path $stateRoot 'installer-cache.json'
          if (Test-Path -LiteralPath $installerCacheManifestPath) {
            $liveInstallerCache = Join-Path $env:WINDIR 'Installer'
            New-Item -ItemType Directory -Path $liveInstallerCache -Force | Out-Null
            foreach ($entry in @(Get-Content -LiteralPath $installerCacheManifestPath -Raw | ConvertFrom-Json)) {
              $relative = ([string]$entry.relative).TrimStart('\')
              if (-not $relative -or [IO.Path]::IsPathRooted($relative) -or $relative.Split('\') -contains '..') { throw "Unsafe installer cache relative path: $relative" }
              $source = Join-Path (Join-Path $stateRoot 'installer-cache') $relative
              if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Installer cache payload missing: $relative" }
              $destination = Join-Path $liveInstallerCache $relative
              New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($destination)) -Force | Out-Null
              Copy-Item -LiteralPath $source -Destination $destination -Force
              $installerCacheRestored++
            }
          }

          $installerTreesRestored = 0
          $installerTreeManifestPath = Join-Path $stateRoot 'installer-registry-trees.json'
          if (Test-Path -LiteralPath $installerTreeManifestPath) {
            foreach ($entry in @(Get-Content -LiteralPath $installerTreeManifestPath -Raw | ConvertFrom-Json)) {
              $source = Join-Path (Join-Path $stateRoot 'installer-registry') ([string]$entry.file)
              if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Installer registry payload missing: $($entry.file)" }
              $importFile = $source
              $tempFile = ''
              if ($metadata.source_sid -and -not ([string]$metadata.source_sid).Equals($sid,[System.StringComparison]::OrdinalIgnoreCase)) {
                $text = Get-Content -LiteralPath $source -Raw
                if ($text.Contains([string]$metadata.source_sid)) {
                  $text = $text.Replace([string]$metadata.source_sid,$sid)
                  $tempFile = Join-Path $env:RUNNER_TEMP "installer-reg-$([guid]::NewGuid().ToString('N')).reg"
                  Set-Content -LiteralPath $tempFile -Value $text -Encoding Unicode
                  $importFile = $tempFile
                }
              }
              try {
                & reg.exe import $importFile | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "reg import exited $LASTEXITCODE" }
                $installerTreesRestored++
              } finally {
                if ($tempFile) { Remove-Item -LiteralPath $tempFile -Force -ErrorAction SilentlyContinue }
              }
            }
          }

          $installerValuesRestored = 0
          $installerValuesPath = Join-Path $stateRoot 'installer-registry-values.json'
          if (Test-Path -LiteralPath $installerValuesPath) {
            foreach ($entry in @(Get-Content -LiteralPath $installerValuesPath -Raw | ConvertFrom-Json)) {
              $path = [string]$entry.path
              $name = [string]$entry.name
              if (-not $path -or -not $name) { continue }
              New-Item -Path $path -Force | Out-Null
              $kind = [string]$entry.kind
              switch ($kind) {
                'Binary' { $value = [Convert]::FromBase64String([string]$entry.value_b64); $propertyType = 'Binary' }
                'MultiString' { $value = [string[]]@($entry.value_multi); $propertyType = 'MultiString' }
                'ExpandString' { $value = [string]$entry.value; $propertyType = 'ExpandString' }
                'DWord' { $value = [int]$entry.value; $propertyType = 'DWord' }
                'QWord' { $value = [long]$entry.value; $propertyType = 'QWord' }
                default { $value = [string]$entry.value; $propertyType = 'String' }
              }
              New-ItemProperty -Path $path -Name $name -Value $value -PropertyType $propertyType -Force | Out-Null
              $installerValuesRestored++
            }
          }
          Write-Host "MANAGED_WINDOWS_INSTALLER_STATE_RESTORED cache=$installerCacheRestored registryTrees=$installerTreesRestored registryValues=$installerValuesRestored"

          $softwareAclRestored = 0
          $softwareAclManifestPath = Join-Path $stateRoot 'software-acl.json'
          if (Test-Path -LiteralPath $softwareAclManifestPath) {
            foreach ($entry in @(Get-Content -LiteralPath $softwareAclManifestPath -Raw | ConvertFrom-Json)) {
              $volume = ([string]$entry.volume).ToUpperInvariant()
              $relative = ([string]$entry.relative).TrimStart('\')
              if ($volume -notmatch '^[A-Z]:$' -or -not $relative) { throw "Invalid software ACL target volume=$volume relative=$relative" }
              $volumeRootForAcl = "$volume\"
              $aclFile = Join-Path (Join-Path $stateRoot 'software-acl') ([string]$entry.file)
              if (-not (Test-Path -LiteralPath $aclFile -PathType Leaf)) { throw "Software ACL payload missing: $($entry.file)" }
              $aclTarget = Join-Path $volumeRootForAcl $relative
              if (-not (Test-Path -LiteralPath $aclTarget)) { throw "Software ACL target is missing: $aclTarget" }
              $relativeParent = [IO.Path]::GetDirectoryName($relative)
              $aclBase = if ([string]::IsNullOrWhiteSpace($relativeParent)) { $volumeRootForAcl } else { Join-Path $volumeRootForAcl $relativeParent }
              if (-not (Test-Path -LiteralPath $aclBase -PathType Container)) { throw "Software ACL restore base is missing: $aclBase" }
              $args = @($aclBase,'/restore',$aclFile,'/c','/q')
              if ($metadata.source_sid -and -not ([string]$metadata.source_sid).Equals($sid,[System.StringComparison]::OrdinalIgnoreCase)) {
                $args += @('/substitute',[string]$metadata.source_sid,$sid)
              }
              $aclOutput = @(& icacls.exe @args 2>&1)
              $aclExit = $LASTEXITCODE
              $aclOutput | Out-Host
              if ($aclExit -ne 0) { throw "icacls restore failed exit=$aclExit base=$aclBase target=$aclTarget" }
              $failedAclLine = $aclOutput | Where-Object { [string]$_ -match '(?i)Failed processing\s+[1-9][0-9]*\s+files?' } | Select-Object -First 1
              if ($failedAclLine) { throw "icacls restore reported failed files base=$aclBase detail=$failedAclLine" }
              $softwareAclRestored++
            }
          }
          Write-Host "MANAGED_WINDOWS_SOFTWARE_ACL_RESTORED count=$softwareAclRestored"

          # Reinstall exported PnP driver packages before restoring explicit driver service
          # registrations. pnputil may assign a different oem*.inf name on the new runner;
          # that is expected and does not affect the original INF payload.
          $driverPackagesRestored = 0
          $driverPackagesFailed = 0
          $driverPackageManifestPath = Join-Path $stateRoot 'driver-packages.json'
          $driverPackages = @()
          if (Test-Path -LiteralPath $driverPackageManifestPath) {
            $driverPackages = @(Get-Content -LiteralPath $driverPackageManifestPath -Raw | ConvertFrom-Json)
            foreach ($package in $driverPackages) {
              $packageDir = Join-Path (Join-Path $stateRoot 'drivers\packages') ([string]$package.directory)
              $infFiles = @(Get-ChildItem -LiteralPath $packageDir -Filter '*.inf' -Recurse -File -ErrorAction SilentlyContinue)
              if (-not $infFiles.Count) { $driverPackagesFailed++; Write-Warning "Driver package backup has no INF: $($package.published_name)"; continue }
              $packageOk = $true
              foreach ($inf in $infFiles) {
                & pnputil.exe /add-driver $inf.FullName /install | Out-Host
                if ($LASTEXITCODE -ne 0) { $packageOk = $false }
              }
              if ($packageOk) { $driverPackagesRestored++; Write-Host "MANAGED_WINDOWS_DRIVER_PACKAGE_RESTORED source=$($package.published_name)" }
              else { $driverPackagesFailed++; Write-Warning "Driver package restore failed: $($package.published_name)" }
            }
          }

          # Restore installer-created PnP device instances after their driver packages are staged.
          $pnpDevicesRestored = 0
          $pnpDevicesFailed = 0
          $pnpPending = [System.Collections.Generic.List[object]]::new()
          $pnpManifestPath = Join-Path $stateRoot 'pnp-devices.json'
          if (Test-Path -LiteralPath $pnpManifestPath) {
            if (-not ('ManagedRootPnpInstaller' -as [type])) {
              Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class ManagedRootPnpInstaller {
              [StructLayout(LayoutKind.Sequential)]
              public struct SP_DEVINFO_DATA {
                  public int cbSize;
                  public Guid ClassGuid;
                  public int DevInst;
                  public IntPtr Reserved;
              }

              [DllImport("setupapi.dll", CharSet=CharSet.Unicode, SetLastError=true)]
              private static extern bool SetupDiGetINFClass(
                  string InfName, out Guid ClassGuid, StringBuilder ClassName, uint ClassNameSize, IntPtr RequiredSize);

              [DllImport("setupapi.dll", SetLastError=true)]
              private static extern IntPtr SetupDiCreateDeviceInfoList(ref Guid ClassGuid, IntPtr hwndParent);

              [DllImport("setupapi.dll", CharSet=CharSet.Unicode, SetLastError=true)]
              private static extern bool SetupDiCreateDeviceInfo(
                  IntPtr DeviceInfoSet, string DeviceName, ref Guid ClassGuid, string DeviceDescription,
                  IntPtr hwndParent, uint CreationFlags, ref SP_DEVINFO_DATA DeviceInfoData);

              [DllImport("setupapi.dll", SetLastError=true)]
              private static extern bool SetupDiSetDeviceRegistryProperty(
                  IntPtr DeviceInfoSet, ref SP_DEVINFO_DATA DeviceInfoData, uint Property,
                  byte[] PropertyBuffer, uint PropertyBufferSize);

              [DllImport("setupapi.dll", SetLastError=true)]
              private static extern bool SetupDiCallClassInstaller(
                  uint InstallFunction, IntPtr DeviceInfoSet, ref SP_DEVINFO_DATA DeviceInfoData);

              [DllImport("setupapi.dll", SetLastError=true)]
              private static extern bool SetupDiDestroyDeviceInfoList(IntPtr DeviceInfoSet);

              [DllImport("newdev.dll", CharSet=CharSet.Unicode, SetLastError=true)]
              private static extern bool UpdateDriverForPlugAndPlayDevices(
                  IntPtr hwndParent, string HardwareId, string FullInfPath, uint InstallFlags, out bool RebootRequired);

              private static void ThrowLast(string stage) {
                  throw new System.ComponentModel.Win32Exception(Marshal.GetLastWin32Error(), stage);
              }

              public static bool Install(string hardwareId, string deviceName, string description, string classGuidText, string infPath) {
                  Guid classGuid = new Guid(classGuidText.Trim('{','}'));
                  IntPtr set = SetupDiCreateDeviceInfoList(ref classGuid, IntPtr.Zero);
                  if (set == new IntPtr(-1)) ThrowLast("SetupDiCreateDeviceInfoList");
                  try {
                      SP_DEVINFO_DATA data = new SP_DEVINFO_DATA();
                      data.cbSize = Marshal.SizeOf(typeof(SP_DEVINFO_DATA));
                      const uint DICD_GENERATE_ID = 0x00000001;
                      if (!SetupDiCreateDeviceInfo(set, deviceName, ref classGuid, description, IntPtr.Zero, DICD_GENERATE_ID, ref data))
                          ThrowLast("SetupDiCreateDeviceInfo");
                      const uint SPDRP_HARDWAREID = 0x00000001;
                      byte[] hwid = Encoding.Unicode.GetBytes(hardwareId + "\0\0");
                      if (!SetupDiSetDeviceRegistryProperty(set, ref data, SPDRP_HARDWAREID, hwid, (uint)hwid.Length))
                          ThrowLast("SetupDiSetDeviceRegistryProperty");
                      const uint DIF_REGISTERDEVICE = 0x00000019;
                      if (!SetupDiCallClassInstaller(DIF_REGISTERDEVICE, set, ref data))
                          ThrowLast("SetupDiCallClassInstaller(DIF_REGISTERDEVICE)");
                      return false;
                  } finally {
                      SetupDiDestroyDeviceInfoList(set);
                  }
              }

              public static int Update(string hardwareId, string infPath, out bool rebootRequired) {
                  rebootRequired = false;
                  if (UpdateDriverForPlugAndPlayDevices(IntPtr.Zero, hardwareId, infPath, 0, out rebootRequired)) return 0;
                  return Marshal.GetLastWin32Error();
              }
          }
          '@
            }

            function Test-ManagedPnpDevice {
              param([Parameter(Mandatory=$true)][string]$HardwareId,[string]$ClassGuid,[switch]$RequireStarted)
              $all = (& pnputil.exe /enum-devices 2>&1) -join "`n"
              if ($LASTEXITCODE -ne 0) { throw "PnP verification inventory failed exit=$LASTEXITCODE" }
              $ids = @([regex]::Matches($all, '(?im)^\s*Instance ID\s*:\s*(.+?)\s*$') | ForEach-Object { $_.Groups[1].Value.Trim() })
              foreach ($id in $ids) {
                $detail = (& pnputil.exe /enum-devices /instanceid $id /deviceids /drivers 2>&1) -join "`n"
                if ($LASTEXITCODE -ne 0) { continue }
                $hw = [regex]::Match($detail, '(?im)^\s*Hardware IDs\s*:\s*(.+?)\s*$')
                if (-not $hw.Success -or -not $hw.Groups[1].Value.Trim().Equals($HardwareId,[System.StringComparison]::OrdinalIgnoreCase)) { continue }
                if ($ClassGuid) {
                  $cg = [regex]::Match($detail, '(?im)^\s*Class GUID\s*:\s*(\{[0-9A-Fa-f-]+\})\s*$')
                  if (-not $cg.Success -or -not $cg.Groups[1].Value.Trim().Equals($ClassGuid,[System.StringComparison]::OrdinalIgnoreCase)) { continue }
                }
                if ($RequireStarted) {
                  $st = [regex]::Match($detail, '(?im)^\s*Status\s*:\s*(.+?)\s*$')
                  if (-not $st.Success -or -not $st.Groups[1].Value.Trim().Equals('Started',[System.StringComparison]::OrdinalIgnoreCase)) { continue }
                }
                return $true
              }
              return $false
            }

            foreach ($device in @(Get-Content -LiteralPath $pnpManifestPath -Raw | ConvertFrom-Json)) {
              try {
                $hardwareId = [string]$device.hardware_id
                $classGuid = [string]$device.class_guid
                if ([string]::IsNullOrWhiteSpace($hardwareId)) { throw "PnP backup has no hardware ID for $($device.instance_id)" }
                $requireStarted = ([string]$device.status).Equals('Started',[System.StringComparison]::OrdinalIgnoreCase)
                if (-not (Test-ManagedPnpDevice -HardwareId $hardwareId -ClassGuid $classGuid -RequireStarted:$requireStarted)) {
                  if ([string]$device.restore_strategy -eq 'root-setupapi') {
                    $originalInf = [string]$device.original_inf
                    $package = $driverPackages | Where-Object { $_.original_name -and ([string]$_.original_name).Equals($originalInf,[System.StringComparison]::OrdinalIgnoreCase) } | Select-Object -First 1
                    if ($null -eq $package) { throw "No restored driver package matches original INF '$originalInf'" }
                    $packageDir = Join-Path (Join-Path $stateRoot 'drivers\packages') ([string]$package.directory)
                    $inf = Get-ChildItem -LiteralPath $packageDir -Filter $originalInf -Recurse -File -ErrorAction Stop | Select-Object -First 1
                    if ($null -eq $inf) { throw "Restored INF payload is missing: $originalInf" }
                    $description = if ([string]::IsNullOrWhiteSpace([string]$device.description)) { $hardwareId } else { [string]$device.description }
                    $instanceParts = ([string]$device.instance_id) -split '\\'
                    $deviceName = if ($instanceParts.Count -ge 3 -and $instanceParts[0] -eq 'ROOT') { $instanceParts[1] } elseif ([string]::IsNullOrWhiteSpace([string]$device.class_name)) { ($hardwareId -replace '^.*\\','') } else { [string]$device.class_name }
                    $reboot = [ManagedRootPnpInstaller]::Install($hardwareId,$deviceName,$description,$classGuid,$inf.FullName)
                    Write-Host "MANAGED_WINDOWS_PNP_ROOT_CREATED hardware=$hardwareId inf=$originalInf reboot=$reboot"
                    $updateReboot = $false
                    $updateError = [ManagedRootPnpInstaller]::Update($hardwareId,$inf.FullName,[ref]$updateReboot)
                    Write-Host "MANAGED_WINDOWS_PNP_UPDATE_RESULT hardware=$hardwareId error=$updateError reboot=$updateReboot"
                    if ($updateError -ne 0) {
                      Write-Warning "Standard PnP driver update returned Win32 error $updateError; looking for a restored DevCon fallback."
                      $devconSucceeded = $false
                      $softwareManifestPath = Join-Path $stateRoot 'software-roots.json'
                      if (Test-Path -LiteralPath $softwareManifestPath) {
                        $seenDevcon = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
                        foreach ($softwareEntry in @(Get-Content -LiteralPath $softwareManifestPath -Raw | ConvertFrom-Json)) {
                          $softwareVolume = ([string]$softwareEntry.volume).ToUpperInvariant()
                          $softwareRelative = ([string]$softwareEntry.relative).TrimStart('\\')
                          if ($softwareVolume -notmatch '^[A-Z]:$' -or -not $softwareRelative) { continue }
                          $softwareDestination = Join-Path "$softwareVolume\\" $softwareRelative
                          if (-not (Test-Path -LiteralPath $softwareDestination -PathType Container)) { continue }
                          foreach ($devcon in @(Get-ChildItem -LiteralPath $softwareDestination -Filter 'devcon.exe' -File -Recurse -ErrorAction SilentlyContinue)) {
                            if (-not $seenDevcon.Add($devcon.FullName)) { continue }
                            Write-Host "MANAGED_WINDOWS_PNP_DEVCON_TRY path=$($devcon.FullName) hardware=$hardwareId"
                            & $devcon.FullName install $inf.FullName $hardwareId | Out-Host
                            $devconExit = $LASTEXITCODE
                            Write-Host "MANAGED_WINDOWS_PNP_DEVCON_RESULT path=$($devcon.FullName) exit=$devconExit"
                            if ($devconExit -in @(0,1)) { $devconSucceeded = $true; break }
                          }
                          if ($devconSucceeded) { break }
                        }
                      }
                      if (-not $devconSucceeded) {
                        Write-Warning 'No restored DevCon candidate completed the ROOT-device install; retrying through pnputil.'
                        & pnputil.exe /add-driver $inf.FullName /install | Out-Host
                        if ($LASTEXITCODE -ne 0) { throw "PnP bind after root-device creation failed exit=$LASTEXITCODE inf=$originalInf updateError=$updateError" }
                      }
                    }
                    & pnputil.exe /scan-devices | Out-Host
                    if ($LASTEXITCODE -ne 0) { throw "PnP scan after root-device creation failed exit=$LASTEXITCODE" }
                    & pnputil.exe /enable-device /deviceid $hardwareId 2>$null | Out-Host
                    & pnputil.exe /restart-device /deviceid $hardwareId 2>$null | Out-Host
                  } else {
                    [void]$pnpPending.Add($device)
                    Write-Host "MANAGED_WINDOWS_PNP_DEFERRED hardware=$hardwareId strategy=$($device.restore_strategy)"
                    continue
                  }
                }
                $pnpReady = $false
                for ($pnpAttempt = 0; $pnpAttempt -lt 40; $pnpAttempt++) {
                  if (Test-ManagedPnpDevice -HardwareId $hardwareId -ClassGuid $classGuid -RequireStarted:$requireStarted) { $pnpReady = $true; break }
                  Start-Sleep -Milliseconds 500
                }
                if (-not $pnpReady) {
                  Write-Host "===== PNP RESTORE DIAGNOSTICS hardware=$hardwareId ====="
                  & pnputil.exe /enum-devices /deviceid $hardwareId /deviceids /drivers /services /stack 2>&1 | Out-Host
                  $setupLog = Join-Path $env:SystemRoot 'INF\setupapi.dev.log'
                  if (Test-Path -LiteralPath $setupLog) {
                    $needle = [regex]::Escape($hardwareId)
                    Get-Content -LiteralPath $setupLog -Tail 1200 -ErrorAction SilentlyContinue | Select-String -Pattern $needle,[regex]::Escape([string]$originalInf),'ROOT\\DISPLAY' -Context 2,5 | Select-Object -Last 120 | ForEach-Object { $_.ToString() } | Out-Host
                  }
                  throw "PnP device was not restored to expected state hardware=$hardwareId strategy=$($device.restore_strategy)"
                }
                $pnpDevicesRestored++
                Write-Host "MANAGED_WINDOWS_PNP_RESTORED hardware=$hardwareId strategy=$($device.restore_strategy)"
              } catch {
                $pnpDevicesFailed++
                Write-Warning "PnP device restore failed: $($_.Exception.Message)"
              }
            }
          }

          $driversRestored = 0
          $driversFailed = 0
          $driverManifestPath = Join-Path $stateRoot 'drivers.json'
          if (Test-Path -LiteralPath $driverManifestPath) {
            foreach ($driver in @(Get-Content -LiteralPath $driverManifestPath -Raw | ConvertFrom-Json)) {
              try {
                if ($driver.binary_file -and $driver.binary_path) {
                  $sourceFile = Join-Path (Join-Path $stateRoot 'drivers\files') ([string]$driver.binary_file)
                  if (-not (Test-Path -LiteralPath $sourceFile -PathType Leaf)) {
                    throw "Driver binary payload is missing: $sourceFile"
                  }
                  $targetFile = [string]$driver.binary_path
                  New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($targetFile)) -Force | Out-Null
                  $sourceHash = (Get-FileHash -LiteralPath $sourceFile -Algorithm SHA256 -ErrorAction Stop).Hash
                  $targetHash = ''
                  if (Test-Path -LiteralPath $targetFile -PathType Leaf) {
                    try { $targetHash = (Get-FileHash -LiteralPath $targetFile -Algorithm SHA256 -ErrorAction Stop).Hash } catch { $targetHash = '' }
                  }
                  if ($targetHash -and $targetHash -eq $sourceHash) {
                    Write-Host "MANAGED_WINDOWS_DRIVER_BINARY_ALREADY_MATCHED name=$($driver.name) path=$targetFile sha256=$sourceHash"
                  } else {
                    try {
                      Copy-Item -LiteralPath $sourceFile -Destination $targetFile -Force -ErrorAction Stop
                    } catch {
                      # DriverStore/PnP restore can load the driver before this generic
                      # driver-delta pass. A loaded .sys may be locked against overwrite;
                      # accept that only when the live binary is byte-identical to backup.
                      $postFailureHash = ''
                      if (Test-Path -LiteralPath $targetFile -PathType Leaf) {
                        try { $postFailureHash = (Get-FileHash -LiteralPath $targetFile -Algorithm SHA256 -ErrorAction Stop).Hash } catch { $postFailureHash = '' }
                      }
                      if (-not $postFailureHash -or $postFailureHash -ne $sourceHash) { throw }
                      Write-Host "MANAGED_WINDOWS_DRIVER_BINARY_LOCKED_MATCH name=$($driver.name) path=$targetFile sha256=$sourceHash"
                    }
                    $verifiedHash = (Get-FileHash -LiteralPath $targetFile -Algorithm SHA256 -ErrorAction Stop).Hash
                    if ($verifiedHash -ne $sourceHash) { throw "Driver binary hash mismatch after restore: $targetFile" }
                    Write-Host "MANAGED_WINDOWS_DRIVER_BINARY_VERIFIED name=$($driver.name) path=$targetFile sha256=$sourceHash"
                  }
                }
                if ($driver.registry_file) {
                  $regFile = Join-Path (Join-Path $stateRoot 'drivers') ([string]$driver.registry_file)
                  if (Test-Path -LiteralPath $regFile) {
                    & reg.exe import $regFile | Out-Null
                    if ($LASTEXITCODE -ne 0) { throw "driver registry import exited $LASTEXITCODE" }
                  }
                }
                if ([string]$driver.state -eq 'Running') { & sc.exe start ([string]$driver.name) 2>$null | Out-Null }
                $driversRestored++
                Write-Host "MANAGED_WINDOWS_DRIVER_RESTORED name=$($driver.name) path=$($driver.binary_path)"
              } catch {
                $driversFailed++
                Write-Warning "driver restore failed for $($driver.name): $($_.Exception.Message)"
              }
            }
          }

          function Restore-HiveSnapshot {
            param(
              [Parameter(Mandatory=$true)][string]$Snapshot,
              [Parameter(Mandatory=$true)][string]$TargetRoot
            )
            if (-not (Test-Path -LiteralPath $Snapshot)) { return $false }
            $targetProvider = "Registry::HKEY_USERS\$TargetRoot"
            if (-not (Test-Path $targetProvider)) { throw "Live registry target is not loaded: $TargetRoot" }

            # The managed desktop is the runner's live SID, so never unload/replace its Hive.
            # Mount the saved Hive temporarily and merge it into the already-loaded target SID.
            $mountName = "ManagedRestore_$([guid]::NewGuid().ToString('N'))"
            try {
              & reg.exe load "HKU\$mountName" $Snapshot | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "reg load failed for $Snapshot" }
              & reg.exe copy "HKU\$mountName" "HKU\$TargetRoot" /s /f | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "reg copy failed for $TargetRoot" }
            } finally {
              [gc]::Collect(); [gc]::WaitForPendingFinalizers()
              & reg.exe unload "HKU\$mountName" 2>$null | Out-Null
            }
            return $true
          }

          # Keep the fresh runner's HKCU / UsrClass shell state. Importing a previous
          # machine's complete user hives can break Explorer, Start/Search, common file
          # dialogs and RDP clipboard integration on the new VM. Portable application
          # files and explicit machine/application state are restored separately.
          $registryRestored = 0
          Write-Host 'MANAGED_WINDOWS_USER_HIVE_RESTORE_SKIPPED policy=clean-shell-v4'
          Write-ManagedRdpProbe -Stage 'step11-clean-shell-hives-skipped'

          $startupPath = Join-Path $stateRoot 'machine-startup.json'
          $startupRestored = 0
          if (Test-Path -LiteralPath $startupPath) {
            $entries = @(Get-Content -LiteralPath $startupPath -Raw | ConvertFrom-Json)
            foreach ($entry in $entries) {
              try {
                if (-not $entry.path -or -not $entry.name) { continue }
                New-Item -Path ([string]$entry.path) -Force | Out-Null
                $type = if ([string]$entry.kind -eq 'ExpandString') { 'ExpandString' } else { 'String' }
                New-ItemProperty -Path ([string]$entry.path) -Name ([string]$entry.name) -Value ([string]$entry.value) -PropertyType $type -Force | Out-Null
                $startupRestored++
              } catch { Write-Warning "startup restore failed: $($_.Exception.Message)" }
            }
          }

          $startupApprovedRestored = 0
          $startupApprovedPath = Join-Path $stateRoot 'startup-approved.json'
          if (Test-Path -LiteralPath $startupApprovedPath) {
            foreach ($entry in @(Get-Content -LiteralPath $startupApprovedPath -Raw | ConvertFrom-Json)) {
              try {
                if (-not $entry.path -or -not $entry.name -or -not $entry.value_b64) { continue }
                New-Item -Path ([string]$entry.path) -Force | Out-Null
                $bytes = [Convert]::FromBase64String([string]$entry.value_b64)
                New-ItemProperty -Path ([string]$entry.path) -Name ([string]$entry.name) -Value $bytes -PropertyType Binary -Force | Out-Null
                $startupApprovedRestored++
              } catch { Write-Warning "StartupApproved restore failed: $($_.Exception.Message)" }
            }
          }

          $commonStartupRestored = 0
          $commonStartupManifestPath = Join-Path $stateRoot 'common-startup.json'
          $commonStartup = [Environment]::GetFolderPath('CommonStartup')
          if ($commonStartup -and (Test-Path -LiteralPath $commonStartupManifestPath)) {
            foreach ($entry in @(Get-Content -LiteralPath $commonStartupManifestPath -Raw | ConvertFrom-Json)) {
              try {
                $relative = ([string]$entry.relative).TrimStart('\')
                if (-not $relative -or [IO.Path]::IsPathRooted($relative) -or $relative.Split('\') -contains '..') { continue }
                $source = Join-Path (Join-Path $stateRoot 'common-startup') $relative
                if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { continue }
                $destination = Join-Path $commonStartup $relative
                New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($destination)) -Force | Out-Null
                Copy-Item -LiteralPath $source -Destination $destination -Force
                $commonStartupRestored++
              } catch { Write-Warning "common startup restore failed: $($_.Exception.Message)" }
            }
          }

          $taskManifestPath = Join-Path $stateRoot 'scheduled-tasks.json'
          $taskRestored = 0
          if (Test-Path -LiteralPath $taskManifestPath) {
            $tasks = @(Get-Content -LiteralPath $taskManifestPath -Raw | ConvertFrom-Json)
            foreach ($task in $tasks) {
              try {
                $xmlPath = Join-Path (Join-Path $stateRoot 'tasks') ([string]$task.file)
                if (-not (Test-Path -LiteralPath $xmlPath)) { continue }
                $xml = Get-Content -LiteralPath $xmlPath -Raw
                if ($metadata.source_sid) { $xml = $xml.Replace([string]$metadata.source_sid, $sid) }
                Register-ScheduledTask -TaskName ([string]$task.name) -TaskPath ([string]$task.path) -Xml $xml -Force | Out-Null
                $taskRestored++
              } catch { Write-Warning "scheduled task restore failed: $($_.Exception.Message)" }
            }
          }

          $servicesPath = Join-Path $stateRoot 'auto-services.json'
          $serviceRestored = 0
          if ($version -lt 11 -and (Test-Path -LiteralPath $servicesPath)) {
            $services = @(Get-Content -LiteralPath $servicesPath -Raw | ConvertFrom-Json)
            foreach ($saved in $services) {
              try {
                if (Get-Service -Name ([string]$saved.name) -ErrorAction SilentlyContinue) {
                  Set-Service -Name ([string]$saved.name) -StartupType Automatic
                  $serviceRestored++
                }
              } catch { Write-Warning "service startup restore failed: $($_.Exception.Message)" }
            }
          }


          $serviceDeltaRestored = 0
          $serviceDeltaFailed = 0
          $serviceDeltaPath = Join-Path $stateRoot 'services-delta.json'
          if (Test-Path -LiteralPath $serviceDeltaPath) {
            foreach ($saved in @(Get-Content -LiteralPath $serviceDeltaPath -Raw | ConvertFrom-Json)) {
              $name = [string]$saved.name
              if ([string]::IsNullOrWhiteSpace($name) -or [string]::IsNullOrWhiteSpace([string]$saved.path)) { continue }
              try {
                & sc.exe query $name 2>$null | Out-Null
                $exists = ($LASTEXITCODE -eq 0)
                $startValue = switch ([int]$saved.start) { 0 {'boot'} 1 {'system'} 2 {'auto'} 4 {'disabled'} default {'demand'} }
                $errorValue = switch ([int]$saved.error_control) { 0 {'ignore'} 2 {'severe'} 3 {'critical'} default {'normal'} }
                $typeValue = if (([int64]$saved.type -band 0x20) -ne 0) { 'share' } else { 'own' }
                $startName = [string]$saved.start_name
                $safeObjectName = ''
                if ([string]::IsNullOrWhiteSpace($startName) -or $startName -in @('LocalSystem','NT AUTHORITY\LocalSystem')) { $safeObjectName = 'LocalSystem' }
                elseif ($startName -match '^(?i)NT AUTHORITY\\(LocalService|NetworkService)$' -or $startName -match '^(?i)NT SERVICE\\') { $safeObjectName = $startName }
                else { $safeObjectName = 'LocalSystem'; Write-Warning "Service $name uses credentialed account '$startName'; no password is stored, restoring service account as LocalSystem." }

                if (-not $exists) {
                  $createArgs = @('create', $name, 'binPath=', [string]$saved.path, 'start=', $startValue, 'type=', $typeValue, 'error=', $errorValue)
                  if ($saved.display_name) { $createArgs += @('DisplayName=', [string]$saved.display_name) }
                  if ($safeObjectName) { $createArgs += @('obj=', $safeObjectName) }
                  if (@($saved.depend_on_service).Count) { $createArgs += @('depend=', (@($saved.depend_on_service) -join '/')) }
                  & sc.exe @createArgs | Out-Host
                  if ($LASTEXITCODE -ne 0) { throw "sc create exited $LASTEXITCODE" }
                  Write-Host "MANAGED_WINDOWS_SERVICE_CREATED name=$name start=$startValue type=$typeValue"
                }

                # Reapply the complete installer-created registry subtree (FailureActions,
                # RequiredPrivileges, delayed start, service SID metadata, parameters, etc.).
                if ($saved.registry_file) {
                  $regFile = Join-Path (Join-Path $stateRoot 'services') ([string]$saved.registry_file)
                  if (-not (Test-Path -LiteralPath $regFile -PathType Leaf)) { throw "Service registry payload is missing: $regFile" }
                  & reg.exe import $regFile | Out-Null
                  if ($LASTEXITCODE -ne 0) { throw "service registry import exited $LASTEXITCODE" }
                }

                # Explicit sc config keeps SCM's live configuration synchronized with imported registry data.
                $configArgs = @('config', $name, 'binPath=', [string]$saved.path, 'start=', $startValue, 'type=', $typeValue, 'error=', $errorValue)
                if ($saved.display_name) { $configArgs += @('DisplayName=', [string]$saved.display_name) }
                if ($safeObjectName) { $configArgs += @('obj=', $safeObjectName) }
                if (@($saved.depend_on_service).Count) { $configArgs += @('depend=', (@($saved.depend_on_service) -join '/')) }
                & sc.exe @configArgs | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "sc config exited $LASTEXITCODE" }

                if ($saved.sddl) {
                  $serviceSddl = [string]$saved.sddl
                  if ($metadata.source_sid) { $serviceSddl = $serviceSddl.Replace([string]$metadata.source_sid,$sid) }
                  & sc.exe sdset $name $serviceSddl | Out-Null
                  if ($LASTEXITCODE -ne 0) { throw "sc sdset exited $LASTEXITCODE" }
                }
                if ([string]$saved.state -eq 'Running') {
                  & sc.exe start $name 2>$null | Out-Null
                  Start-Sleep -Milliseconds 500
                  $query = (& sc.exe query $name 2>&1) -join "`n"
                  if ($query -notmatch '(?im)^\s*STATE\s*:\s*4\s+RUNNING\b') { throw 'service did not reach RUNNING state' }
                }
                $serviceDeltaRestored++
                Write-Host "MANAGED_WINDOWS_SERVICE_RESTORED name=$name state=$($saved.state)"
              } catch {
                $serviceDeltaFailed++
                Write-Warning "service delta restore failed for ${name}: $($_.Exception.Message)"
              }
            }
          }
          if ($pnpPending.Count -gt 0) {
            & pnputil.exe /scan-devices | Out-Host
            foreach ($device in $pnpPending) {
              $hardwareId = [string]$device.hardware_id
              $classGuid = [string]$device.class_guid
              $requireStarted = ([string]$device.status).Equals('Started',[System.StringComparison]::OrdinalIgnoreCase)
              if (Test-ManagedPnpDevice -HardwareId $hardwareId -ClassGuid $classGuid -RequireStarted:$requireStarted) {
                $pnpDevicesRestored++
                Write-Host "MANAGED_WINDOWS_PNP_LATE_RESTORED hardware=$hardwareId strategy=$($device.restore_strategy)"
              } else {
                $pnpDevicesFailed++
                Write-Warning "PnP device did not materialize after complete installer-state restore hardware=$hardwareId strategy=$($device.restore_strategy)"
              }
            }
          }

          if ($version -ge 9) {
            $expectedAppRegistry = if ($null -eq $metadata.app_registry_count) { 0 } else { [int]$metadata.app_registry_count }
            $expectedStartup = if ($null -eq $metadata.machine_startup_count) { 0 } else { [int]$metadata.machine_startup_count }
            $expectedStartupApproved = if ($null -eq $metadata.startup_approved_count) { 0 } else { [int]$metadata.startup_approved_count }
            $expectedCommonStartup = if ($null -eq $metadata.common_startup_count) { 0 } else { [int]$metadata.common_startup_count }
            $expectedDrivers = if ($null -eq $metadata.driver_delta_count) { 0 } else { [int]$metadata.driver_delta_count }
            $expectedDriverPackages = if ($null -eq $metadata.driver_package_delta_count) { 0 } else { [int]$metadata.driver_package_delta_count }
            if ($appRegistryRestored -lt $expectedAppRegistry) { throw "V$version app registry restore incomplete expected=$expectedAppRegistry actual=$appRegistryRestored" }
            if ($startupRestored -lt $expectedStartup) { throw "V$version startup restore incomplete expected=$expectedStartup actual=$startupRestored" }
            if ($startupApprovedRestored -lt $expectedStartupApproved) { throw "V$version StartupApproved restore incomplete expected=$expectedStartupApproved actual=$startupApprovedRestored" }
            if ($commonStartupRestored -lt $expectedCommonStartup) { throw "V$version common Startup restore incomplete expected=$expectedCommonStartup actual=$commonStartupRestored" }
            if ($driversRestored -lt $expectedDrivers -or $driversFailed -gt 0) { throw "V$version driver restore incomplete expected=$expectedDrivers actual=$driversRestored failed=$driversFailed" }
            if ($driverPackagesRestored -lt $expectedDriverPackages -or $driverPackagesFailed -gt 0) { throw "V$version driver package restore incomplete expected=$expectedDriverPackages actual=$driverPackagesRestored failed=$driverPackagesFailed" }
          }
          if ($version -ge 11) {
            $expectedServices = if ($null -eq $metadata.software_service_delta_count) { 0 } else { [int]$metadata.software_service_delta_count }
            $expectedPnpDevices = if ($null -eq $metadata.pnp_device_delta_count) { 0 } else { [int]$metadata.pnp_device_delta_count }
            $expectedSoftwareAcl = if ($null -eq $metadata.software_acl_count) { 0 } else { [int]$metadata.software_acl_count }
            $expectedInstallerValues = if ($null -eq $metadata.installer_registry_value_delta_count) { 0 } else { [int]$metadata.installer_registry_value_delta_count }
            $expectedInstallerTrees = if ($null -eq $metadata.installer_registry_tree_delta_count) { 0 } else { [int]$metadata.installer_registry_tree_delta_count }
            $expectedInstallerCache = if ($null -eq $metadata.installer_cache_delta_count) { 0 } else { [int]$metadata.installer_cache_delta_count }
            if ($serviceDeltaRestored -lt $expectedServices -or $serviceDeltaFailed -gt 0) { throw "V11 service restore incomplete expected=$expectedServices actual=$serviceDeltaRestored failed=$serviceDeltaFailed" }
            if ($pnpDevicesRestored -lt $expectedPnpDevices -or $pnpDevicesFailed -gt 0) { throw "V11 PnP restore incomplete expected=$expectedPnpDevices actual=$pnpDevicesRestored failed=$pnpDevicesFailed" }
            if ($softwareAclRestored -lt $expectedSoftwareAcl) { throw "V11 software ACL restore incomplete expected=$expectedSoftwareAcl actual=$softwareAclRestored" }
            if ($installerValuesRestored -lt $expectedInstallerValues) { throw "V11 installer registry-value restore incomplete expected=$expectedInstallerValues actual=$installerValuesRestored" }
            if ($installerTreesRestored -lt $expectedInstallerTrees) { throw "V11 installer registry-tree restore incomplete expected=$expectedInstallerTrees actual=$installerTreesRestored" }
            if ($installerCacheRestored -lt $expectedInstallerCache) { throw "V11 installer cache restore incomplete expected=$expectedInstallerCache actual=$installerCacheRestored" }
          }
          Write-ManagedRdpProbe -Stage 'step11-end'
          Write-Host "MANAGED_WINDOWS_STATE_RESTORED version=$version registry=$registryRestored appRegistry=$appRegistryRestored uninstallRegistry=$uninstallRegistryRestored installerValues=$installerValuesRestored installerTrees=$installerTreesRestored installerCache=$installerCacheRestored softwareAcl=$softwareAclRestored startup=$startupRestored startupApproved=$startupApprovedRestored commonStartup=$commonStartupRestored tasks=$taskRestored services=$serviceRestored serviceDelta=$serviceDeltaRestored serviceFailed=$serviceDeltaFailed drivers=$driversRestored driverFailed=$driversFailed driverPackages=$driverPackagesRestored driverPackageFailed=$driverPackagesFailed pnpDevices=$pnpDevicesRestored pnpFailed=$pnpDevicesFailed softwarePackagesFailed=$softwareFailed"

      - name: Verify restored Windows application delta
        if: ${{ inputs.mode == 'restore' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $backupRoot = Join-Path $env:RUNNER_TEMP 'managed-desktop-backup'
          $stateRoot = Join-Path $backupRoot 'state'
          $deltaPath = Join-Path $stateRoot 'installed-apps-delta.json'
          $allowLegacyMissingPayload = $false
          $backupVersion = 1
          $metadataPath = Join-Path $backupRoot 'metadata.json'
          if (Test-Path -LiteralPath $metadataPath) {
            try {
              $backupMetadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
              $backupVersion = if ($null -eq $backupMetadata.version) { 1 } else { [int]$backupMetadata.version }
              $allowLegacyMissingPayload = ($backupVersion -le 7 -and [int]$backupMetadata.software_app_delta_count -gt 0 -and [int]$backupMetadata.software_root_count -eq 0)
            } catch { }
          }
          $payloadEvidenceByRegistry = @{}
          $payloadEvidencePath = Join-Path $stateRoot 'app-payload-evidence.json'
          if (Test-Path -LiteralPath $payloadEvidencePath) {
            foreach ($entry in @(Get-Content -LiteralPath $payloadEvidencePath -Raw | ConvertFrom-Json)) {
              $entryKey = ([string]$entry.registry_path).ToLowerInvariant()
              if (-not $entryKey) { continue }
              if (-not $payloadEvidenceByRegistry.ContainsKey($entryKey)) { $payloadEvidenceByRegistry[$entryKey] = @() }
              $payloadEvidenceByRegistry[$entryKey] = @($payloadEvidenceByRegistry[$entryKey]) + @($entry)
            }
          }
          if (-not (Test-Path -LiteralPath $deltaPath)) {
            Write-Host 'MANAGED_WINDOWS_APP_RESTORE_VERIFY none'
            exit 0
          }

          function Resolve-CommandExecutablePath {
            param([string]$Value)
            if ([string]::IsNullOrWhiteSpace($Value)) { return '' }
            $text = [Environment]::ExpandEnvironmentVariables($Value.Trim())
            if ($text -match '^"([A-Za-z]:\\[^\"]+?\.exe)"') { return $matches[1] }
            if ($text -match '^([A-Za-z]:\\.*?\.exe)(?:\s|$)') { return $matches[1] }
            return ''
          }

          $apps = @(Get-Content -LiteralPath $deltaPath -Raw | ConvertFrom-Json)
          $verified = 0
          foreach ($app in $apps) {
            $name = ([string]$app.name -replace '[\r\n]+',' ').Trim()
            $regPath = [string]$app.registry_path
            if ([string]::IsNullOrWhiteSpace($regPath)) { throw "Restored app has no registry path: $name" }
            $providerPath = "Registry::$regPath"
            if (-not (Test-Path -LiteralPath $providerPath)) {
              throw "Restored app uninstall registry is missing: $name path=$regPath"
            }

            $declaredEvidence = 0
            $existingEvidence = [System.Collections.Generic.List[string]]::new()
            $installLocation = [Environment]::ExpandEnvironmentVariables(([string]$app.install_location).Trim().Trim('"'))
            if ($installLocation -and [IO.Path]::IsPathRooted($installLocation)) {
              $declaredEvidence++
              if (Test-Path -LiteralPath $installLocation) { [void]$existingEvidence.Add("install:$installLocation") }
            }
            $icon = ([string]$app.display_icon -replace ',\s*-?\d+\s*$','').Trim().Trim('"')
            $icon = [Environment]::ExpandEnvironmentVariables($icon)
            if ($icon -and [IO.Path]::IsPathRooted($icon)) {
              $declaredEvidence++
              if (Test-Path -LiteralPath $icon) { [void]$existingEvidence.Add("icon:$icon") }
            }
            foreach ($commandValue in @([string]$app.uninstall, [string]$app.quiet_uninstall)) {
              $exe = Resolve-CommandExecutablePath -Value $commandValue
              if (-not $exe) { continue }
              $declaredEvidence++
              if (Test-Path -LiteralPath $exe) { [void]$existingEvidence.Add("command:$exe") }
            }
            $regKey = $regPath.ToLowerInvariant()
            foreach ($payload in @($payloadEvidenceByRegistry[$regKey])) {
              $payloadPath = [Environment]::ExpandEnvironmentVariables(([string]$payload.path).Trim().Trim('"'))
              if (-not $payloadPath -or -not [IO.Path]::IsPathRooted($payloadPath)) { continue }
              $declaredEvidence++
              if (Test-Path -LiteralPath $payloadPath -PathType Container) {
                $payloadFile = Get-ChildItem -LiteralPath $payloadPath -File -Recurse -Force -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($null -ne $payloadFile) {
                  [void]$existingEvidence.Add("payload:$payloadPath")
                  Write-Host "MANAGED_WINDOWS_APP_PAYLOAD_RESTORE_OK name=$name path=$payloadPath sample=$($payloadFile.FullName)"
                }
              }
            }
            if ($backupVersion -ge 8 -and $declaredEvidence -eq 0) {
              throw "Restored app has no payload evidence in a strict V8+ backup: $name registry=$regPath"
            }
            if ($declaredEvidence -gt 0 -and $existingEvidence.Count -eq 0) {
              if ($allowLegacyMissingPayload) {
                Write-Warning "MANAGED_WINDOWS_APP_RESTORE_LEGACY_PAYLOAD_MISSING name=$name registry=$regPath"
                $verified++
                continue
              }
              throw "Restored app payload is missing: $name registry=$regPath"
            }
            $verified++
            $evidenceText = if ($existingEvidence.Count) { $existingEvidence -join ';' } else { 'registry-only' }
            Write-Host "MANAGED_WINDOWS_APP_RESTORE_VERIFY_OK name=$name registry=$regPath evidence=$evidenceText"
          }

          if ($backupVersion -ge 9) {
            $currentSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$currentSid"
            $profileRoot = (Get-ItemProperty -Path $profileKey -ErrorAction SilentlyContinue).ProfileImagePath
            if ([string]::IsNullOrWhiteSpace($profileRoot)) { $profileRoot = $env:USERPROFILE }
            $profileRoot = [Environment]::ExpandEnvironmentVariables($profileRoot)

            $profileEvidencePath = Join-Path $stateRoot 'app-profile-evidence.json'
            $profileEvidence = @()
            if (Test-Path -LiteralPath $profileEvidencePath) { $profileEvidence = @(Get-Content -LiteralPath $profileEvidencePath -Raw | ConvertFrom-Json) }
            $expectedProfileEvidence = if ($null -eq $backupMetadata.app_profile_evidence_count) { @($profileEvidence).Count } else { [int]$backupMetadata.app_profile_evidence_count }
            if (@($profileEvidence).Count -lt $expectedProfileEvidence) { throw "V9 app profile manifest incomplete expected=$expectedProfileEvidence actual=$(@($profileEvidence).Count)" }
            foreach ($entry in $profileEvidence) {
              $relative = ([string]$entry.relative).TrimStart('\')
              if ([string]::IsNullOrWhiteSpace($relative) -or [IO.Path]::IsPathRooted($relative) -or $relative.Split('\') -contains '..') { throw "Unsafe V9 app profile evidence path: $relative" }
              $volatileProfilePrefix = 'AppData\Local\Temp'
              if ($relative.Equals($volatileProfilePrefix,[System.StringComparison]::OrdinalIgnoreCase) -or
                  $relative.StartsWith("$volatileProfilePrefix\",[System.StringComparison]::OrdinalIgnoreCase)) {
                Write-Host "MANAGED_WINDOWS_APP_PROFILE_RESTORE_VOLATILE_SKIPPED relative=$relative"
                continue
              }
              $target = Join-Path $profileRoot $relative
              if (-not (Test-Path -LiteralPath $target -PathType Container)) { throw "V9 app profile/cache directory is missing: $relative" }
              $actualMeasure = Get-ChildItem -LiteralPath $target -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object
              $expectedFiles = if ($null -eq $entry.file_count) { 0 } else { [int64]$entry.file_count }
              if ([int64]$actualMeasure.Count -lt $expectedFiles) { throw "V9 app profile/cache file count is incomplete path=$relative expected=$expectedFiles actual=$([int64]$actualMeasure.Count)" }
              Write-Host "MANAGED_WINDOWS_APP_PROFILE_RESTORE_OK relative=$relative files=$([int64]$actualMeasure.Count)"
            }

            $protectedStatePath = Join-Path $stateRoot 'protected-user-state.json'
            $protectedState = @()
            if (Test-Path -LiteralPath $protectedStatePath) { $protectedState = @(Get-Content -LiteralPath $protectedStatePath -Raw | ConvertFrom-Json) }
            foreach ($entry in $protectedState) {
              $relative = ([string]$entry.relative).TrimStart('\')
              if ([string]::IsNullOrWhiteSpace($relative) -or [IO.Path]::IsPathRooted($relative) -or $relative.Split('\') -contains '..') { throw "Unsafe protected-user-state path: $relative" }
              $target = Join-Path $profileRoot $relative
              if (-not (Test-Path -LiteralPath $target -PathType Container)) { throw "Protected user state directory is missing: $relative" }
              $actualCount = [int64]@(Get-ChildItem -LiteralPath $target -Recurse -File -Force -ErrorAction SilentlyContinue).Count
              $expectedCount = if ($null -eq $entry.file_count) { 0 } else { [int64]$entry.file_count }
              if ($actualCount -lt $expectedCount) { throw "Protected user state files are incomplete path=$relative expected=$expectedCount actual=$actualCount" }
              Write-Host "MANAGED_WINDOWS_PROTECTED_USER_STATE_RESTORED relative=$relative files=$actualCount portability=encrypted-data-only"
            }

            $startupManifestPath = Join-Path $stateRoot 'machine-startup.json'
            if (Test-Path -LiteralPath $startupManifestPath) {
              foreach ($entry in @(Get-Content -LiteralPath $startupManifestPath -Raw | ConvertFrom-Json)) {
                if (-not $entry.path -or -not $entry.name) { continue }
                $item = Get-Item -LiteralPath ([string]$entry.path) -ErrorAction Stop
                $actualValue = $item.GetValue([string]$entry.name, $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
                if ([string]$actualValue -ne [string]$entry.value) { throw "V9 startup entry mismatch path=$($entry.path) name=$($entry.name)" }
                Write-Host "MANAGED_WINDOWS_STARTUP_RESTORE_OK path=$($entry.path) name=$($entry.name)"
              }
            }

            $approvedManifestPath = Join-Path $stateRoot 'startup-approved.json'
            if (Test-Path -LiteralPath $approvedManifestPath) {
              foreach ($entry in @(Get-Content -LiteralPath $approvedManifestPath -Raw | ConvertFrom-Json)) {
                if (-not $entry.path -or -not $entry.name -or -not $entry.value_b64) { continue }
                $item = Get-Item -LiteralPath ([string]$entry.path) -ErrorAction Stop
                $actualBytes = $item.GetValue([string]$entry.name, $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
                if (-not ($actualBytes -is [byte[]]) -or [Convert]::ToBase64String($actualBytes) -ne [string]$entry.value_b64) { throw "V9 StartupApproved mismatch path=$($entry.path) name=$($entry.name)" }
                Write-Host "MANAGED_WINDOWS_STARTUP_APPROVED_RESTORE_OK path=$($entry.path) name=$($entry.name)"
              }
            }

            $commonStartupManifestPath = Join-Path $stateRoot 'common-startup.json'
            if (Test-Path -LiteralPath $commonStartupManifestPath) {
              $commonStartup = [Environment]::GetFolderPath('CommonStartup')
              foreach ($entry in @(Get-Content -LiteralPath $commonStartupManifestPath -Raw | ConvertFrom-Json)) {
                $relative = ([string]$entry.relative).TrimStart('\')
                if (-not $relative) { continue }
                if (-not (Test-Path -LiteralPath (Join-Path $commonStartup $relative) -PathType Leaf)) { throw "V9 common Startup file is missing: $relative" }
                Write-Host "MANAGED_WINDOWS_COMMON_STARTUP_RESTORE_OK relative=$relative"
              }
            }
          }
          Write-Host "MANAGED_WINDOWS_APP_RESTORE_VERIFY_COMPLETE count=$verified version=$backupVersion"

      - name: Replay restored Windows startup state
        if: ${{ inputs.mode == 'restore' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $backupRoot = Join-Path $env:RUNNER_TEMP 'managed-desktop-backup'
          $stateRoot = Join-Path $backupRoot 'state'
          $metadataPath = Join-Path $backupRoot 'metadata.json'
          if (-not (Test-Path -LiteralPath $metadataPath)) {
            Write-Host 'MANAGED_WINDOWS_STARTUP_REPLAY legacy-no-metadata'
            exit 0
          }
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          $backupVersion = if ($null -eq $metadata.version) { 1 } else { [int]$metadata.version }
          if ($backupVersion -lt 9) {
            Write-Host "MANAGED_WINDOWS_STARTUP_REPLAY legacy-version=$backupVersion"
            exit 0
          }

          $approvalState = @{}
          $approvedManifestPath = Join-Path $stateRoot 'startup-approved.json'
          if (Test-Path -LiteralPath $approvedManifestPath) {
            foreach ($entry in @(Get-Content -LiteralPath $approvedManifestPath -Raw | ConvertFrom-Json)) {
              if (-not $entry.name -or -not $entry.value_b64) { continue }
              try {
                $bytes = [Convert]::FromBase64String([string]$entry.value_b64)
                if ($bytes.Length -gt 0) {
                  # StartupApproved uses 0x02 for enabled. If Windows recorded any other
                  # state, preserve it and do not force-launch the item during restore.
                  $approvalState[([string]$entry.name).ToLowerInvariant()] = ([int]$bytes[0] -eq 2)
                }
              } catch { }
            }
          }

          function Test-StartupReplayEnabled {
            param([string]$Name)
            if ([string]::IsNullOrWhiteSpace($Name)) { return $true }
            $key = $Name.ToLowerInvariant()
            if (-not $approvalState.ContainsKey($key)) { return $true }
            return [bool]$approvalState[$key]
          }

          function Resolve-StartupCommand {
            param([string]$Value)
            if ([string]::IsNullOrWhiteSpace($Value)) { return $null }
            $text = [Environment]::ExpandEnvironmentVariables($Value.Trim())
            $exe = ''
            $args = ''
            if ($text -match '^"([^\"]+?\.exe)"(?:\s+(.*))?$') {
              $exe = $matches[1]
              if ($matches.Count -gt 2) { $args = [string]$matches[2] }
            } elseif ($text -match '^([A-Za-z]:\\.*?\.exe)(?:\s+(.*))?$') {
              $exe = $matches[1]
              if ($matches.Count -gt 2) { $args = [string]$matches[2] }
            } elseif ($text -match '^([^\s]+\.exe)(?:\s+(.*))?$') {
              $exe = $matches[1]
              if ($matches.Count -gt 2) { $args = [string]$matches[2] }
            }
            if (-not $exe) { return $null }
            $resolvedExe = $exe
            if (-not [IO.Path]::IsPathRooted($resolvedExe)) {
              $command = Get-Command $resolvedExe -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($null -ne $command -and $command.Source) { $resolvedExe = [string]$command.Source }
            }
            if (-not (Test-Path -LiteralPath $resolvedExe -PathType Leaf)) { return $null }
            return [pscustomobject]@{ exe=$resolvedExe; args=$args }
          }

          $replayed = 0
          $alreadyRunning = 0
          $disabled = 0
          $failed = 0
          $startupManifestPath = Join-Path $stateRoot 'machine-startup.json'
          if (Test-Path -LiteralPath $startupManifestPath) {
            foreach ($entry in @(Get-Content -LiteralPath $startupManifestPath -Raw | ConvertFrom-Json)) {
              $name = [string]$entry.name
              if (-not (Test-StartupReplayEnabled -Name $name)) {
                $disabled++
                Write-Host "MANAGED_WINDOWS_STARTUP_REPLAY_SKIPPED_DISABLED name=$name"
                continue
              }
              try {
                $resolved = Resolve-StartupCommand -Value ([string]$entry.value)
                if ($null -eq $resolved) { throw "startup executable could not be resolved" }
                $processName = [IO.Path]::GetFileNameWithoutExtension([string]$resolved.exe)
                if (Get-Process -Name $processName -ErrorAction SilentlyContinue | Select-Object -First 1) {
                  $alreadyRunning++
                  Write-Host "MANAGED_WINDOWS_STARTUP_REPLAY_ALREADY_RUNNING name=$name exe=$($resolved.exe)"
                } else {
                  if ([string]::IsNullOrWhiteSpace([string]$resolved.args)) {
                    Start-Process -FilePath ([string]$resolved.exe) | Out-Null
                  } else {
                    Start-Process -FilePath ([string]$resolved.exe) -ArgumentList ([string]$resolved.args) | Out-Null
                  }
                  $replayed++
                  Write-Host "MANAGED_WINDOWS_STARTUP_REPLAY_OK name=$name exe=$($resolved.exe)"
                }
                if (([string]$entry.path).EndsWith('\\RunOnce',[System.StringComparison]::OrdinalIgnoreCase)) {
                  Remove-ItemProperty -LiteralPath ([string]$entry.path) -Name $name -ErrorAction SilentlyContinue
                }
              } catch {
                $failed++
                Write-Warning "startup replay failed name=${name}: $($_.Exception.Message)"
              }
            }
          }

          $commonStartupManifestPath = Join-Path $stateRoot 'common-startup.json'
          $commonStartup = [Environment]::GetFolderPath('CommonStartup')
          if ($commonStartup -and (Test-Path -LiteralPath $commonStartupManifestPath)) {
            foreach ($entry in @(Get-Content -LiteralPath $commonStartupManifestPath -Raw | ConvertFrom-Json)) {
              $relative = ([string]$entry.relative).TrimStart('\\')
              if (-not $relative) { continue }
              $name = [IO.Path]::GetFileName($relative)
              if (-not (Test-StartupReplayEnabled -Name $name)) {
                $disabled++
                Write-Host "MANAGED_WINDOWS_COMMON_STARTUP_REPLAY_SKIPPED_DISABLED relative=$relative"
                continue
              }
              try {
                $target = Join-Path $commonStartup $relative
                if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw "Startup file is missing" }
                Start-Process -FilePath $target | Out-Null
                $replayed++
                Write-Host "MANAGED_WINDOWS_COMMON_STARTUP_REPLAY_OK relative=$relative"
              } catch {
                $failed++
                Write-Warning "common startup replay failed relative=${relative}: $($_.Exception.Message)"
              }
            }
          }

          if ($failed -gt 0) { throw "V9 startup replay incomplete failed=$failed replayed=$replayed alreadyRunning=$alreadyRunning disabled=$disabled" }
          Write-Host "MANAGED_WINDOWS_STARTUP_REPLAY_COMPLETE replayed=$replayed alreadyRunning=$alreadyRunning disabled=$disabled failed=$failed"
      - name: Verify single managed Windows session
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $currentSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $managedUser = Get-LocalUser -Name $env:DESKTOP_USERNAME -ErrorAction Stop
          if ($managedUser.SID.Value -ne $currentSid) { throw 'Managed RDP user no longer matches the runner SID' }
          if (-not $managedUser.Enabled) { throw 'Managed RDP account is disabled' }

          $terminalServer = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
          $rdpTcp = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          $rdpVerifyStartedAt = Get-Date
          function Test-RdpListener {
            if ([bool](Get-NetTCPConnection -State Listen -LocalPort 3389 -ErrorAction SilentlyContinue)) { return $true }
            $netstatListener = @(& netstat.exe -ano -p tcp 2>$null | Select-String -Pattern ':3389\s+.*LISTENING')
            return [bool]$netstatListener.Count
          }
          $initialTcp = Test-RdpListener
          $initialNetstat = @(& netstat.exe -ano -p tcp 2>$null | Select-String -Pattern ':3389\s+.*LISTENING' | ForEach-Object { $_.Line.Trim() }) -join ';'
          if ([string]::IsNullOrWhiteSpace($initialNetstat)) { $initialNetstat = 'none' }
          Write-Host "MANAGED_RDP_PROBE stage=step12-start tcp3389=$initialTcp termService=$((Get-Service TermService -ErrorAction SilentlyContinue).Status) token=$([System.Security.Principal.WindowsIdentity]::GetCurrent().Name) sidAccount=$($managedUser.Name) netstat=$initialNetstat"

          # Rename-LocalUser can make TermService drop its listener while the current
          # logon token keeps the old display name. Rebind RDP after the rename; the
          # account SID and interactive session remain unchanged.
          if (-not (Test-RdpListener)) {
            Write-Host 'RDP_REBIND_AFTER_ACCOUNT_RENAME'
            Set-ItemProperty -Path $terminalServer -Name fDenyTSConnections -Value 0 -Force
            Set-ItemProperty -Path $terminalServer -Name fSingleSessionPerUser -Value 1 -Force
            Set-ItemProperty -Path $rdpTcp -Name fEnableWinStation -Value 1 -Force
            Set-ItemProperty -Path $rdpTcp -Name PortNumber -Value 3389 -Force
            Set-ItemProperty -Path $rdpTcp -Name fDisableClip -Value 0 -Force
            Set-ItemProperty -Path $rdpTcp -Name fDisableCdm -Value 1 -Force
            $rdpPolicy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
            New-Item -Path $rdpPolicy -Force | Out-Null
            New-ItemProperty -Path $rdpPolicy -Name fSingleSessionPerUser -PropertyType DWord -Value 1 -Force | Out-Null
            New-ItemProperty -Path $rdpPolicy -Name fDisableClip -PropertyType DWord -Value 0 -Force | Out-Null
            New-ItemProperty -Path $rdpPolicy -Name fDisableCdm -PropertyType DWord -Value 1 -Force | Out-Null
            try {
              $tsSetting = Get-CimInstance -Namespace 'root/cimv2/terminalservices' -ClassName Win32_TerminalServiceSetting -ErrorAction Stop
              Write-Host "RDP_WMI_REBIND_BEFORE AllowTSConnections=$($tsSetting.AllowTSConnections) PolicySource=$($tsSetting.PolicySourceAllowTSConnections)"
              $allowResult = Invoke-CimMethod -InputObject $tsSetting -MethodName SetAllowTSConnections -Arguments @{ AllowTSConnections = [uint32]1; ModifyFirewallException = [uint32]0 } -ErrorAction Stop
              Write-Host "RDP_WMI_REBIND_RETURN=$($allowResult.ReturnValue)"
            } catch { Write-Warning "RDP WMI rebind failed: $($_.Exception.Message)" }
            foreach ($serviceName in @('SessionEnv','UmRdpService')) {
              try { Start-Service -Name $serviceName -ErrorAction SilentlyContinue } catch { }
            }
            Set-Service -Name TermService -StartupType Automatic
            Restart-Service TermService -Force
            for ($i = 0; $i -lt 60 -and -not (Test-RdpListener); $i++) {
              Start-Sleep -Seconds 1
              if ((Get-Service TermService).Status -ne 'Running') { Start-Service TermService -ErrorAction SilentlyContinue }
            }
          }

          if (-not (Test-RdpListener)) {
            Write-Host '===== POST-RENAME RDP DIAGNOSTICS ====='
            Get-Service TermService,SessionEnv,UmRdpService -ErrorAction SilentlyContinue | Format-Table Name,Status,StartType -AutoSize
            & qwinsta.exe 2>&1 | Out-Host
            Write-Host '--- netstat TCP/3389 ---'
            & netstat.exe -ano -p tcp 2>&1 | Select-String -Pattern ':3389' | ForEach-Object { $_.Line } | Out-Host
            Write-Host '--- Get-NetTCPConnection TCP/3389 ---'
            Get-NetTCPConnection -LocalPort 3389 -ErrorAction SilentlyContinue | Format-Table LocalAddress,LocalPort,RemoteAddress,RemotePort,State,OwningProcess -AutoSize
            & sc.exe queryex TermService 2>&1 | Out-Host
            & sc.exe query termdd 2>&1 | Out-Host
            Get-ItemProperty -Path $rdpTcp -ErrorAction SilentlyContinue | Select-Object fEnableWinStation,PortNumber,LanAdapter,UserAuthentication,SecurityLayer,MinEncryptionLevel | Format-List
            foreach ($logName in @('Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational','Microsoft-Windows-TerminalServices-LocalSessionManager/Operational')) {
              Write-Host "--- $logName ---"
              Get-WinEvent -FilterHashtable @{ LogName = $logName; StartTime = $rdpVerifyStartedAt.AddSeconds(-5) } -MaxEvents 50 -ErrorAction SilentlyContinue | Format-List TimeCreated,Id,LevelDisplayName,Message
            }
            Write-Host '--- System TermService / Service Control Manager ---'
            Get-WinEvent -FilterHashtable @{ LogName = 'System'; StartTime = $rdpVerifyStartedAt.AddSeconds(-5) } -MaxEvents 100 -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -in @('Service Control Manager','Microsoft-Windows-TerminalServices-RemoteConnectionManager','TermService') -or $_.Message -match 'TermService|Remote Desktop|3389' } | Select-Object -First 50 | Format-List TimeCreated,ProviderName,Id,LevelDisplayName,Message
            throw 'RDP TCP/3389 listener did not recover after account rename'
          }

          $workflowSessionId = (Get-Process -Id $PID).SessionId
          $rdpPolicy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          $userRdpPolicy = 'HKCU:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item -Path $rdpPolicy -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name fDisableClip -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name fDisableCdm -PropertyType DWord -Value 1 -Force | Out-Null
          foreach ($policyPath in @($rdpPolicy, $userRdpPolicy)) {
            Remove-ItemProperty -Path $policyPath -Name CSClipLevel -ErrorAction SilentlyContinue
            Remove-ItemProperty -Path $policyPath -Name SCClipLevel -ErrorAction SilentlyContinue
          }
          Set-ItemProperty -Path $rdpTcp -Name fDisableClip -Value 0 -Force
          Set-ItemProperty -Path $rdpTcp -Name fDisableCdm -Value 1 -Force
          $rdpClip = Get-Process -Name rdpclip -ErrorAction SilentlyContinue | Where-Object { $_.SessionId -eq $workflowSessionId } | Select-Object -First 1
          if ($null -eq $rdpClip) {
            try {
              Start-Process -FilePath (Join-Path $env:SystemRoot 'System32\rdpclip.exe') -WindowStyle Hidden
              Start-Sleep -Milliseconds 500
              $rdpClip = Get-Process -Name rdpclip -ErrorAction SilentlyContinue | Where-Object { $_.SessionId -eq $workflowSessionId } | Select-Object -First 1
            } catch { Write-Warning "rdpclip start failed: $($_.Exception.Message)" }
          }
          $policyDisableClip = (Get-ItemProperty -Path $rdpPolicy -Name fDisableClip -ErrorAction SilentlyContinue).fDisableClip
          $policyDisableCdm = (Get-ItemProperty -Path $rdpPolicy -Name fDisableCdm -ErrorAction SilentlyContinue).fDisableCdm
          $rdpTcpDisableClip = (Get-ItemProperty -Path $rdpTcp -Name fDisableClip -ErrorAction SilentlyContinue).fDisableClip
          $rdpTcpDisableCdm = (Get-ItemProperty -Path $rdpTcp -Name fDisableCdm -ErrorAction SilentlyContinue).fDisableCdm
          $machineCSClipLevel = (Get-ItemProperty -Path $rdpPolicy -Name CSClipLevel -ErrorAction SilentlyContinue).CSClipLevel
          $machineSCClipLevel = (Get-ItemProperty -Path $rdpPolicy -Name SCClipLevel -ErrorAction SilentlyContinue).SCClipLevel
          $userCSClipLevel = (Get-ItemProperty -Path $userRdpPolicy -Name CSClipLevel -ErrorAction SilentlyContinue).CSClipLevel
          $userSCClipLevel = (Get-ItemProperty -Path $userRdpPolicy -Name SCClipLevel -ErrorAction SilentlyContinue).SCClipLevel
          if ($null -ne $machineCSClipLevel -or $null -ne $machineSCClipLevel -or $null -ne $userCSClipLevel -or $null -ne $userSCClipLevel) {
            throw 'Directional RDP clipboard restriction remained after cleanup'
          }
          $rdpClipPid = if ($null -eq $rdpClip) { 0 } else { [int]$rdpClip.Id }
          Write-Host "MANAGED_RDP_REDIRECTION_READY policyDisableClip=$policyDisableClip policyDisableCdm=$policyDisableCdm rdpTcpDisableClip=$rdpTcpDisableClip rdpTcpDisableCdm=$rdpTcpDisableCdm csClipLevel=absent scClipLevel=absent session=$workflowSessionId rdpclipPid=$rdpClipPid"
          Write-Host "MANAGED_WINDOWS_INTERACTIVE_SESSION_ID=$workflowSessionId"
          & qwinsta.exe 2>&1 | Out-Host

          $ip = (& tailscale ip -4 | Select-Object -First 1).Trim()
          if (-not $ip) { throw 'No Tailscale IPv4 address was assigned' }
          Write-Host "MANAGED_WINDOWS_SAME_SID=$currentSid"
          Write-Host 'MANAGED_WINDOWS_SINGLE_SESSION_READY'
          Write-Host 'MANAGED_WINDOWS_READY'
          Write-Host "TAILSCALE_RDP=$ip`:3389"
          Write-Host "RDP_USER=.\$env:DESKTOP_USERNAME"
          Write-Host "WINDOWS_RUNNER_IMAGE=$env:RUNNER_IMAGE"
          Write-Host "MANAGED_DESKTOP_MODE=$env:MACHINE_MODE"
      - name: Start Cloudflare RDP tunnel
        if: ${{ env.TUNNEL_MODE == 'cloudflare' || env.TUNNEL_MODE == 'dual' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CF_TUNNEL_TOKEN) -or [string]::IsNullOrWhiteSpace($env:CF_TUNNEL_HOSTNAME)) { throw 'Cloudflare Tunnel bootstrap is incomplete' }
          Write-Host "::add-mask::$env:CF_TUNNEL_TOKEN"
          $cloudflared = Join-Path $env:RUNNER_TEMP 'cloudflared.exe'
          $tokenFile = Join-Path $env:RUNNER_TEMP 'cloudflared-token.txt'
          $logFile = Join-Path $env:RUNNER_TEMP 'cloudflared.log'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile $cloudflared
          [System.IO.File]::WriteAllText($tokenFile, $env:CF_TUNNEL_TOKEN)
          $args = @('tunnel','--no-autoupdate','--loglevel','info','--logfile',$logFile,'run','--token-file',$tokenFile)
          $process = Start-Process -FilePath $cloudflared -ArgumentList $args -PassThru -WindowStyle Hidden
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            if ($process.HasExited) { break }
            if ((Test-Path $logFile) -and (Select-String -Path $logFile -Pattern 'Registered tunnel connection' -Quiet)) { $ready = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            if (Test-Path $logFile) { Get-Content $logFile -Tail 80 }
            throw 'Cloudflare RDP tunnel did not connect'
          }
          Write-Host "CLOUDFLARE_RDP_TUNNEL=$env:CF_TUNNEL_HOSTNAME"


      - name: Keep Windows session alive and watch backup command
        id: session
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_TICKET: ${{ inputs.bootstrap_ticket }}
        shell: pwsh -NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'

          # Keep the GitHub Actions job alive without exposing its pwsh/cmd/conhost
          # windows on the managed desktop. Only hide windows owned by the GitHub
          # Runner process tree; never hide terminals opened manually by the user.
          try {
            Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Diagnostics;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class ManagedRunnerConsole {
              private delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);
              [DllImport("user32.dll")] private static extern bool EnumWindows(EnumWindowsProc lpEnumFunc, IntPtr lParam);
              [DllImport("user32.dll")] private static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint processId);
              [DllImport("user32.dll")] private static extern bool ShowWindowAsync(IntPtr hWnd, int nCmdShow);
              [DllImport("user32.dll")] private static extern bool IsWindowVisible(IntPtr hWnd);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] private static extern int GetClassName(IntPtr hWnd, StringBuilder text, int count);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] private static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int count);
              [DllImport("kernel32.dll")] public static extern IntPtr GetConsoleWindow();

              private static string WindowClass(IntPtr hWnd) {
                  var text = new StringBuilder(256);
                  GetClassName(hWnd, text, text.Capacity);
                  return text.ToString();
              }
              private static string WindowTitle(IntPtr hWnd) {
                  var text = new StringBuilder(512);
                  GetWindowText(hWnd, text, text.Capacity);
                  return text.ToString();
              }
              private static bool IsConsoleHostClass(string value) {
                  return string.Equals(value, "ConsoleWindowClass", StringComparison.OrdinalIgnoreCase)
                      || string.Equals(value, "CASCADIA_HOSTING_WINDOW_CLASS", StringComparison.OrdinalIgnoreCase)
                      || string.Equals(value, "PseudoConsoleWindow", StringComparison.OrdinalIgnoreCase);
              }
              public static int HideWindowsForProcesses(int[] processIds) {
                  var allowed = new HashSet<int>(processIds ?? new int[0]);
                  int hidden = 0;
                  EnumWindows(delegate(IntPtr hWnd, IntPtr lParam) {
                      uint pid;
                      GetWindowThreadProcessId(hWnd, out pid);
                      if (allowed.Contains((int)pid)) {
                          ShowWindowAsync(hWnd, 0);
                          hidden++;
                      }
                      return true;
                  }, IntPtr.Zero);
                  var ownConsole = GetConsoleWindow();
                  if (ownConsole != IntPtr.Zero) { ShowWindowAsync(ownConsole, 0); hidden++; }
                  return hidden;
              }
              public static int HidePreexistingConsoleWindows(int sessionId, long cutoffFileTimeUtc) {
                  int hidden = 0;
                  EnumWindows(delegate(IntPtr hWnd, IntPtr lParam) {
                      try {
                          string cls = WindowClass(hWnd);
                          if (!IsConsoleHostClass(cls)) return true;
                          uint pid;
                          GetWindowThreadProcessId(hWnd, out pid);
                          var process = Process.GetProcessById((int)pid);
                          if (process.SessionId != sessionId) return true;
                          long started = process.StartTime.ToUniversalTime().ToFileTimeUtc();
                          if (started > cutoffFileTimeUtc) return true;
                          ShowWindowAsync(hWnd, 0);
                          hidden++;
                      } catch { }
                      return true;
                  }, IntPtr.Zero);
                  return hidden;
              }
              public static string[] DescribePreexistingConsoleWindows(int sessionId, long cutoffFileTimeUtc) {
                  var rows = new List<string>();
                  EnumWindows(delegate(IntPtr hWnd, IntPtr lParam) {
                      try {
                          string cls = WindowClass(hWnd);
                          if (!IsConsoleHostClass(cls)) return true;
                          uint pid;
                          GetWindowThreadProcessId(hWnd, out pid);
                          var process = Process.GetProcessById((int)pid);
                          if (process.SessionId != sessionId) return true;
                          long started = process.StartTime.ToUniversalTime().ToFileTimeUtc();
                          if (started > cutoffFileTimeUtc) return true;
                          rows.Add("pid=" + pid + " process=" + process.ProcessName + " class=" + cls + " visible=" + IsWindowVisible(hWnd) + " title=" + WindowTitle(hWnd));
                      } catch { }
                      return true;
                  }, IntPtr.Zero);
                  return rows.ToArray();
              }
          }
          '@

            $workflowSessionId = (Get-Process -Id $PID).SessionId
            $consoleCutoffFileTimeUtc = [DateTime]::UtcNow.AddSeconds(1).ToFileTimeUtc()
            $preconnectConsolePids = [System.Collections.Generic.HashSet[int]]::new()

            function Add-PreConnectConsoleHosts {
              $all = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue)
              foreach ($proc in $all) {
                if ([int]$proc.SessionId -ne [int]$workflowSessionId) { continue }
                $name = [string]$proc.Name
                if ($name -match '^(conhost|OpenConsole|cmd|powershell|pwsh|WindowsTerminal|Runner\.(Worker|Listener))\.exe$') {
                  [void]$preconnectConsolePids.Add([int]$proc.ProcessId)
                }
              }
            }

            function Hide-ManagedRunnerWindows {
              $all = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue)
              $current = $all | Where-Object { [int]$_.ProcessId -eq [int]$PID } | Select-Object -First 1
              $rootPid = [int]$PID
              $cursor = $current
              for ($depth = 0; $depth -lt 12 -and $null -ne $cursor; $depth++) {
                $name = [string]$cursor.Name
                if ($name -match '^Runner\.(Worker|Listener)\.exe$') { $rootPid = [int]$cursor.ProcessId; break }
                $parentId = [int]$cursor.ParentProcessId
                if ($parentId -le 0) { break }
                $cursor = $all | Where-Object { [int]$_.ProcessId -eq $parentId } | Select-Object -First 1
              }
              $managed = [System.Collections.Generic.HashSet[int]]::new()
              [void]$managed.Add($rootPid)
              foreach ($pidValue in $preconnectConsolePids) { [void]$managed.Add([int]$pidValue) }
              $changed = $true
              while ($changed) {
                $changed = $false
                foreach ($proc in $all) {
                  if ($managed.Contains([int]$proc.ParentProcessId) -and $managed.Add([int]$proc.ProcessId)) { $changed = $true }
                }
              }
              $treeHidden = [ManagedRunnerConsole]::HideWindowsForProcesses([int[]]@($managed))
              $consoleHidden = [ManagedRunnerConsole]::HidePreexistingConsoleWindows([int]$workflowSessionId, [int64]$consoleCutoffFileTimeUtc)
              return ($treeHidden + $consoleHidden)
            }

            # Capture and hide all console hosts that already exist before the
            # address is published. Windows may re-show an existing console HWND
            # when an RDP client attaches, so the same pre-connect windows are
            # hidden again throughout the keepalive loop. Terminals started by the
            # user after connection have a later process start time and are untouched.
            $initialHidden = 0
            for ($hideAttempt = 0; $hideAttempt -lt 20; $hideAttempt++) {
              Add-PreConnectConsoleHosts
              $initialHidden = Hide-ManagedRunnerWindows
              Start-Sleep -Milliseconds 200
            }
            $consoleRows = @([ManagedRunnerConsole]::DescribePreexistingConsoleWindows([int]$workflowSessionId, [int64]$consoleCutoffFileTimeUtc))
            Write-Host "MANAGED_RUNNER_CONSOLE_PRECONNECT hidden=$initialHidden trackedPids=$($preconnectConsolePids.Count) consoleWindows=$($consoleRows.Count)"
            foreach ($row in $consoleRows) { Write-Host "MANAGED_RUNNER_CONSOLE_WINDOW $row" }
          } catch { Write-Host "RUNNER_CONSOLE_HIDE_SKIPPED=$($_.Exception.Message)" }
          Write-Host 'MANAGED_RUNNER_CONSOLE_HIDDEN'

          # Do not publish the connection until the Runner console is already hidden.
          Write-Host "::add-mask::$env:BOOTSTRAP_TICKET"
          $ip = (& tailscale ip -4 | Select-Object -First 1).Trim()
          if (-not $ip) { throw 'No Tailscale IPv4 address was assigned' }
          $payload = @{
            instanceKey = "instance:windows:$env:MACHINE_ID"
            repository = $env:GITHUB_REPOSITORY
            runId = [int64]$env:GITHUB_RUN_ID
            nodeName = "win-$env:MACHINE_ID"
            address = "$ip`:3389"
            tailscaleAddress = "$ip`:3389"
            tailscaleHostname = $env:TS_DNS_HOSTNAME
            cloudflareAddress = $env:CF_TUNNEL_HOSTNAME
            cloudflareHostname = $env:CF_TUNNEL_HOSTNAME
            tunnelMode = $env:TUNNEL_MODE
            status = 'in_progress'
          } | ConvertTo-Json -Compress
          $controlUrl = ([string]$env:WEB_URL).TrimEnd('/')
          if (-not $controlUrl.StartsWith('https://')) { throw 'Cloudflare control URL is invalid' }
          $reported = $null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              $reported = Invoke-RestMethod -Method Post -Uri "$controlUrl/api/runner/report" -Headers @{ 'X-Bootstrap-Ticket' = $env:BOOTSTRAP_TICKET } -ContentType 'application/json' -Body $payload
              break
            } catch {
              if ($attempt -ge 3) { throw }
              Start-Sleep -Seconds (2 * $attempt)
            }
          }
          if ($null -eq $reported) { throw 'Cloudflare runner report did not return a response' }
          Write-Host "CLOUDFLARE_RUNNER_REPORT_OK=$ip`:3389"
          if ($reported.tailscaleDomain) { Write-Host "TAILSCALE_FIXED_DOMAIN=$($reported.tailscaleDomain)" }
          if ($reported.cloudflareDomain) { Write-Host "CLOUDFLARE_FIXED_DOMAIN=$($reported.cloudflareDomain)" }

          function Get-ManagedUserProfilePath {
            $username = $env:DESKTOP_USERNAME
            $sid = (Get-LocalUser -Name $username -ErrorAction Stop).SID.Value
            $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"
            $profileRoot = (Get-ItemProperty -Path $profileKey -ErrorAction SilentlyContinue).ProfileImagePath
            if ([string]::IsNullOrWhiteSpace($profileRoot)) { $profileRoot = "C:\Users\$username" }
            return [Environment]::ExpandEnvironmentVariables($profileRoot)
          }

          function Ensure-ManagedRdpClipboard {
            try {
              $rdpPolicy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
              $userRdpPolicy = 'HKCU:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
              $rdpTcp = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
              New-Item -Path $rdpPolicy -Force | Out-Null
              New-ItemProperty -Path $rdpPolicy -Name fDisableClip -PropertyType DWord -Value 0 -Force | Out-Null
              New-ItemProperty -Path $rdpPolicy -Name fDisableCdm -PropertyType DWord -Value 1 -Force | Out-Null
              foreach ($policyPath in @($rdpPolicy, $userRdpPolicy)) {
                Remove-ItemProperty -Path $policyPath -Name CSClipLevel -ErrorAction SilentlyContinue
                Remove-ItemProperty -Path $policyPath -Name SCClipLevel -ErrorAction SilentlyContinue
              }
              if (Test-Path -LiteralPath $rdpTcp) {
                Set-ItemProperty -Path $rdpTcp -Name fDisableClip -Value 0 -Force
                Set-ItemProperty -Path $rdpTcp -Name fDisableCdm -Value 1 -Force
              }
              $sessionId = (Get-Process -Id $PID).SessionId
              $clip = Get-Process -Name rdpclip -ErrorAction SilentlyContinue | Where-Object { $_.SessionId -eq $sessionId } | Select-Object -First 1
              if ($null -eq $clip) {
                Start-Process -FilePath (Join-Path $env:SystemRoot 'System32\rdpclip.exe') -WindowStyle Hidden
                Start-Sleep -Milliseconds 300
                $clip = Get-Process -Name rdpclip -ErrorAction SilentlyContinue | Where-Object { $_.SessionId -eq $sessionId } | Select-Object -First 1
              }
              if ($null -ne $clip) { return [int]$clip.Id }
            } catch { Write-Warning "RDP clipboard self-heal skipped: $($_.Exception.Message)" }
            return 0
          }

          $initialRdpClipPid = Ensure-ManagedRdpClipboard
          Write-Host "MANAGED_RDP_CLIPBOARD_KEEPALIVE_READY pid=$initialRdpClipPid"

          function Stop-ManagedUserSessions {
            # Close interactive RDP/console sessions before the final snapshot, but never
            # terminate the session that is executing this workflow.
            $workflowSessionId = (Get-Process -Id $PID).SessionId
            try {
              $rows = & quser.exe $env:DESKTOP_USERNAME 2>$null | Select-Object -Skip 1
              foreach ($row in $rows) {
                $clean = ($row -replace '^\s*>?','').Trim()
                if (-not $clean) { continue }
                $parts = $clean -split '\s+'
                $sessionId = $parts | Where-Object { $_ -match '^\d+$' } | Select-Object -First 1
                if ($sessionId -and [int]$sessionId -ne [int]$workflowSessionId) {
                  & logoff.exe $sessionId 2>$null
                }
              }
            } catch { }
            Start-Sleep -Seconds 2
          }

          function Stage-ManagedBackup {
            Stop-ManagedUserSessions
            $profileRoot = Get-ManagedUserProfilePath
            if (-not (Test-Path $profileRoot)) { throw "$env:DESKTOP_USERNAME profile not found: $profileRoot" }
            $sid = (Get-LocalUser -Name $env:DESKTOP_USERNAME -ErrorAction Stop).SID.Value
            $backupRoot = Join-Path $env:RUNNER_TEMP 'managed-desktop-backup'
            $backupProfile = Join-Path $backupRoot 'profile'
            $stateRoot = Join-Path $backupRoot 'state'
            $taskRoot = Join-Path $stateRoot 'tasks'
            if (Test-Path $backupRoot) { Remove-Item -Path $backupRoot -Recurse -Force -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Path $backupProfile -Force | Out-Null
            New-Item -ItemType Directory -Path $stateRoot -Force | Out-Null
            New-Item -ItemType Directory -Path $taskRoot -Force | Out-Null

            # Windows state v3: preserve machine-level software installed after the pristine
            # GitHub runner baseline. The user profile already covers Downloads/Desktop/AppData;
            # this layer captures the missing Program Files / ProgramData application payloads.
            $backupSoftware = Join-Path $backupRoot 'software'
            $uninstallRegistryRoot = Join-Path $stateRoot 'uninstall-registry'
            $appRegistryRoot = Join-Path $stateRoot 'app-registry'
            $driverStateRoot = Join-Path $stateRoot 'drivers'
            $driverPackageRoot = Join-Path $driverStateRoot 'packages'
            $driverFileRoot = Join-Path $driverStateRoot 'files'
            $commonStartupBackupRoot = Join-Path $stateRoot 'common-startup'
            New-Item -ItemType Directory -Path $backupSoftware -Force | Out-Null
            New-Item -ItemType Directory -Path $uninstallRegistryRoot -Force | Out-Null
            New-Item -ItemType Directory -Path $appRegistryRoot -Force | Out-Null
            New-Item -ItemType Directory -Path $driverPackageRoot -Force | Out-Null
            New-Item -ItemType Directory -Path $driverFileRoot -Force | Out-Null
            New-Item -ItemType Directory -Path $commonStartupBackupRoot -Force | Out-Null

            function Get-InstalledAppInventory {
              $items = [System.Collections.Generic.List[object]]::new()
              foreach ($uninstallRoot in @(
                'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
                'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                'HKCU:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
              )) {
                Get-ItemProperty $uninstallRoot -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName } | ForEach-Object {
                  $registryPath = ([string]$_.PSPath -replace '^Microsoft\.PowerShell\.Core\\Registry::','')
                  [void]$items.Add([pscustomobject]@{
                    registry_path = $registryPath
                    name = [string]$_.DisplayName
                    version = [string]$_.DisplayVersion
                    publisher = [string]$_.Publisher
                    install_location = [string]$_.InstallLocation
                    display_icon = [string]$_.DisplayIcon
                    uninstall = [string]$_.UninstallString
                    quiet_uninstall = [string]$_.QuietUninstallString
                  })
                }
              }
              return @($items | Sort-Object registry_path -Unique)
            }

            $apps = @(Get-InstalledAppInventory)
            ConvertTo-Json -InputObject $apps -Depth 6 | Set-Content -LiteralPath (Join-Path $stateRoot 'installed-apps.json') -Encoding UTF8

            $baselineRoot = Join-Path $env:RUNNER_TEMP 'managed-software-baseline'
            $baselineAppsByRegistry = @{}
            $baselineAppsPath = Join-Path $baselineRoot 'installed-apps.json'
            if (Test-Path -LiteralPath $baselineAppsPath) {
              foreach ($baseApp in @(Get-Content -LiteralPath $baselineAppsPath -Raw | ConvertFrom-Json)) {
                $baseKey = ([string]$baseApp.registry_path).ToLowerInvariant()
                if ($baseKey) { $baselineAppsByRegistry[$baseKey] = $baseApp }
              }
            }
            $appDelta = @($apps | Where-Object {
              $key = ([string]$_.registry_path).ToLowerInvariant()
              if (-not $key) { return $false }
              if (-not $baselineAppsByRegistry.ContainsKey($key)) { return $true }
              $before = $baselineAppsByRegistry[$key]
              return (
                [string]$before.version -ne [string]$_.version -or
                [string]$before.install_location -ne [string]$_.install_location -or
                [string]$before.display_icon -ne [string]$_.display_icon -or
                [string]$before.uninstall -ne [string]$_.uninstall -or
                [string]$before.quiet_uninstall -ne [string]$_.quiet_uninstall
              )
            })
            ConvertTo-Json -InputObject $appDelta -Depth 6 | Set-Content -LiteralPath (Join-Path $stateRoot 'installed-apps-delta.json') -Encoding UTF8
            foreach ($deltaApp in $appDelta) {
              $deltaName = ([string]$deltaApp.name -replace '[\r\n]+',' ').Trim()
              $deltaVersion = ([string]$deltaApp.version -replace '[\r\n]+',' ').Trim()
              $deltaRegistry = ([string]$deltaApp.registry_path -replace '[\r\n]+',' ').Trim()
              $deltaInstall = ([string]$deltaApp.install_location -replace '[\r\n]+',' ').Trim()
              Write-Host "MANAGED_WINDOWS_APP_DELTA name=$deltaName version=$deltaVersion registry=$deltaRegistry install=$deltaInstall"
            }

            $fixedVolumes = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' -ErrorAction SilentlyContinue | Where-Object { $_.DeviceID } | ForEach-Object {
              [void]$fixedVolumes.Add(([string]$_.DeviceID).ToUpperInvariant())
            }
            # CIM inventory should always include the system volume, but keep an explicit
            # fallback so a transient WMI/CIM failure can never silently discard Program Files.
            if (-not [string]::IsNullOrWhiteSpace([string]$env:SystemDrive)) {
              [void]$fixedVolumes.Add(([string]$env:SystemDrive).TrimEnd('\\').ToUpperInvariant())
            }
            Write-Host "MANAGED_WINDOWS_FIXED_VOLUMES=$(@($fixedVolumes) -join ',')"
            $softwareCandidates = [System.Collections.Generic.List[object]]::new()
            $softwareExcludePrefixes = [System.Collections.Generic.List[string]]::new()
            foreach ($candidate in @(
              [string]$env:SystemRoot,
              [string]$profileRoot,
              [string]$env:RUNNER_TEMP,
              [string]$env:GITHUB_WORKSPACE,
              [string]$env:RUNNER_TOOL_CACHE,
              'D:\a',
              'D:\hostedtoolcache',
              'D:\actions-runner'
            )) {
              if ([string]::IsNullOrWhiteSpace($candidate)) { continue }
              try { [void]$softwareExcludePrefixes.Add([IO.Path]::GetFullPath($candidate).TrimEnd('\')) } catch { }
            }

            function Test-ManagedSoftwareExcludedPath {
              param([Parameter(Mandatory=$true)][string]$Path)
              try { $full = [IO.Path]::GetFullPath($Path).TrimEnd('\') } catch { return $true }
              foreach ($prefix in $softwareExcludePrefixes) {
                if ($full.Equals($prefix,[System.StringComparison]::OrdinalIgnoreCase) -or
                    $full.StartsWith("$prefix\",[System.StringComparison]::OrdinalIgnoreCase)) { return $true }
              }
              return $false
            }

            function Add-SoftwareRootCandidate {
              param([string]$Path, [string]$Reason)
              if ([string]::IsNullOrWhiteSpace($Path)) { return }
              try {
                $expanded = [Environment]::ExpandEnvironmentVariables($Path.Trim().Trim('"'))
                if (-not [IO.Path]::IsPathRooted($expanded)) {
                  Write-Warning "MANAGED_WINDOWS_SOFTWARE_CANDIDATE_REJECT reason=not-rooted source=$Path evidence=$Reason"
                  return
                }
                $full = [IO.Path]::GetFullPath($expanded).TrimEnd('\')
                if (-not (Test-Path -LiteralPath $full -PathType Container)) {
                  Write-Warning "MANAGED_WINDOWS_SOFTWARE_CANDIDATE_REJECT reason=missing source=$full evidence=$Reason"
                  return
                }
                if (Test-ManagedSoftwareExcludedPath -Path $full) {
                  Write-Warning "MANAGED_WINDOWS_SOFTWARE_CANDIDATE_REJECT reason=excluded source=$full evidence=$Reason"
                  return
                }
                $volumeRoot = [IO.Path]::GetPathRoot($full)
                if ([string]::IsNullOrWhiteSpace($volumeRoot)) {
                  Write-Warning "MANAGED_WINDOWS_SOFTWARE_CANDIDATE_REJECT reason=no-volume source=$full evidence=$Reason"
                  return
                }
                $volume = $volumeRoot.TrimEnd('\').ToUpperInvariant()
                if (-not $fixedVolumes.Contains($volume)) {
                  Write-Warning "MANAGED_WINDOWS_SOFTWARE_CANDIDATE_REJECT reason=non-fixed-volume volume=$volume source=$full evidence=$Reason"
                  return
                }
                $relative = $full.Substring($volumeRoot.Length).TrimStart('\')
                if ([string]::IsNullOrWhiteSpace($relative)) {
                  Write-Warning "MANAGED_WINDOWS_SOFTWARE_CANDIDATE_REJECT reason=volume-root source=$full evidence=$Reason"
                  return
                }
                [void]$softwareCandidates.Add([pscustomobject]@{ volume=$volume; relative=$relative; source=$full; reason=$Reason })
                Write-Host "MANAGED_WINDOWS_SOFTWARE_CANDIDATE_ACCEPT volume=$volume relative=$relative evidence=$Reason"
              } catch {
                Write-Warning "MANAGED_WINDOWS_SOFTWARE_CANDIDATE_REJECT reason=exception source=$Path evidence=$Reason detail=$($_.Exception.Message)"
              }
            }

            function Resolve-CommandExecutablePath {
              param([string]$Value)
              if ([string]::IsNullOrWhiteSpace($Value)) { return '' }
              $text = [Environment]::ExpandEnvironmentVariables($Value.Trim())
              if ($text -match '^"([A-Za-z]:\\[^\"]+?\.exe)"') { return $matches[1] }
              if ($text -match '^([A-Za-z]:\\.*?\.exe)(?:\s|$)') { return $matches[1] }
              return ''
            }

            function Normalize-AppIdentityToken {
              param([string]$Value)
              if ([string]::IsNullOrWhiteSpace($Value)) { return '' }
              return (($Value.ToLowerInvariant()) -replace '[^\p{L}\p{Nd}]','')
            }

            $appIdentityTokens = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            foreach ($app in $appDelta) {
              $registryLeaf = (([string]$app.registry_path -split '\\') | Select-Object -Last 1)
              foreach ($identityValue in @([string]$app.name, [string]$app.publisher, [string]$registryLeaf)) {
                $token = Normalize-AppIdentityToken -Value $identityValue
                if ($token.Length -ge 4) { [void]$appIdentityTokens.Add($token) }
              }
            }
            function Test-AppIdentityTokenMatch {
              param([string]$Token)
              if ([string]::IsNullOrWhiteSpace($Token) -or $Token.Length -lt 4) { return $false }
              foreach ($known in $appIdentityTokens) {
                if ($Token.Equals($known,[System.StringComparison]::OrdinalIgnoreCase) -or
                    $Token.IndexOf($known,[System.StringComparison]::OrdinalIgnoreCase) -ge 0 -or
                    $known.IndexOf($Token,[System.StringComparison]::OrdinalIgnoreCase) -ge 0) { return $true }
              }
              return $false
            }

            # Build a bounded application-directory inventory for identity matching.
            # Only Program Files roots, to depth 3, are considered; no whole-disk scan occurs.
            $programDirectoryInventory = [System.Collections.Generic.List[string]]::new()
            foreach ($programRoot in @([string]$env:ProgramFiles, [string]${env:ProgramFiles(x86)})) {
              if ([string]::IsNullOrWhiteSpace($programRoot) -or -not (Test-Path -LiteralPath $programRoot -PathType Container)) { continue }
              Get-ChildItem -LiteralPath $programRoot -Directory -Recurse -Depth 3 -Force -ErrorAction SilentlyContinue | ForEach-Object {
                try { [void]$programDirectoryInventory.Add([IO.Path]::GetFullPath($_.FullName).TrimEnd('\')) } catch { }
              }
            }
            $programDirectoryInventory = @($programDirectoryInventory | Sort-Object -Unique)
            $appPayloadEvidence = [System.Collections.Generic.List[object]]::new()

            # Fallback for installers that register an app but omit usable install paths.
            # Compare shallow Program Files topology against the pristine runner baseline;
            # this catches vendor/application directories created after the pristine runner baseline
            # without scanning or backing up the whole system drive.
            if (@($appDelta).Count -gt 0) {
              $baselineProgramDirSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
              $baselineProgramDirsPath = Join-Path $baselineRoot 'program-dirs.json'
              if (Test-Path -LiteralPath $baselineProgramDirsPath) {
                foreach ($savedDir in @(Get-Content -LiteralPath $baselineProgramDirsPath -Raw | ConvertFrom-Json)) {
                  if ([string]::IsNullOrWhiteSpace([string]$savedDir)) { continue }
                  try { [void]$baselineProgramDirSet.Add([IO.Path]::GetFullPath([string]$savedDir).TrimEnd('\')) } catch { }
                }
              }
              foreach ($programRoot in @([string]$env:ProgramFiles, [string]${env:ProgramFiles(x86)})) {
                if ([string]::IsNullOrWhiteSpace($programRoot) -or -not (Test-Path -LiteralPath $programRoot -PathType Container)) { continue }
                try {
                  $rootFull = [IO.Path]::GetFullPath($programRoot).TrimEnd('\')
                  Get-ChildItem -LiteralPath $rootFull -Directory -Recurse -Depth 2 -Force -ErrorAction SilentlyContinue | ForEach-Object {
                    try {
                      $currentDir = [IO.Path]::GetFullPath($_.FullName).TrimEnd('\')
                      if (-not $baselineProgramDirSet.Contains($currentDir)) {
                        Add-SoftwareRootCandidate -Path $currentDir -Reason 'program-directory-delta'
                      }
                    } catch { }
                  }
                } catch { }
              }
            }

            foreach ($app in $appDelta) {
              Add-SoftwareRootCandidate -Path ([string]$app.install_location) -Reason "install-location:$($app.name)"
              $icon = ([string]$app.display_icon -replace ',\s*-?\d+\s*$','').Trim().Trim('"')
              if ($icon -and [IO.Path]::IsPathRooted($icon)) {
                try { Add-SoftwareRootCandidate -Path ([IO.Path]::GetDirectoryName($icon)) -Reason "display-icon:$($app.name)" } catch { }
              }
              foreach ($commandValue in @([string]$app.uninstall, [string]$app.quiet_uninstall)) {
                $exe = Resolve-CommandExecutablePath -Value $commandValue
                if ($exe) {
                  try { Add-SoftwareRootCandidate -Path ([IO.Path]::GetDirectoryName($exe)) -Reason "uninstall-command:$($app.name)" } catch { }
                }
              }
              $registryLeaf = (([string]$app.registry_path -split '\\') | Select-Object -Last 1)
              $registryToken = Normalize-AppIdentityToken -Value $registryLeaf
              if ($registryToken.Length -ge 4) {
                foreach ($programDir in $programDirectoryInventory) {
                  $leafToken = Normalize-AppIdentityToken -Value ([IO.Path]::GetFileName($programDir))
                  if ($leafToken -eq $registryToken) {
                    # This path is already bounded by the Program Files inventory above, so
                    # persist it directly as app payload evidence as well as feeding the
                    # generic candidate path. This prevents a defensive candidate filter from
                    # turning a proven registry-identity match into a registry-only backup.
                    $payloadPath = [IO.Path]::GetFullPath($programDir).TrimEnd('\')
                    $payloadVolumeRoot = [IO.Path]::GetPathRoot($payloadPath)
                    $payloadVolume = $payloadVolumeRoot.TrimEnd('\').ToUpperInvariant()
                    $payloadRelative = $payloadPath.Substring($payloadVolumeRoot.Length).TrimStart('\')
                    foreach ($identityPart in @([IO.Path]::GetFileName($payloadPath), [IO.Path]::GetFileName([IO.Path]::GetDirectoryName($payloadPath)))) {
                      $identityToken = Normalize-AppIdentityToken -Value ([string]$identityPart)
                      if ($identityToken.Length -ge 4) { [void]$appIdentityTokens.Add($identityToken) }
                    }
                    Add-SoftwareRootCandidate -Path $payloadPath -Reason "registry-identity:$($app.name)"
                    if (-not ($softwareCandidates | Where-Object { ([string]$_.source).Equals($payloadPath,[System.StringComparison]::OrdinalIgnoreCase) })) {
                      [void]$softwareCandidates.Add([pscustomobject]@{ volume=$payloadVolume; relative=$payloadRelative; source=$payloadPath; reason="registry-identity-direct:$($app.name)" })
                      Write-Warning "MANAGED_WINDOWS_SOFTWARE_CANDIDATE_DIRECT app=$($app.name) path=$payloadPath"
                    }
                    [void]$appPayloadEvidence.Add([pscustomobject]@{
                      registry_path = [string]$app.registry_path
                      name = [string]$app.name
                      path = $payloadPath
                      volume = $payloadVolume
                      relative = $payloadRelative
                      evidence = 'registry-identity'
                    })
                    Write-Host "MANAGED_WINDOWS_APP_DIRECTORY_MATCH app=$($app.name) registryLeaf=$registryLeaf path=$payloadPath"
                    break
                  }
                }
              }
            }

            # Capture machine-scoped application state under ProgramData. Only directories
            # created after the pristine baseline and matching an app/vendor identity token
            # are admitted, so Windows/runner-owned ProgramData is never swept wholesale.
            $programDataRoot = [Environment]::GetFolderPath('CommonApplicationData')
            $baselineProgramDataSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $baselineProgramDataPath = Join-Path $baselineRoot 'programdata-dirs.json'
            if (Test-Path -LiteralPath $baselineProgramDataPath) {
              foreach ($savedDir in @(Get-Content -LiteralPath $baselineProgramDataPath -Raw | ConvertFrom-Json)) {
                if ([string]::IsNullOrWhiteSpace([string]$savedDir)) { continue }
                try { [void]$baselineProgramDataSet.Add([IO.Path]::GetFullPath([string]$savedDir).TrimEnd('\')) } catch { }
              }
            }
            if (@($appDelta).Count -gt 0 -and $programDataRoot -and (Test-Path -LiteralPath $programDataRoot -PathType Container)) {
              Get-ChildItem -LiteralPath $programDataRoot -Directory -Recurse -Depth 2 -Force -ErrorAction SilentlyContinue | ForEach-Object {
                try {
                  $currentDir = [IO.Path]::GetFullPath($_.FullName).TrimEnd('\')
                  if ($baselineProgramDataSet.Contains($currentDir)) { return }
                  $leafToken = Normalize-AppIdentityToken -Value ([IO.Path]::GetFileName($currentDir))
                  $parentToken = Normalize-AppIdentityToken -Value ([IO.Path]::GetFileName([IO.Path]::GetDirectoryName($currentDir)))
                  if ((Test-AppIdentityTokenMatch -Token $leafToken) -or (Test-AppIdentityTokenMatch -Token $parentToken)) {
                    Add-SoftwareRootCandidate -Path $currentDir -Reason 'programdata-app-delta'
                    Write-Host "MANAGED_WINDOWS_PROGRAMDATA_MATCH path=$currentDir"
                  }
                } catch { }
              }
            }

            # Record app-owned user-profile state used for login/session/config/cache. These
            # paths are already included in the VSS profile copy; the manifest makes their
            # restoration explicit and verifiable without inspecting credential/token contents.
            $baselineAppDataSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $baselineAppDataPath = Join-Path $baselineRoot 'appdata-dirs.json'
            if (Test-Path -LiteralPath $baselineAppDataPath) {
              foreach ($savedDir in @(Get-Content -LiteralPath $baselineAppDataPath -Raw | ConvertFrom-Json)) {
                if ([string]::IsNullOrWhiteSpace([string]$savedDir)) { continue }
                try { [void]$baselineAppDataSet.Add([IO.Path]::GetFullPath([string]$savedDir).TrimEnd('\')) } catch { }
              }
            }
            $appProfileEvidence = [System.Collections.Generic.List[object]]::new()
            foreach ($appDataRoot in @([Environment]::GetFolderPath('ApplicationData'), [Environment]::GetFolderPath('LocalApplicationData'))) {
              if ([string]::IsNullOrWhiteSpace($appDataRoot) -or -not (Test-Path -LiteralPath $appDataRoot -PathType Container)) { continue }
              Get-ChildItem -LiteralPath $appDataRoot -Directory -Recurse -Depth 2 -Force -ErrorAction SilentlyContinue | ForEach-Object {
                try {
                  $currentDir = [IO.Path]::GetFullPath($_.FullName).TrimEnd('\')
                  if ($baselineAppDataSet.Contains($currentDir)) { return }
                  $leafToken = Normalize-AppIdentityToken -Value ([IO.Path]::GetFileName($currentDir))
                  $parentToken = Normalize-AppIdentityToken -Value ([IO.Path]::GetFileName([IO.Path]::GetDirectoryName($currentDir)))
                  if (-not ((Test-AppIdentityTokenMatch -Token $leafToken) -or (Test-AppIdentityTokenMatch -Token $parentToken))) { return }
                  if (-not $currentDir.StartsWith($profileRoot.TrimEnd('\') + '\',[System.StringComparison]::OrdinalIgnoreCase)) { return }
                  $relative = $currentDir.Substring($profileRoot.TrimEnd('\').Length).TrimStart('\')
                  if ([string]::IsNullOrWhiteSpace($relative) -or $relative.Split('\') -contains '..') { return }
                  $volatileProfilePrefix = 'AppData\Local\Temp'
                  if ($relative.Equals($volatileProfilePrefix,[System.StringComparison]::OrdinalIgnoreCase) -or
                      $relative.StartsWith("$volatileProfilePrefix\",[System.StringComparison]::OrdinalIgnoreCase)) {
                    Write-Host "MANAGED_WINDOWS_APP_PROFILE_VOLATILE_SKIPPED relative=$relative"
                    return
                  }
                  $measure = Get-ChildItem -LiteralPath $currentDir -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum
                  $dirBytes = if ($null -eq $measure.Sum) { [int64]0 } else { [int64]$measure.Sum }
                  [void]$appProfileEvidence.Add([pscustomobject]@{ relative=$relative; file_count=[int64]$measure.Count; bytes=$dirBytes })
                  Write-Host "MANAGED_WINDOWS_APP_PROFILE_MATCH relative=$relative files=$([int64]$measure.Count) bytes=$dirBytes"
                } catch { }
              }
            }
            ConvertTo-Json -InputObject @($appProfileEvidence | Sort-Object relative -Unique) -Depth 5 | Set-Content -LiteralPath (Join-Path $stateRoot 'app-profile-evidence.json') -Encoding UTF8

            ConvertTo-Json -InputObject @($appPayloadEvidence) -Depth 6 | Set-Content -LiteralPath (Join-Path $stateRoot 'app-payload-evidence.json') -Encoding UTF8

            function Get-RegistryServiceInventory {
              param([Parameter(Mandatory=$true)][ValidateSet('service','driver')][string]$Kind)
              $items = [System.Collections.Generic.List[object]]::new()
              foreach ($key in @(Get-ChildItem -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Services' -ErrorAction Stop)) {
                $props = Get-ItemProperty -LiteralPath $key.PSPath -ErrorAction Stop
                $type = if ($null -eq $props.Type) { 0 } else { [int64]$props.Type }
                if ($Kind -eq 'service') { if (($type -band 0x30) -eq 0) { continue } }
                else { if (($type -band 0x3) -eq 0) { continue } }
                $start = if ($null -eq $props.Start) { -1 } else { [int]$props.Start }
                $startMode = switch ($start) { 0 {'Boot'} 1 {'System'} 2 {'Auto'} 3 {'Manual'} 4 {'Disabled'} default {'Unknown'} }
                [void]$items.Add([pscustomobject]@{
                  name=[string]$key.PSChildName; path=[string]$props.ImagePath; display_name=[string]$props.DisplayName;
                  start=[int]$start; start_mode=$startMode; start_name=[string]$props.ObjectName; type=[int64]$type;
                  error_control=if ($null -eq $props.ErrorControl) { 1 } else { [int]$props.ErrorControl };
                  depend_on_service=@($props.DependOnService); delayed_auto_start=if ($null -eq $props.DelayedAutoStart) { 0 } else { [int]$props.DelayedAutoStart }
                })
              }
              return @($items | Sort-Object name -Unique)
            }

            $baselineServicesPath = Join-Path $baselineRoot 'services.json'
            if (-not (Test-Path -LiteralPath $baselineServicesPath)) { throw 'Baseline service inventory is missing' }
            $baselineServicesSaved = @(Get-Content -LiteralPath $baselineServicesPath -Raw | ConvertFrom-Json)
            if ($baselineServicesSaved.Count -lt 100) { throw "Baseline service inventory is invalid: count=$($baselineServicesSaved.Count)" }
            $baselineServiceNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            foreach ($service in $baselineServicesSaved) { if ($service.name) { [void]$baselineServiceNames.Add([string]$service.name) } }

            $currentServices = @(Get-RegistryServiceInventory -Kind service)
            if ($currentServices.Count -lt [math]::Floor($baselineServicesSaved.Count * 0.7)) {
              throw "Current service inventory failed sanity check baseline=$($baselineServicesSaved.Count) current=$($currentServices.Count)"
            }
            $serviceStateRoot = Join-Path $stateRoot 'services'
            New-Item -ItemType Directory -Path $serviceStateRoot -Force | Out-Null
            $serviceDelta = [System.Collections.Generic.List[object]]::new()
            $serviceIndex = 0
            foreach ($service in @($currentServices | Where-Object { $_.name -and -not $baselineServiceNames.Contains([string]$_.name) })) {
              if (-not $service.path -or [string]$service.path -match '(?i)\\Windows\\(System32|SysWOW64)') { continue }
              $serviceIndex++
              $exe = Resolve-CommandExecutablePath -Value ([string]$service.path)
              if ($exe) { try { Add-SoftwareRootCandidate -Path ([IO.Path]::GetDirectoryName($exe)) -Reason "service-command:$($service.name)" } catch { } }
              $regFile = ('service-{0:D4}.reg' -f $serviceIndex)
              $regPath = "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\$([string]$service.name)"
              & reg.exe export $regPath (Join-Path $serviceStateRoot $regFile) /y | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Service registry export failed: $($service.name)" }
              $queryText = (& sc.exe query ([string]$service.name) 2>&1) -join "`n"
              $state = if ($queryText -match '(?im)^\s*STATE\s*:\s*4\s+RUNNING\b') { 'Running' } else { 'Stopped' }
              $sdLines = @(& sc.exe sdshow ([string]$service.name) 2>$null | Where-Object { $_ -and $_ -notmatch '^\[SC\]' })
              $sddl = if ($sdLines.Count) { ([string]$sdLines[-1]).Trim() } else { '' }
              [void]$serviceDelta.Add([pscustomobject]@{
                name=$service.name; display_name=$service.display_name; path=$service.path; start=$service.start;
                start_mode=$service.start_mode; start_name=$service.start_name; type=$service.type; error_control=$service.error_control;
                depend_on_service=@($service.depend_on_service); delayed_auto_start=$service.delayed_auto_start;
                state=$state; registry_file=$regFile; sddl=$sddl
              })
            }
            ConvertTo-Json -InputObject @($serviceDelta) -Depth 8 | Set-Content -LiteralPath (Join-Path $stateRoot 'services-delta.json') -Encoding UTF8

            # Collapse nested paths on the same volume. Discovery is bounded to explicit
            # install/service evidence plus shallow Program Files deltas and registry-identity matches.
            $softwareRoots = [System.Collections.Generic.List[object]]::new()
            foreach ($candidate in @($softwareCandidates | Sort-Object volume,@{Expression={$_.relative.Length}},relative)) {
              $nested = $false
              foreach ($chosen in $softwareRoots) {
                if (-not ([string]$chosen.volume).Equals([string]$candidate.volume,[System.StringComparison]::OrdinalIgnoreCase)) { continue }
                $chosenRel = ([string]$chosen.relative).TrimEnd('\')
                $candidateRel = ([string]$candidate.relative).TrimEnd('\')
                if ($candidateRel.Equals($chosenRel,[System.StringComparison]::OrdinalIgnoreCase) -or
                    $candidateRel.StartsWith("$chosenRel\",[System.StringComparison]::OrdinalIgnoreCase)) { $nested = $true; break }
              }
              if (-not $nested) { [void]$softwareRoots.Add($candidate) }
            }
            ConvertTo-Json -InputObject @($softwareRoots) -Depth 5 | Set-Content -LiteralPath (Join-Path $stateRoot 'software-roots.json') -Encoding UTF8

            # Preserve installer-assigned DACLs for discovered software roots. icacls /save stores
            # portable SID-based descriptors; restore substitutes the old managed-user SID with the new runner SID.
            $softwareAclRoot = Join-Path $stateRoot 'software-acl'
            New-Item -ItemType Directory -Path $softwareAclRoot -Force | Out-Null
            $softwareAclManifest = [System.Collections.Generic.List[object]]::new()
            $softwareAclIndex = 0
            foreach ($softwareRoot in $softwareRoots) {
              $softwareAclIndex++
              $volume = ([string]$softwareRoot.volume).ToUpperInvariant()
              $relative = ([string]$softwareRoot.relative).TrimStart('\')
              if ($volume -notmatch '^[A-Z]:$' -or -not $relative) { continue }
              $volumeRootForAcl = "$volume\"
              $liveRootForAcl = Join-Path $volumeRootForAcl $relative
              if (-not (Test-Path -LiteralPath $liveRootForAcl)) { continue }
              $aclFile = ('software-acl-{0:D4}.txt' -f $softwareAclIndex)
              $aclDestination = Join-Path $softwareAclRoot $aclFile
              Push-Location $volumeRootForAcl
              try {
                & icacls.exe $relative /save $aclDestination /t /c /q | Out-Null
                if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $aclDestination)) { throw "icacls save failed exit=$LASTEXITCODE root=$liveRootForAcl" }
              } finally { Pop-Location }
              [void]$softwareAclManifest.Add([pscustomobject]@{ volume=$volume; relative=$relative; file=$aclFile })
            }
            ConvertTo-Json -InputObject @($softwareAclManifest) -Depth 5 | Set-Content -LiteralPath (Join-Path $stateRoot 'software-acl.json') -Encoding UTF8

            # Preserve uninstall registration for apps that did not exist in the pristine runner.
            $uninstallRegistryManifest = [System.Collections.Generic.List[object]]::new()
            $uninstallIndex = 0
            foreach ($app in $appDelta) {
              $regPath = [string]$app.registry_path
              if (-not $regPath -or (-not $regPath.StartsWith('HKEY_LOCAL_MACHINE\', [System.StringComparison]::OrdinalIgnoreCase) -and -not $regPath.StartsWith('HKEY_CURRENT_USER\', [System.StringComparison]::OrdinalIgnoreCase))) { continue }
              $uninstallIndex++
              $file = ('uninstall-{0:D4}.reg' -f $uninstallIndex)
              $destination = Join-Path $uninstallRegistryRoot $file
              & reg.exe export $regPath $destination /y | Out-Null
              if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $destination)) {
                [void]$uninstallRegistryManifest.Add([pscustomobject]@{ registry_path=$regPath; file=$file; name=[string]$app.name; version=[string]$app.version })
              } else {
                Remove-Item -LiteralPath $destination -Force -ErrorAction SilentlyContinue
                Write-Warning "Uninstall registry export skipped for $($app.name): $regPath"
              }
            }
            ConvertTo-Json -InputObject @($uninstallRegistryManifest) -Depth 5 | Set-Content -LiteralPath (Join-Path $stateRoot 'uninstall-registry.json') -Encoding UTF8

            # Export application/vendor registry subtrees created after the pristine runner
            # baseline. Matching is bounded by app identity tokens, so we do not merge an
            # entire old user hive or unrelated Windows registry state.
            $baselineAppRegistrySet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $baselineAppRegistryPath = Join-Path $baselineRoot 'app-registry-keys.json'
            if (Test-Path -LiteralPath $baselineAppRegistryPath) {
              foreach ($savedKey in @(Get-Content -LiteralPath $baselineAppRegistryPath -Raw | ConvertFrom-Json)) {
                if ($savedKey) { [void]$baselineAppRegistrySet.Add([string]$savedKey) }
              }
            }
            $appRegistryCandidates = [System.Collections.Generic.List[string]]::new()
            foreach ($registryRoot in @('HKCU:\SOFTWARE','HKLM:\SOFTWARE','HKLM:\SOFTWARE\WOW6432Node')) {
              if (-not (Test-Path -LiteralPath $registryRoot)) { continue }
              Get-ChildItem -LiteralPath $registryRoot -Recurse -Depth 3 -ErrorAction SilentlyContinue | ForEach-Object {
                try {
                  $regName = [string]$_.Name
                  if (-not $regName -or $baselineAppRegistrySet.Contains($regName)) { return }
                  $matched = $false
                  foreach ($segment in @($regName -split '\\')) {
                    $segmentToken = Normalize-AppIdentityToken -Value ([string]$segment)
                    if (Test-AppIdentityTokenMatch -Token $segmentToken) { $matched = $true; break }
                  }
                  if ($matched) { [void]$appRegistryCandidates.Add($regName) }
                } catch { }
              }
            }
            $appRegistryRoots = [System.Collections.Generic.List[string]]::new()
            foreach ($candidate in @($appRegistryCandidates | Sort-Object Length,@{Expression={$_}} -Unique)) {
              $nested = $false
              foreach ($chosen in $appRegistryRoots) {
                if ($candidate.Equals($chosen,[System.StringComparison]::OrdinalIgnoreCase) -or $candidate.StartsWith("$chosen\",[System.StringComparison]::OrdinalIgnoreCase)) { $nested = $true; break }
              }
              if (-not $nested) { [void]$appRegistryRoots.Add($candidate) }
            }
            $appRegistryManifest = [System.Collections.Generic.List[object]]::new()
            $appRegistryIndex = 0
            foreach ($regPath in $appRegistryRoots) {
              $appRegistryIndex++
              $file = ('app-registry-{0:D4}.reg' -f $appRegistryIndex)
              $destination = Join-Path $appRegistryRoot $file
              & reg.exe export $regPath $destination /y | Out-Null
              if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $destination)) {
                [void]$appRegistryManifest.Add([pscustomobject]@{ registry_path=$regPath; file=$file })
                Write-Host "MANAGED_WINDOWS_APP_REGISTRY_BACKED_UP path=$regPath"
              } else {
                Remove-Item -LiteralPath $destination -Force -ErrorAction SilentlyContinue
              }
            }
            ConvertTo-Json -InputObject @($appRegistryManifest) -Depth 5 | Set-Content -LiteralPath (Join-Path $stateRoot 'app-registry.json') -Encoding UTF8

            # Generic installer registry/value deltas: environment variables, firewall rules,
            # COM/Classes/ProgID/TypeLib/AppID and MSI product registration created after baseline.
            function Get-RegistryValueInventory {
              param([Parameter(Mandatory=$true)][string]$Path)
              $result = [System.Collections.Generic.List[object]]::new()
              if (-not (Test-Path -LiteralPath $Path)) { return @() }
              $key = Get-Item -LiteralPath $Path -ErrorAction Stop
              foreach ($name in $key.GetValueNames()) {
                if ([string]::IsNullOrWhiteSpace($name)) { continue }
                $kind = $key.GetValueKind($name).ToString()
                $raw = $key.GetValue($name,$null,[Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
                $entry = [ordered]@{ path=$Path; name=$name; kind=$kind; value=$null; value_b64=''; value_multi=@() }
                if ($raw -is [byte[]]) { $entry.value_b64 = [Convert]::ToBase64String($raw) }
                elseif ($raw -is [string[]]) { $entry.value_multi = @($raw) }
                else { $entry.value = $raw }
                [void]$result.Add([pscustomobject]$entry)
              }
              return @($result)
            }
            $installerValueRoots = @(
              'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment',
              'HKCU:\Environment',
              'HKLM:\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\FirewallRules',
              'HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\FirewallRules',
            'HKLM:\SOFTWARE\RegisteredApplications',
            'HKCU:\SOFTWARE\RegisteredApplications',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Shell Extensions\Approved',
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Shell Extensions\Approved'
            )
            $baselineInstallerValueMap = @{}
            $baselineInstallerValuesPath = Join-Path $baselineRoot 'installer-registry-values.json'
            if (Test-Path -LiteralPath $baselineInstallerValuesPath) {
              foreach ($entry in @(Get-Content -LiteralPath $baselineInstallerValuesPath -Raw | ConvertFrom-Json)) {
                $k = "$([string]$entry.path)|$([string]$entry.name)".ToLowerInvariant()
                $baselineInstallerValueMap[$k] = ($entry | ConvertTo-Json -Compress -Depth 8)
              }
            }
            $installerValueDelta = [System.Collections.Generic.List[object]]::new()
            foreach ($root in $installerValueRoots) {
              foreach ($entry in @(Get-RegistryValueInventory -Path $root)) {
                $k = "$([string]$entry.path)|$([string]$entry.name)".ToLowerInvariant()
                $nowJson = ($entry | ConvertTo-Json -Compress -Depth 8)
                if (-not $baselineInstallerValueMap.ContainsKey($k) -or $baselineInstallerValueMap[$k] -ne $nowJson) { [void]$installerValueDelta.Add($entry) }
              }
            }
            ConvertTo-Json -InputObject @($installerValueDelta) -Depth 8 | Set-Content -LiteralPath (Join-Path $stateRoot 'installer-registry-values.json') -Encoding UTF8

            $installerRegistryRoot = Join-Path $stateRoot 'installer-registry'
            $installerCacheBackupRoot = Join-Path $stateRoot 'installer-cache'
            New-Item -ItemType Directory -Path $installerRegistryRoot -Force | Out-Null
            New-Item -ItemType Directory -Path $installerCacheBackupRoot -Force | Out-Null
            $installerTreeRoots = @(
              [pscustomobject]@{ id='hklm_classes'; provider='HKLM:\SOFTWARE\Classes'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Classes' },
            [pscustomobject]@{ id='hklm_app_paths'; provider='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths' },
            [pscustomobject]@{ id='hkcu_app_paths'; provider='HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths'; reg='HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths' },
            [pscustomobject]@{ id='hklm_shell_overlays'; provider='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\ShellIconOverlayIdentifiers'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\ShellIconOverlayIdentifiers' },
            [pscustomobject]@{ id='hkcu_shell_overlays'; provider='HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\ShellIconOverlayIdentifiers'; reg='HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\ShellIconOverlayIdentifiers' },
              [pscustomobject]@{ id='hklm_clsid'; provider='HKLM:\SOFTWARE\Classes\CLSID'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Classes\CLSID' },
              [pscustomobject]@{ id='hklm_appid'; provider='HKLM:\SOFTWARE\Classes\AppID'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Classes\AppID' },
              [pscustomobject]@{ id='hklm_typelib'; provider='HKLM:\SOFTWARE\Classes\TypeLib'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Classes\TypeLib' },
              [pscustomobject]@{ id='hklm_interface'; provider='HKLM:\SOFTWARE\Classes\Interface'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Classes\Interface' },
              [pscustomobject]@{ id='hkcu_classes'; provider='HKCU:\SOFTWARE\Classes'; reg='HKEY_CURRENT_USER\SOFTWARE\Classes' },
              [pscustomobject]@{ id='hkcu_clsid'; provider='HKCU:\SOFTWARE\Classes\CLSID'; reg='HKEY_CURRENT_USER\SOFTWARE\Classes\CLSID' },
              [pscustomobject]@{ id='hkcu_appid'; provider='HKCU:\SOFTWARE\Classes\AppID'; reg='HKEY_CURRENT_USER\SOFTWARE\Classes\AppID' },
              [pscustomobject]@{ id='hkcu_typelib'; provider='HKCU:\SOFTWARE\Classes\TypeLib'; reg='HKEY_CURRENT_USER\SOFTWARE\Classes\TypeLib' },
              [pscustomobject]@{ id='msi_products'; provider='HKLM:\SOFTWARE\Classes\Installer\Products'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Classes\Installer\Products' },
              [pscustomobject]@{ id='msi_features'; provider='HKLM:\SOFTWARE\Classes\Installer\Features'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Classes\Installer\Features' },
              [pscustomobject]@{ id='msi_upgradecodes'; provider='HKLM:\SOFTWARE\Classes\Installer\UpgradeCodes'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Classes\Installer\UpgradeCodes' },
              [pscustomobject]@{ id='msi_machine_products'; provider='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\UserData\S-1-5-18\Products'; reg='HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\UserData\S-1-5-18\Products' },
              [pscustomobject]@{ id='msi_user_products'; provider="HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\UserData\$sid\Products"; reg="HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\UserData\$sid\Products" }
            )
            $baselineInstallerTreeSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $baselineInstallerTreesPath = Join-Path $baselineRoot 'installer-registry-trees.json'
            if (Test-Path -LiteralPath $baselineInstallerTreesPath) {
              foreach ($saved in @(Get-Content -LiteralPath $baselineInstallerTreesPath -Raw | ConvertFrom-Json)) { [void]$baselineInstallerTreeSet.Add("$([string]$saved.root_id)|$([string]$saved.child)") }
            }
            $installerTreeManifest = [System.Collections.Generic.List[object]]::new()
            $installerTreeIndex = 0
            foreach ($root in $installerTreeRoots) {
              if (-not (Test-Path -LiteralPath $root.provider)) { continue }
              foreach ($child in @(Get-ChildItem -LiteralPath $root.provider -ErrorAction Stop)) {
                $treeKey = "$([string]$root.id)|$([string]$child.PSChildName)"
                if ($baselineInstallerTreeSet.Contains($treeKey)) { continue }
                $installerTreeIndex++
                $file = ('installer-registry-{0:D5}.reg' -f $installerTreeIndex)
                $regPath = "$([string]$root.reg)\$([string]$child.PSChildName)"
                & reg.exe export $regPath (Join-Path $installerRegistryRoot $file) /y | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "Installer registry tree export failed: $regPath" }
                [void]$installerTreeManifest.Add([pscustomobject]@{ root_id=$root.id; child=[string]$child.PSChildName; registry_path=$regPath; file=$file })
              }
            }
            ConvertTo-Json -InputObject @($installerTreeManifest) -Depth 6 | Set-Content -LiteralPath (Join-Path $stateRoot 'installer-registry-trees.json') -Encoding UTF8

            $baselineInstallerCacheSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $baselineInstallerCachePath = Join-Path $baselineRoot 'installer-cache-files.json'
            if (Test-Path -LiteralPath $baselineInstallerCachePath) {
              foreach ($saved in @(Get-Content -LiteralPath $baselineInstallerCachePath -Raw | ConvertFrom-Json)) { if ($saved) { [void]$baselineInstallerCacheSet.Add([string]$saved) } }
            }
            $installerCacheManifest = [System.Collections.Generic.List[object]]::new()
            $liveInstallerCache = Join-Path $env:WINDIR 'Installer'
            if (Test-Path -LiteralPath $liveInstallerCache -PathType Container) {
              foreach ($fileInfo in @(Get-ChildItem -LiteralPath $liveInstallerCache -File -Recurse -Force -ErrorAction Stop)) {
                $relative = $fileInfo.FullName.Substring($liveInstallerCache.Length).TrimStart('\')
                if ($baselineInstallerCacheSet.Contains($relative)) { continue }
                $destination = Join-Path $installerCacheBackupRoot $relative
                New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($destination)) -Force | Out-Null
                Copy-Item -LiteralPath $fileInfo.FullName -Destination $destination -Force
                [void]$installerCacheManifest.Add([pscustomobject]@{ relative=$relative; bytes=[int64]$fileInfo.Length })
              }
            }
            ConvertTo-Json -InputObject @($installerCacheManifest) -Depth 5 | Set-Content -LiteralPath (Join-Path $stateRoot 'installer-cache.json') -Encoding UTF8

            # Copy the live user profile through a VSS snapshot. The managed desktop
            # shares the runner's active Windows session, so files such as WebCache,
            # Search/StartMenu settings and notification databases can be locked while
            # the managed desktop remains connected. VSS gives robocopy a stable read-only view
            # without logging the user off or weakening backup fidelity.
            $volumeRoot = [IO.Path]::GetPathRoot($profileRoot)
            if ([string]::IsNullOrWhiteSpace($volumeRoot)) { throw "Could not resolve profile volume: $profileRoot" }
            $shadowId = ''
            $shadowLink = Join-Path $env:RUNNER_TEMP "managed-vss-$env:GITHUB_RUN_ID"
            try {
              $volumeSpec = $volumeRoot.TrimEnd('\')
              $vssOutput = @(& vssadmin.exe create shadow "/for=$volumeSpec" 2>&1)
              $vssExit = $LASTEXITCODE
              $vssText = ($vssOutput | ForEach-Object { [string]$_ }) -join "`n"
              if ($vssExit -ne 0) {
                $detail = ($vssText -replace '\r?\n',' | ').Trim()
                throw "vssadmin create failed exit=$vssExit detail=$detail"
              }
              $idMatch = [regex]::Match($vssText, '(?im)^\s*Shadow Copy ID:\s*(\{[0-9A-Fa-f-]+\})\s*$')
              $deviceMatch = [regex]::Match($vssText, '(?im)^\s*Shadow Copy Volume Name:\s*(.+?)\s*$')
              if (-not $idMatch.Success -or -not $deviceMatch.Success) {
                throw "vssadmin output did not contain shadow identity/device: $($vssText -replace '\r?\n',' | ')"
              }
              $shadowId = $idMatch.Groups[1].Value.Trim()
              $snapshotRoot = $deviceMatch.Groups[1].Value.Trim().TrimEnd('\')
              if (-not $snapshotRoot.StartsWith('\\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy', [System.StringComparison]::OrdinalIgnoreCase)) {
                throw "Unexpected VSS device path: $snapshotRoot"
              }

              # robocopy does not accept the GLOBALROOT device path directly. Expose
              # the snapshot through a temporary local directory symlink, then copy
              # through that ordinary filesystem path.
              if (Test-Path -LiteralPath $shadowLink) { & cmd.exe /d /c rmdir $shadowLink 2>$null | Out-Null }
              $linkTarget = "$snapshotRoot\"
              $linkOutput = @(& cmd.exe /d /c mklink /D $shadowLink $linkTarget 2>&1)
              $linkExit = $LASTEXITCODE
              if ($linkExit -ne 0 -or -not (Test-Path -LiteralPath $shadowLink)) {
                throw "VSS symlink create failed exit=$linkExit detail=$(($linkOutput -join ' | '))"
              }

              $relativeProfile = $profileRoot.Substring($volumeRoot.Length).TrimStart('\')
              $profileSource = Join-Path $shadowLink $relativeProfile
              Write-Host "MANAGED_WINDOWS_VSS_READY id=$shadowId source=$profileSource"

              $args = @(
                $profileSource, $backupProfile,
                '/E','/COPY:DAT','/DCOPY:DAT','/R:1','/W:1','/XJ','/NFL','/NDL','/NP',
                '/XF',
                'NTUSER.DAT','NTUSER.DAT.LOG*','ntuser.ini','UsrClass.dat','UsrClass.dat.LOG*',
                'WebCacheLock.dat','iconcache_*.db','thumbcache_*.db','settings.dat.LOG*','WPNPRMRY.tmp','wpndatabase.db-shm','wpndatabase.db-wal','StartupProfileData-*',
                '/XD',
                (Join-Path $profileSource 'AppData\Local\Temp'),
                (Join-Path $profileSource 'AppData\Local\Microsoft\Windows'),
                (Join-Path $profileSource 'AppData\Local\Microsoft\Windows\Caches'),
                (Join-Path $profileSource 'AppData\Local\Microsoft\Windows\WebCache'),
                (Join-Path $profileSource 'AppData\Local\Microsoft\Windows\Notifications'),
                (Join-Path $profileSource 'AppData\Local\Packages\Microsoft.Windows.Search_cw5n1h2txyewy'),
                (Join-Path $profileSource 'AppData\Local\Packages\Microsoft.Windows.StartMenuExperienceHost_cw5n1h2txyewy'),
                (Join-Path $profileSource 'AppData\Local\Packages\Microsoft.Windows.ShellExperienceHost_cw5n1h2txyewy'),
                (Join-Path $profileSource 'AppData\Local\Packages\MicrosoftWindows.Client.CBS_cw5n1h2txyewy'),
                (Join-Path $profileSource 'AppData\Local\Packages\Microsoft.Windows.CloudExperienceHost_cw5n1h2txyewy'),
                (Join-Path $profileSource 'AppData\Local\Packages\Microsoft.AAD.BrokerPlugin_cw5n1h2txyewy'),
                (Join-Path $profileSource 'AppData\Local\Microsoft\TokenBroker'),
                (Join-Path $profileSource 'AppData\Local\Microsoft\IdentityCache'),
                (Join-Path $profileSource 'AppData\Local\Microsoft\OneAuth'),
                (Join-Path $profileSource 'AppData\Local\ConnectedDevicesPlatform'),
                (Join-Path $profileSource 'AppData\Local\D3DSCache'),
                (Join-Path $profileSource 'AppData\Local\CrashDumps'),
                (Join-Path $profileSource 'AppData\Local\Google\Chrome\User Data\Default\Cache'),
                (Join-Path $profileSource 'AppData\Local\Google\Chrome\User Data\Default\Code Cache'),
                (Join-Path $profileSource 'AppData\Local\Microsoft\Edge\User Data\Default\Cache'),
                (Join-Path $profileSource 'AppData\Local\Microsoft\Edge\User Data\Default\Code Cache')
              )
              & robocopy.exe @args | Out-Host
              $robocopyExit = $LASTEXITCODE
              if ($robocopyExit -ge 8) { throw "robocopy VSS backup failed with exit code $robocopyExit" }
              Write-Host "MANAGED_WINDOWS_VSS_COPY_OK exit=$robocopyExit"

            } finally {
              if (Test-Path -LiteralPath $shadowLink) { & cmd.exe /d /c rmdir $shadowLink 2>$null | Out-Null }
              if (-not [string]::IsNullOrWhiteSpace($shadowId)) {
                $deleteOutput = @(& vssadmin.exe delete shadows "/shadow=$shadowId" /quiet 2>&1)
                $deleteExit = $LASTEXITCODE
                if ($deleteExit -eq 0) { Write-Host "MANAGED_WINDOWS_VSS_RELEASED id=$shadowId" }
                else { Write-Warning "VSS cleanup failed id=$shadowId exit=$deleteExit detail=$(($deleteOutput -join ' | '))" }
              }
            }

            # Copy only software roots discovered from explicit installation/service evidence.
            # Each fixed volume gets its own VSS snapshot; if VSS is unavailable for a volume,
            # fall back to live copy and still fail on real robocopy errors.
            $softwareCopiedRoots = 0
            foreach ($volumeGroup in @($softwareRoots | Group-Object volume)) {
              $softwareVolume = ([string]$volumeGroup.Name).ToUpperInvariant()
              if ($softwareVolume -notmatch '^[A-Z]:$') { throw "Invalid software volume: $softwareVolume" }
              $softwareVolumeRoot = "$softwareVolume\"
              if (-not (Test-Path -LiteralPath $softwareVolumeRoot)) { throw "Software volume is unavailable: $softwareVolume" }
              $softwareVolumeKey = $softwareVolume.TrimEnd(':')
              $softwareShadowId = ''
              $softwareShadowLink = Join-Path $env:RUNNER_TEMP "managed-software-vss-$env:GITHUB_RUN_ID-$softwareVolumeKey"
              $softwareSnapshotReady = $false
              try {
                try {
                  $softwareVssOutput = @(& vssadmin.exe create shadow "/for=$softwareVolume" 2>&1)
                  $softwareVssExit = $LASTEXITCODE
                  $softwareVssText = ($softwareVssOutput | ForEach-Object { [string]$_ }) -join "`n"
                  if ($softwareVssExit -ne 0) { throw "vssadmin create exited $softwareVssExit" }
                  $softwareIdMatch = [regex]::Match($softwareVssText, '(?im)^\s*Shadow Copy ID:\s*(\{[0-9A-Fa-f-]+\})\s*$')
                  $softwareDeviceMatch = [regex]::Match($softwareVssText, '(?im)^\s*Shadow Copy Volume Name:\s*(.+?)\s*$')
                  if (-not $softwareIdMatch.Success -or -not $softwareDeviceMatch.Success) { throw 'VSS output did not contain shadow identity/device' }
                  $softwareShadowId = $softwareIdMatch.Groups[1].Value.Trim()
                  $softwareSnapshotRoot = $softwareDeviceMatch.Groups[1].Value.Trim().TrimEnd('\')
                  if (-not $softwareSnapshotRoot.StartsWith('\\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy',[System.StringComparison]::OrdinalIgnoreCase)) {
                    throw "Unexpected VSS device path: $softwareSnapshotRoot"
                  }
                  if (Test-Path -LiteralPath $softwareShadowLink) { & cmd.exe /d /c rmdir $softwareShadowLink 2>$null | Out-Null }
                  $softwareLinkOutput = @(& cmd.exe /d /c mklink /D $softwareShadowLink "$softwareSnapshotRoot\" 2>&1)
                  if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $softwareShadowLink)) {
                    throw "VSS symlink create failed: $(($softwareLinkOutput -join ' | '))"
                  }
                  $softwareSnapshotReady = $true
                  Write-Host "MANAGED_WINDOWS_SOFTWARE_VSS_READY volume=$softwareVolume id=$softwareShadowId"
                } catch {
                  Write-Warning "Software VSS unavailable for $softwareVolume; falling back to live copy: $($_.Exception.Message)"
                }

                foreach ($softwareRoot in @($volumeGroup.Group)) {
                  $relative = ([string]$softwareRoot.relative).TrimStart('\')
                  if ([string]::IsNullOrWhiteSpace($relative) -or [IO.Path]::IsPathRooted($relative) -or $relative.Split('\') -contains '..') {
                    throw "Unsafe software backup relative path: $relative"
                  }
                  $liveSource = Join-Path $softwareVolumeRoot $relative
                  if (-not (Test-Path -LiteralPath $liveSource -PathType Container)) { Write-Warning "Software root disappeared before backup: $liveSource"; continue }
                  $copySource = if ($softwareSnapshotReady) { Join-Path $softwareShadowLink $relative } else { $liveSource }
                  if (-not (Test-Path -LiteralPath $copySource -PathType Container)) { throw "Software backup source is unavailable: $copySource" }
                  $softwareVolumeBackup = Join-Path $backupSoftware $softwareVolumeKey
                  $softwareDestination = Join-Path $softwareVolumeBackup $relative
                  New-Item -ItemType Directory -Path $softwareVolumeBackup -Force | Out-Null
                  & robocopy.exe $copySource $softwareDestination /E /COPY:DAT /DCOPY:DAT /R:1 /W:1 /XJ /NFL /NDL /NP | Out-Host
                  $softwareExit = $LASTEXITCODE
                  if ($softwareExit -ge 8) { throw "Software backup failed exit=$softwareExit source=$liveSource" }
                  $softwareCopiedRoots++
                  Write-Host "MANAGED_WINDOWS_SOFTWARE_ROOT_BACKED_UP volume=$softwareVolume relative=$relative exit=$softwareExit reason=$($softwareRoot.reason)"
                }
              } finally {
                if (Test-Path -LiteralPath $softwareShadowLink) { & cmd.exe /d /c rmdir $softwareShadowLink 2>$null | Out-Null }
                if (-not [string]::IsNullOrWhiteSpace($softwareShadowId)) {
                  $softwareDeleteOutput = @(& vssadmin.exe delete shadows "/shadow=$softwareShadowId" /quiet 2>&1)
                  if ($LASTEXITCODE -ne 0) { Write-Warning "Software VSS cleanup failed volume=$softwareVolume detail=$(($softwareDeleteOutput -join ' | '))" }
                }
              }
            }
            if ($softwareCopiedRoots -lt @($softwareRoots).Count) {
              throw "Strict V9 software-root backup incomplete expected=$(@($softwareRoots).Count) actual=$softwareCopiedRoots"
            }
            Write-Host "MANAGED_WINDOWS_SOFTWARE_COPY_OK roots=$softwareCopiedRoots candidates=$(@($softwareRoots).Count)"

            function Save-HiveSnapshot {
              param(
                [Parameter(Mandatory=$true)][string]$ProviderRoot,
                [Parameter(Mandatory=$true)][string]$RegRoot,
                [Parameter(Mandatory=$true)][string]$MountRoot,
                [Parameter(Mandatory=$true)][string]$HiveFile,
                [Parameter(Mandatory=$true)][string]$Destination
              )
              if (-not (Test-Path -LiteralPath $HiveFile)) { return $false }
              $loadedHere = $false
              $sourceRoot = $RegRoot
              if (-not (Test-Path $ProviderRoot)) {
                & reg.exe load "HKU\$MountRoot" $HiveFile | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "reg load failed for $HiveFile" }
                $loadedHere = $true
                $sourceRoot = "HKU\$MountRoot"
              }
              try {
                & reg.exe save $sourceRoot $Destination /y | Out-Null
                if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $Destination)) {
                  throw "reg save failed for $sourceRoot"
                }
              } finally {
                if ($loadedHere) {
                  [gc]::Collect(); [gc]::WaitForPendingFinalizers()
                  & reg.exe unload "HKU\$MountRoot" | Out-Null
                }
              }
              return $true
            }

            $registryExports = 0
            Write-Host 'MANAGED_WINDOWS_USER_HIVE_BACKUP_SKIPPED policy=clean-shell-v4'

            # Preserve only Run/RunOnce DELTAS relative to the pristine runner. Also retain
            # StartupApproved binary state so an app that was enabled for startup remains enabled.
            function Get-CurrentStartupEntries {
              $entries = [System.Collections.Generic.List[object]]::new()
              foreach ($path in @(
                'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run',
                'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce',
                'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Run',
                'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\RunOnce',
                'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run',
                'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce'
              )) {
                if (-not (Test-Path -LiteralPath $path)) { continue }
                $key = Get-Item -LiteralPath $path
                foreach ($name in $key.GetValueNames()) {
                  if ([string]::IsNullOrWhiteSpace($name)) { continue }
                  $kind = $key.GetValueKind($name).ToString()
                  if ($kind -notin @('String','ExpandString')) { continue }
                  $value = $key.GetValue($name, $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
                  [void]$entries.Add([pscustomobject]@{ path=$path; name=$name; value=[string]$value; kind=$kind })
                }
              }
              return @($entries)
            }
            $baselineStartup = @{}
            $baselineStartupPath = Join-Path $baselineRoot 'startup-entries.json'
            if (Test-Path -LiteralPath $baselineStartupPath) {
              foreach ($entry in @(Get-Content -LiteralPath $baselineStartupPath -Raw | ConvertFrom-Json)) {
                $key = "$( [string]$entry.path )|$( [string]$entry.name )".ToLowerInvariant()
                $baselineStartup[$key] = $entry
              }
            }
            $startupEntries = @()
            foreach ($entry in @(Get-CurrentStartupEntries)) {
              $key = "$( [string]$entry.path )|$( [string]$entry.name )".ToLowerInvariant()
              $before = if ($baselineStartup.ContainsKey($key)) { $baselineStartup[$key] } else { $null }
              if ($null -eq $before -or [string]$before.value -ne [string]$entry.value -or [string]$before.kind -ne [string]$entry.kind) {
                $startupEntries += $entry
              }
            }
            ConvertTo-Json -InputObject @($startupEntries) -Depth 5 | Set-Content -LiteralPath (Join-Path $stateRoot 'machine-startup.json') -Encoding UTF8

            $startupNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            foreach ($entry in $startupEntries) { if ($entry.name) { [void]$startupNames.Add([string]$entry.name) } }
            $startupApproved = [System.Collections.Generic.List[object]]::new()
            foreach ($approvedPath in @(
              'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\StartupApproved\Run',
              'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\StartupApproved\Run32',
              'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\StartupApproved\StartupFolder',
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\StartupApproved\Run',
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\StartupApproved\Run32',
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\StartupApproved\StartupFolder'
            )) {
              if (-not (Test-Path -LiteralPath $approvedPath)) { continue }
              $key = Get-Item -LiteralPath $approvedPath
              foreach ($name in $key.GetValueNames()) {
                if ([string]::IsNullOrWhiteSpace($name)) { continue }
                $nameToken = Normalize-AppIdentityToken -Value ([string]$name)
                if (-not $startupNames.Contains([string]$name) -and -not (Test-AppIdentityTokenMatch -Token $nameToken)) { continue }
                try {
                  $raw = $key.GetValue($name, $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
                  if ($raw -is [byte[]]) {
                    [void]$startupApproved.Add([pscustomobject]@{ path=$approvedPath; name=$name; value_b64=[Convert]::ToBase64String($raw) })
                  }
                } catch { }
              }
            }
            ConvertTo-Json -InputObject @($startupApproved) -Depth 5 | Set-Content -LiteralPath (Join-Path $stateRoot 'startup-approved.json') -Encoding UTF8

            $commonStartup = [Environment]::GetFolderPath('CommonStartup')
            $baselineCommonStartupSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $baselineCommonStartupPath = Join-Path $baselineRoot 'common-startup-files.json'
            if (Test-Path -LiteralPath $baselineCommonStartupPath) {
              foreach ($saved in @(Get-Content -LiteralPath $baselineCommonStartupPath -Raw | ConvertFrom-Json)) { if ($saved) { [void]$baselineCommonStartupSet.Add([string]$saved) } }
            }
            $commonStartupManifest = [System.Collections.Generic.List[object]]::new()
            if ($commonStartup -and (Test-Path -LiteralPath $commonStartup)) {
              foreach ($fileInfo in @(Get-ChildItem -LiteralPath $commonStartup -File -Recurse -Force -ErrorAction SilentlyContinue)) {
                $relative = $fileInfo.FullName.Substring($commonStartup.Length).TrimStart('\')
                $fileToken = Normalize-AppIdentityToken -Value ([IO.Path]::GetFileNameWithoutExtension($fileInfo.Name))
                if ($baselineCommonStartupSet.Contains($relative) -and -not (Test-AppIdentityTokenMatch -Token $fileToken)) { continue }
                $dest = Join-Path $commonStartupBackupRoot $relative
                New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($dest)) -Force | Out-Null
                Copy-Item -LiteralPath $fileInfo.FullName -Destination $dest -Force
                [void]$commonStartupManifest.Add([pscustomobject]@{ relative=$relative })
              }
            }
            ConvertTo-Json -InputObject @($commonStartupManifest) -Depth 4 | Set-Content -LiteralPath (Join-Path $stateRoot 'common-startup.json') -Encoding UTF8

            # Non-Microsoft scheduled tasks are portable enough to re-register after applications are installed.
            $taskManifest = @()
            $taskIndex = 0
            Get-ScheduledTask -ErrorAction SilentlyContinue | ForEach-Object {
              $task = $_
              if ([string]$task.TaskPath -like '\Microsoft\*' -or [string]$task.Author -like 'Microsoft*') { return }
              try {
                $taskIndex++
                $file = ('task-{0:D4}.xml' -f $taskIndex)
                Export-ScheduledTask -TaskName $task.TaskName -TaskPath $task.TaskPath | Set-Content -LiteralPath (Join-Path $taskRoot $file) -Encoding UTF8
                $taskManifest += [pscustomobject]@{ name=$task.TaskName; path=$task.TaskPath; file=$file }
              } catch { Write-Warning "scheduled task backup skipped: $($_.Exception.Message)" }
            }
            ConvertTo-Json -InputObject @($taskManifest) -Depth 5 | Set-Content -LiteralPath (Join-Path $stateRoot 'scheduled-tasks.json') -Encoding UTF8

            # Record third-party auto-start services from the same registry-backed inventory used for the delta.
            $autoServices = @($currentServices | Where-Object {
              $_.start -eq 2 -and $_.path -and $_.path -notmatch '(?i)\\Windows\\(System32|SysWOW64)'
            } | ForEach-Object {
              [pscustomobject]@{ name=$_.name; display_name=$_.display_name; path=[string]$_.path; state=if ((& sc.exe query ([string]$_.name) 2>&1) -match '(?im)STATE\s*:\s*4\s+RUNNING') { 'Running' } else { 'Stopped' } }
            })
            ConvertTo-Json -InputObject $autoServices -Depth 5 | Set-Content -LiteralPath (Join-Path $stateRoot 'auto-services.json') -Encoding UTF8

            # Capture kernel/system-driver deltas from HKLM\SYSTEM\CurrentControlSet\Services instead of CIM.
            # This remains reliable after Rename-LocalUser and fails closed if the baseline/current inventory is implausible.
            $baselineDriversPath = Join-Path $baselineRoot 'drivers.json'
            if (-not (Test-Path -LiteralPath $baselineDriversPath)) { throw 'Baseline driver inventory is missing' }
            $baselineDriversSaved = @(Get-Content -LiteralPath $baselineDriversPath -Raw | ConvertFrom-Json)
            if ($baselineDriversSaved.Count -lt 100) { throw "Baseline driver inventory is invalid: count=$($baselineDriversSaved.Count)" }
            $baselineDriverNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            foreach ($driver in $baselineDriversSaved) { if ($driver.name) { [void]$baselineDriverNames.Add([string]$driver.name) } }
            function Resolve-DriverBinaryPath {
              param([string]$Value)
              if ([string]::IsNullOrWhiteSpace($Value)) { return '' }
              $path = [Environment]::ExpandEnvironmentVariables($Value.Trim().Trim('"'))
              if ($path -match '^(?i)\\SystemRoot\\(.+)$') { $path = Join-Path $env:SystemRoot $matches[1] }
              if ($path -match '^(?i)System32\\(.+)$') { $path = Join-Path $env:SystemRoot $path }
              try { if ([IO.Path]::IsPathRooted($path)) { return [IO.Path]::GetFullPath($path) } } catch { }
              return ''
            }
            $currentDrivers = @(Get-RegistryServiceInventory -Kind driver)
            if ($currentDrivers.Count -lt [math]::Floor($baselineDriversSaved.Count * 0.7)) {
              throw "Current driver inventory failed sanity check baseline=$($baselineDriversSaved.Count) current=$($currentDrivers.Count)"
            }
            $driverManifest = [System.Collections.Generic.List[object]]::new()
            $driverIndex = 0
            $driverDelta = @($currentDrivers | Where-Object { $_.name -and -not $baselineDriverNames.Contains([string]$_.name) })
            foreach ($driver in $driverDelta) {
              $driverIndex++
              $safeName = ([string]$driver.name -replace '[^A-Za-z0-9._-]','_')
              $regFile = ('driver-{0:D4}.reg' -f $driverIndex)
              $regPath = "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\$([string]$driver.name)"
              $regDestination = Join-Path $driverStateRoot $regFile
              & reg.exe export $regPath $regDestination /y | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Driver registry export failed: $($driver.name)" }
              $binaryPath = Resolve-DriverBinaryPath -Value ([string]$driver.path)
              $binaryFile = ''
              if ($binaryPath -and (Test-Path -LiteralPath $binaryPath -PathType Leaf)) {
                $extension = [IO.Path]::GetExtension($binaryPath)
                $binaryFile = "$safeName$extension"
                Copy-Item -LiteralPath $binaryPath -Destination (Join-Path $driverFileRoot $binaryFile) -Force
              }
              $queryText = (& sc.exe query ([string]$driver.name) 2>&1) -join "`n"
              $driverState = if ($queryText -match '(?im)^\s*STATE\s*:\s*4\s+RUNNING\b') { 'Running' } else { 'Stopped' }
              [void]$driverManifest.Add([pscustomobject]@{
                name=[string]$driver.name; display_name=[string]$driver.display_name; path=[string]$driver.path;
                start=[int]$driver.start; start_mode=[string]$driver.start_mode; state=$driverState; registry_file=$regFile;
                binary_path=$binaryPath; binary_file=$binaryFile; type=[int64]$driver.type; error_control=[int]$driver.error_control
              })
              Write-Host "MANAGED_WINDOWS_DRIVER_DELTA name=$($driver.name) path=$binaryPath registry=$regFile file=$binaryFile"
            }
            ConvertTo-Json -InputObject @($driverManifest) -Depth 6 | Set-Content -LiteralPath (Join-Path $stateRoot 'drivers.json') -Encoding UTF8

            $baselineDriverPackages = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $baselineDriverPackagesPath = Join-Path $baselineRoot 'driver-packages.txt'
            if (Test-Path -LiteralPath $baselineDriverPackagesPath) {
              foreach ($line in Get-Content -LiteralPath $baselineDriverPackagesPath) { if ($line.Trim()) { [void]$baselineDriverPackages.Add($line.Trim()) } }
            }
            $driverPackageManifest = [System.Collections.Generic.List[object]]::new()
            try {
              $pnputilCurrent = (& pnputil.exe /enum-drivers 2>$null) -join "`n"
              $currentOemInf = @([regex]::Matches($pnputilCurrent, '(?im)^\s*Published Name\s*:\s*(oem\d+\.inf)\s*$') | ForEach-Object { $_.Groups[1].Value.ToLowerInvariant() } | Sort-Object -Unique)
              foreach ($publishedName in $currentOemInf) {
                if ($baselineDriverPackages.Contains($publishedName)) { continue }
                $packageDir = Join-Path $driverPackageRoot ([IO.Path]::GetFileNameWithoutExtension($publishedName))
                New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
                & pnputil.exe /export-driver $publishedName $packageDir | Out-Host
                if ($LASTEXITCODE -eq 0 -and (Get-ChildItem -LiteralPath $packageDir -Filter '*.inf' -Recurse -ErrorAction SilentlyContinue)) {
                  $exportedInf = @(Get-ChildItem -LiteralPath $packageDir -Filter '*.inf' -Recurse -File -ErrorAction Stop | Select-Object -First 1)
                  $originalName = if ($exportedInf.Count) { [string]$exportedInf[0].Name } else { '' }
                  [void]$driverPackageManifest.Add([pscustomobject]@{ published_name=$publishedName; original_name=$originalName; directory=[IO.Path]::GetFileName($packageDir) })
                  Write-Host "MANAGED_WINDOWS_DRIVER_PACKAGE_BACKED_UP published=$publishedName"
                } else {
                  Remove-Item -LiteralPath $packageDir -Recurse -Force -ErrorAction SilentlyContinue
                }
              }
            } catch { Write-Warning "driver package delta export skipped: $($_.Exception.Message)" }
            ConvertTo-Json -InputObject @($driverPackageManifest) -Depth 5 | Set-Content -LiteralPath (Join-Path $stateRoot 'driver-packages.json') -Encoding UTF8

            # Capture PnP device-instance deltas tied to driver packages installed after the pristine baseline.
            # This is app-agnostic: no vendor/product names are hard-coded. ROOT devices can be recreated generically;
            # other enumerators are recorded and strictly verified after package restore.
            $baselinePnpPath = Join-Path $baselineRoot 'pnp-device-ids.txt'
            if (-not (Test-Path -LiteralPath $baselinePnpPath)) { throw 'Baseline PnP inventory is missing' }
            $baselinePnpIds = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            foreach ($line in Get-Content -LiteralPath $baselinePnpPath) { if ($line.Trim()) { [void]$baselinePnpIds.Add($line.Trim()) } }
            if ($baselinePnpIds.Count -lt 20) { throw "Baseline PnP inventory is invalid: count=$($baselinePnpIds.Count)" }
            $currentPnpText = (& pnputil.exe /enum-devices 2>&1) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "Current PnP inventory failed exit=$LASTEXITCODE" }
            $currentPnpIds = @([regex]::Matches($currentPnpText, '(?im)^\s*Instance ID\s*:\s*(.+?)\s*$') | ForEach-Object { $_.Groups[1].Value.Trim() } | Sort-Object -Unique)
            if ($currentPnpIds.Count -lt [math]::Floor($baselinePnpIds.Count * 0.5)) {
              throw "Current PnP inventory failed sanity check baseline=$($baselinePnpIds.Count) current=$($currentPnpIds.Count)"
            }
            $deltaPackageNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $deltaOriginalInfNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            foreach ($pkg in $driverPackageManifest) {
              if ($pkg.published_name) { [void]$deltaPackageNames.Add([string]$pkg.published_name) }
              if ($pkg.original_name) { [void]$deltaOriginalInfNames.Add([string]$pkg.original_name) }
            }
            $pnpDeviceManifest = [System.Collections.Generic.List[object]]::new()
            foreach ($instanceId in @($currentPnpIds | Where-Object { -not $baselinePnpIds.Contains([string]$_) })) {
              $detail = (& pnputil.exe /enum-devices /instanceid $instanceId /deviceids /drivers 2>&1) -join "`n"
              if ($LASTEXITCODE -ne 0) { throw "PnP detail inventory failed for $instanceId exit=$LASTEXITCODE" }
              $driverMatch = [regex]::Match($detail, '(?im)^\s*Driver Name\s*:\s*(.+?)\s*$')
              $originalMatch = [regex]::Match($detail, '(?im)^\s*Original Name\s*:\s*(.+?)\s*$')
              $driverName = if ($driverMatch.Success) { $driverMatch.Groups[1].Value.Trim() } else { '' }
              $originalName = if ($originalMatch.Success) { $originalMatch.Groups[1].Value.Trim() } else { '' }
              if (-not (($driverName -and $deltaPackageNames.Contains($driverName)) -or ($originalName -and $deltaOriginalInfNames.Contains($originalName)))) { continue }
              $descriptionMatch = [regex]::Match($detail, '(?im)^\s*Device Description\s*:\s*(.+?)\s*$')
              $classNameMatch = [regex]::Match($detail, '(?im)^\s*Class Name\s*:\s*(.+?)\s*$')
              $classGuidMatch = [regex]::Match($detail, '(?im)^\s*Class GUID\s*:\s*(\{[0-9A-Fa-f-]+\})\s*$')
              $manufacturerMatch = [regex]::Match($detail, '(?im)^\s*Manufacturer Name\s*:\s*(.+?)\s*$')
              $statusMatch = [regex]::Match($detail, '(?im)^\s*Status\s*:\s*(.+?)\s*$')
              $hardwareMatch = [regex]::Match($detail, '(?im)^\s*Hardware IDs\s*:\s*(.+?)\s*$')
              $hardwareId = if ($hardwareMatch.Success) { $hardwareMatch.Groups[1].Value.Trim() } else { '' }
              $strategy = if ($instanceId.StartsWith('ROOT\',[System.StringComparison]::OrdinalIgnoreCase) -and $hardwareId -and $classGuidMatch.Success) { 'root-setupapi' } else { 'package-install-verify' }
              [void]$pnpDeviceManifest.Add([pscustomobject]@{
                instance_id=[string]$instanceId; hardware_id=$hardwareId;
                description=if ($descriptionMatch.Success) { $descriptionMatch.Groups[1].Value.Trim() } else { '' };
                class_name=if ($classNameMatch.Success) { $classNameMatch.Groups[1].Value.Trim() } else { '' };
                class_guid=if ($classGuidMatch.Success) { $classGuidMatch.Groups[1].Value.Trim() } else { '' };
                manufacturer=if ($manufacturerMatch.Success) { $manufacturerMatch.Groups[1].Value.Trim() } else { '' };
                status=if ($statusMatch.Success) { $statusMatch.Groups[1].Value.Trim() } else { '' };
                published_inf=$driverName; original_inf=$originalName; restore_strategy=$strategy
              })
              Write-Host "MANAGED_WINDOWS_PNP_DELTA instance=$instanceId hardware=$hardwareId inf=$originalName strategy=$strategy"
            }
            ConvertTo-Json -InputObject @($pnpDeviceManifest) -Depth 7 | Set-Content -LiteralPath (Join-Path $stateRoot 'pnp-devices.json') -Encoding UTF8

            # installed-apps.json and installed-apps-delta.json were captured before VSS
            # so their install roots could participate in the machine-level software snapshot.
            # Save only package-manager DELTAS relative to the pristine runner image.
            # This avoids reinstalling the large set of software that GitHub already preloads on every new runner.
            $baselineRoot = Join-Path $env:RUNNER_TEMP 'managed-software-baseline'
            $wingetDeltaCount = 0
            $chocoDeltaCount = 0
            $scoopDeltaCount = 0

            if (Get-Command winget.exe -ErrorAction SilentlyContinue) {
              try {
                $currentPath = Join-Path $stateRoot 'winget-current.json'
                & winget.exe export -o $currentPath --accept-source-agreements --disable-interactivity
                if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $currentPath)) {
                  $current = Get-Content -LiteralPath $currentPath -Raw | ConvertFrom-Json
                  $baselineIds = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
                  $baselinePath = Join-Path $baselineRoot 'winget.json'
                  if (Test-Path -LiteralPath $baselinePath) {
                    $baseline = Get-Content -LiteralPath $baselinePath -Raw | ConvertFrom-Json
                    foreach ($source in @($baseline.Sources)) {
                      foreach ($pkg in @($source.Packages)) {
                        if ($pkg.PackageIdentifier) { [void]$baselineIds.Add([string]$pkg.PackageIdentifier) }
                      }
                    }
                  }
                  $deltaSources = @()
                  foreach ($source in @($current.Sources)) {
                    $packages = @($source.Packages | Where-Object { $_.PackageIdentifier -and -not $baselineIds.Contains([string]$_.PackageIdentifier) })
                    if ($packages.Count) {
                      $wingetDeltaCount += $packages.Count
                      $deltaSources += [pscustomobject]@{ Packages=$packages; SourceDetails=$source.SourceDetails }
                    }
                  }
                  if ($wingetDeltaCount -gt 0) {
                    $delta = [ordered]@{}
                    if ($current.PSObject.Properties.Name -contains '$schema') { $delta['$schema'] = $current.'$schema' }
                    $delta['CreationDate'] = [DateTime]::UtcNow.ToString('o')
                    $delta['Sources'] = $deltaSources
                    ConvertTo-Json -InputObject $delta -Depth 12 | Set-Content -LiteralPath (Join-Path $stateRoot 'winget.json') -Encoding UTF8
                  }
                }
                Remove-Item -LiteralPath $currentPath -Force -ErrorAction SilentlyContinue
              } catch { Write-Warning "winget delta export skipped: $($_.Exception.Message)" }
            }

            if (Get-Command choco.exe -ErrorAction SilentlyContinue) {
              try {
                $baselineVersions = @{}
                $baselinePath = Join-Path $baselineRoot 'choco-packages.txt'
                if (Test-Path -LiteralPath $baselinePath) {
                  foreach ($line in Get-Content -LiteralPath $baselinePath) {
                    $parts = ([string]$line) -split '\|', 2
                    if ($parts.Count -gt 0 -and $parts[0].Trim()) { $baselineVersions[$parts[0].Trim().ToLowerInvariant()] = if ($parts.Count -gt 1) { $parts[1].Trim() } else { '' } }
                  }
                }
                $currentChoco = @(& choco.exe list --local-only --limit-output 2>$null)
                if ($LASTEXITCODE -ne 0) { $currentChoco = @(& choco.exe list --limit-output 2>$null) }
                $deltaChoco = @()
                foreach ($line in $currentChoco) {
                  $parts = ([string]$line) -split '\|', 2
                  if ($parts.Count -lt 1 -or -not $parts[0].Trim()) { continue }
                  $name = $parts[0].Trim()
                  $version = if ($parts.Count -gt 1) { $parts[1].Trim() } else { '' }
                  $keyName = $name.ToLowerInvariant()
                  if (-not $baselineVersions.ContainsKey($keyName) -or [string]$baselineVersions[$keyName] -ne $version) { $deltaChoco += [string]$line }
                }
                $chocoDeltaCount = $deltaChoco.Count
                if ($chocoDeltaCount) { $deltaChoco | Set-Content -LiteralPath (Join-Path $stateRoot 'choco-packages.txt') -Encoding UTF8 }
              } catch { Write-Warning "choco delta inventory skipped: $($_.Exception.Message)" }
            }

            if (Get-Command scoop -ErrorAction SilentlyContinue) {
              try {
                $currentScoopPath = Join-Path $stateRoot 'scoop-current.json'
                & scoop export | Set-Content -LiteralPath $currentScoopPath -Encoding UTF8
                $currentScoop = Get-Content -LiteralPath $currentScoopPath -Raw | ConvertFrom-Json
                $baselineNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
                $baselineScoopPath = Join-Path $baselineRoot 'scoop.json'
                if (Test-Path -LiteralPath $baselineScoopPath) {
                  $baselineScoop = Get-Content -LiteralPath $baselineScoopPath -Raw | ConvertFrom-Json
                  foreach ($app in @($baselineScoop.apps)) { if ($app.Name) { [void]$baselineNames.Add([string]$app.Name) } }
                }
                $deltaApps = @($currentScoop.apps | Where-Object { $_.Name -and -not $baselineNames.Contains([string]$_.Name) })
                $scoopDeltaCount = $deltaApps.Count
                if ($scoopDeltaCount) {
                  [pscustomobject]@{ buckets=$currentScoop.buckets; apps=$deltaApps } | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $stateRoot 'scoop.json') -Encoding UTF8
                }
                Remove-Item -LiteralPath $currentScoopPath -Force -ErrorAction SilentlyContinue
              } catch { Write-Warning "scoop delta export skipped: $($_.Exception.Message)" }
            }

            # Track protected user credential/session stores by count only. Their encrypted
            # contents are already carried inside the VSS profile snapshot; values are never
            # printed or decoded here. Cross-runner DPAPI decryptability is deliberately not
            # assumed because machine-bound secrets are not portable in a generic backup.
            $protectedUserState = [System.Collections.Generic.List[object]]::new()
            foreach ($relative in @(
              'AppData\Roaming\Microsoft\Protect',
              'AppData\Roaming\Microsoft\Credentials',
              'AppData\Local\Microsoft\Credentials',
              'AppData\Local\Microsoft\Vault'
            )) {
              $source = Join-Path $profileRoot $relative
              if (-not (Test-Path -LiteralPath $source -PathType Container)) { continue }
              $measure = Get-ChildItem -LiteralPath $source -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum
              $bytes = if ($null -eq $measure.Sum) { [int64]0 } else { [int64]$measure.Sum }
              [void]$protectedUserState.Add([pscustomobject]@{ relative=$relative; file_count=[int64]$measure.Count; bytes=$bytes })
            }
            ConvertTo-Json -InputObject @($protectedUserState) -Depth 5 | Set-Content -LiteralPath (Join-Path $stateRoot 'protected-user-state.json') -Encoding UTF8

            $profileMeasure = Get-ChildItem -LiteralPath $backupProfile -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum
            $profileBytes = if ($null -eq $profileMeasure.Sum) { [int64]0 } else { [int64]$profileMeasure.Sum }
            $profileFiles = [int64]$profileMeasure.Count
            @{ file_count=$profileFiles; bytes=$profileBytes } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $backupRoot 'profile-manifest.json') -Encoding UTF8
            $stateMeasure = Get-ChildItem -LiteralPath $stateRoot -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum
            $stateBytes = if ($null -eq $stateMeasure.Sum) { [int64]0 } else { [int64]$stateMeasure.Sum }
            $softwareMeasure = Get-ChildItem -LiteralPath $backupSoftware -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum
            $softwareBytes = if ($null -eq $softwareMeasure.Sum) { [int64]0 } else { [int64]$softwareMeasure.Sum }
            $softwareFiles = [int64]$softwareMeasure.Count
            if (@($appPayloadEvidence).Count -gt 0 -and (@($softwareRoots).Count -eq 0 -or $softwareFiles -eq 0)) {
              throw "Strict app payload backup failed: evidence=$(@($appPayloadEvidence).Count) roots=$(@($softwareRoots).Count) files=$softwareFiles"
            }
            $backupBytes = $profileBytes + $stateBytes + $softwareBytes

            @{
              version = 11
              system_type = 'windows'
              machine_id = $env:MACHINE_ID
              desktop_username = $env:DESKTOP_USERNAME
              source_sid = $sid
              runner_image = $env:RUNNER_IMAGE
              run_id = [int64]$env:GITHUB_RUN_ID
              created_at = [DateTime]::UtcNow.ToString('o')
              scope = 'managed-windows-state-v11-installer-delta-services-drivers-pnp'
              profile_file_count = $profileFiles
              profile_bytes = $profileBytes
              state_bytes = $stateBytes
              software_file_count = $softwareFiles
              software_bytes = $softwareBytes
              software_root_count = @($softwareRoots).Count
              software_app_delta_count = @($appDelta).Count
              software_app_payload_evidence_count = @($appPayloadEvidence).Count
              software_service_delta_count = @($serviceDelta).Count
              uninstall_registry_count = @($uninstallRegistryManifest).Count
              app_registry_count = @($appRegistryManifest).Count
              driver_delta_count = @($driverManifest).Count
              driver_package_delta_count = @($driverPackageManifest).Count
              pnp_device_delta_count = @($pnpDeviceManifest).Count
              software_acl_count = @($softwareAclManifest).Count
              installer_registry_value_delta_count = @($installerValueDelta).Count
              installer_registry_tree_delta_count = @($installerTreeManifest).Count
              installer_cache_delta_count = @($installerCacheManifest).Count
              startup_approved_count = @($startupApproved).Count
              common_startup_count = @($commonStartupManifest).Count
              app_profile_evidence_count = @($appProfileEvidence).Count
              protected_user_state_count = @($protectedUserState).Count
              backup_bytes = $backupBytes
              registry_exports = $registryExports
              installed_app_count = @($apps).Count
              scheduled_task_count = @($taskManifest).Count
              auto_service_count = @($autoServices).Count
              machine_startup_count = @($startupEntries).Count
              winget_delta_count = $wingetDeltaCount
              choco_delta_count = $chocoDeltaCount
              scoop_delta_count = $scoopDeltaCount
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $backupRoot 'metadata.json') -Encoding UTF8
            $gib = [math]::Round($backupBytes / 1GB, 2)
            $softwareGib = [math]::Round($softwareBytes / 1GB, 2)
            Write-Host "MANAGED_WINDOWS_BACKUP_V11_STAGED profileFiles=$profileFiles softwareFiles=$softwareFiles bytes=$backupBytes gib=$gib softwareGib=$softwareGib apps=$(@($apps).Count) appDelta=$(@($appDelta).Count) appPayloadEvidence=$(@($appPayloadEvidence).Count) appProfileEvidence=$(@($appProfileEvidence).Count) protectedUserState=$(@($protectedUserState).Count) softwareRoots=$(@($softwareRoots).Count) softwareAcl=$(@($softwareAclManifest).Count) appRegistry=$(@($appRegistryManifest).Count) uninstallRegistry=$(@($uninstallRegistryManifest).Count) installerValues=$(@($installerValueDelta).Count) installerTrees=$(@($installerTreeManifest).Count) installerCache=$(@($installerCacheManifest).Count) startup=$(@($startupEntries).Count) startupApproved=$(@($startupApproved).Count) commonStartup=$(@($commonStartupManifest).Count) tasks=$(@($taskManifest).Count) services=$(@($autoServices).Count) serviceDelta=$(@($serviceDelta).Count) drivers=$(@($driverManifest).Count) driverPackages=$(@($driverPackageManifest).Count) pnpDevices=$(@($pnpDeviceManifest).Count) wingetDelta=$wingetDeltaCount chocoDelta=$chocoDeltaCount scoopDelta=$scoopDeltaCount"
            Write-Host 'MANAGED_DESKTOP_BACKUP_STAGED'
          }

          $commandTitle = "Cloud Windows Command $env:MACHINE_ID"
          while ($true) {
            $issue = $null
            try {
              $raw = & gh api "/repos/$env:GITHUB_REPOSITORY/issues?state=open&per_page=100" 2>$null
              if ($LASTEXITCODE -eq 0 -and $raw) {
                $items = $raw | ConvertFrom-Json
                $issue = $items | Where-Object { -not $_.pull_request -and $_.title -eq $commandTitle } | Select-Object -First 1
              }
            } catch { }

            if ($null -ne $issue -and $issue.body) {
              $cmd = $null
              try {
                $cmd = $issue.body | ConvertFrom-Json
              } catch {
                Write-Warning "BACKUP_COMMAND_PARSE_SKIPPED issue=$($issue.number) error=$($_.Exception.Message)"
              }
              if (
                $null -ne $cmd -and
                $cmd.command -eq 'backup' -and
                [string]$cmd.system_type -eq 'windows' -and
                [string]$cmd.machine_id -eq $env:MACHINE_ID -and
                [string]$cmd.run_id -eq [string]$env:GITHUB_RUN_ID
              ) {
                Write-Host "BACKUP_REQUEST_RECEIVED issue=$($issue.number)"
                Set-Content -Path (Join-Path $env:RUNNER_TEMP 'managed-backup-issue-number.txt') -Value $issue.number -Encoding ASCII
                try {
                  Stage-ManagedBackup
                } catch {
                  Write-Error "BACKUP_STAGE_FAILED issue=$($issue.number) error=$($_.Exception.Message)"
                  throw
                }
                'should_save=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
                exit 0
              }
            }

            Hide-ManagedRunnerWindows
            [void](Ensure-ManagedRdpClipboard)
            Start-Sleep -Seconds 10
            if ((Get-Service TermService).Status -ne 'Running') { Start-Service TermService }
          }


      - name: Save Windows user backup to GitHub Actions Cache
        if: steps.session.outputs.should_save == 'true'
        uses: actions/cache/save@v5
        with:
          path: '${{ runner.temp }}\managed-desktop-backup'
          key: managed-desktop-windows-${{ inputs.machine_id }}-${{ github.run_id }}

      - name: Close consumed Windows backup command
        if: steps.session.outputs.should_save == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $issueFile = Join-Path $env:RUNNER_TEMP 'managed-backup-issue-number.txt'
          if (Test-Path $issueFile) {
            $issueNo = (Get-Content $issueFile -Raw).Trim()
            if ($issueNo -match '^\d+$') {
              & gh api --method PATCH "/repos/$env:GITHUB_REPOSITORY/issues/$issueNo" -f state=closed | Out-Null
            }
          }
          Write-Host 'MANAGED_DESKTOP_BACKUP_SAVED'
          Write-Host 'MANAGED_WINDOWS_BACKUP_SAVED'

      - name: Report Windows workflow failure to Cloudflare
        if: ${{ failure() }}
        env:
          BOOTSTRAP_TICKET: ${{ inputs.bootstrap_ticket }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "::add-mask::$env:BOOTSTRAP_TICKET"
          $webUrl = ([string]$env:WEB_URL).TrimEnd('/')
          if (-not $webUrl.StartsWith('https://')) { exit 0 }
          $ip = (& tailscale ip -4 2>$null | Select-Object -First 1)
          $ts = if ($ip) { "$($ip.Trim())`:3389" } else { '' }
          $payload = @{
            instanceKey = $env:INSTANCE_KEY
            repository = $env:GITHUB_REPOSITORY
            runId = [int64]$env:GITHUB_RUN_ID
            nodeName = "win-$env:MACHINE_ID"
            address = $ts
            tailscaleAddress = $ts
            tailscaleHostname = $env:TS_DNS_HOSTNAME
            cloudflareAddress = $env:CF_TUNNEL_HOSTNAME
            cloudflareHostname = $env:CF_TUNNEL_HOSTNAME
            tunnelMode = $env:TUNNEL_MODE
            status = 'failure'
          } | ConvertTo-Json -Compress
          try { Invoke-RestMethod -Method Post -Uri "$webUrl/api/runner/report" -Headers @{ 'X-Bootstrap-Ticket' = $env:BOOTSTRAP_TICKET } -ContentType 'application/json' -Body $payload | Out-Null } catch { Write-Warning $_.Exception.Message }

