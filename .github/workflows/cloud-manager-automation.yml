name: Cloud Manager Automation
run-name: ${{ inputs.action }} · ${{ inputs.instance_key }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: start / restore / backup / rotate / stop
        required: true
        type: choice
        options:
          - start
          - restore
          - backup
          - rotate
          - stop
      instance_key:
        description: Stable instance key
        required: true
        type: string
      operation_id:
        description: Idempotent control-plane operation ID
        required: false
        default: ''
        type: string
      source_run_id:
        description: Original managed Run ID for a rotate/restart operation
        required: false
        default: '0'
        type: string
      automatic:
        description: Whether Cloudflare scheduler owns retry-until-ready
        required: false
        default: 'false'
        type: string
      config_b64:
        description: Base64 JSON instance configuration
        required: true
        type: string
      bootstrap_ticket:
        description: Short-lived Cloudflare runner capability
        required: true
        type: string
      web_url:
        description: Cloudflare control-plane URL
        required: true
        type: string

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: cloud-manager-automation-${{ inputs.instance_key }}
  cancel-in-progress: false

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      ACTION: ${{ inputs.action }}
      INSTANCE_KEY: ${{ inputs.instance_key }}
      OPERATION_ID: ${{ inputs.operation_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      AUTOMATIC: ${{ inputs.automatic }}
      CONFIG_B64: ${{ inputs.config_b64 }}
      BOOTSTRAP_TICKET: ${{ inputs.bootstrap_ticket }}
      WEB_URL: ${{ inputs.web_url }}
    steps:
      - name: Run managed automation
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::add-mask::$BOOTSTRAP_TICKET"

          cfg="$RUNNER_TEMP/cloud-manager-config.json"
          printf '%s' "$CONFIG_B64" | base64 --decode > "$cfg"

          SYSTEM="$(jq -r '.system_type // "android"' "$cfg" | tr '[:upper:]' '[:lower:]')"
          ID="$(jq -r '.phone_id // empty' "$cfg")"
          NAME="$(jq -r '.phone_name // empty' "$cfg")"
          BRANCH="$(jq -r '.branch // "main"' "$cfg")"
          CONFIG_REPO="$(jq -r '.repo // empty' "$cfg")"
          RUNNER_IMAGE="$(jq -r '.runner_image // empty' "$cfg")"
          DESKTOP_USERNAME="$(jq -r '.desktop_username // "admin"' "$cfg")"
          PACKAGE_NAME="$(jq -r '.package_name // "com.temperaturecoin"' "$cfg")"
          APK_URL="$(jq -r '.apk_url // empty' "$cfg")"
          NEW_APPS_B64="$(jq -c '.new_phone_apk_urls // []' "$cfg" | base64 -w0)"
          API_LEVEL="$(jq -r '.api_level // "35"' "$cfg")"
          TARGET="$(jq -r '.target // "google_apis"' "$cfg")"
          ARCH="$(jq -r '.arch // "x86_64"' "$cfg")"
          PROFILE="$(jq -r '.profile // "pixel_6"' "$cfg")"
          CORES="$(jq -r '.cores // "4"' "$cfg")"
          RAM_MB="$(jq -r '.ram_mb // "8192"' "$cfg")"
          MANUFACTURER="$(jq -r '.device_manufacturer // empty' "$cfg")"
          BRAND="$(jq -r '.device_brand // empty' "$cfg")"
          MODEL="$(jq -r '.device_model // empty' "$cfg")"
          USE_S5="$(jq -r 'if .use_s5 then "true" else "false" end' "$cfg")"

          REPO="$GITHUB_REPOSITORY"
          WEB_URL="${WEB_URL%/}"
          OPERATION_ID="${OPERATION_ID:-op-${GITHUB_RUN_ID}}"
          SOURCE_RUN_ID="${SOURCE_RUN_ID:-0}"
          AUTOMATIC="$(printf '%s' "${AUTOMATIC:-false}" | tr '[:upper:]' '[:lower:]')"
          CONFIG_REPO_LC="$(printf '%s' "$CONFIG_REPO" | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$ID" || ! "$ID" =~ ^[0-9]+$ ]]; then
            echo "::error::invalid instance id: $ID"
            exit 1
          fi
          if [[ -n "$CONFIG_REPO" && "$CONFIG_REPO_LC" != "$REPO_LC" ]]; then
            echo "::error::automation repository mismatch: config=$CONFIG_REPO current=$REPO"
            exit 1
          fi
          if [[ "$BRANCH" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::automation branch mismatch: config=$BRANCH control=$GITHUB_REF_NAME"
            exit 1
          fi
          if [[ "$INSTANCE_KEY" != "instance:$SYSTEM:$ID" ]]; then
            echo "::error::instance key mismatch: $INSTANCE_KEY != instance:$SYSTEM:$ID"
            exit 1
          fi

          case "$SYSTEM" in
            windows)
              WORKFLOW="cloud-windows-managed.yml"
              CACHE_PREFIX="managed-desktop-windows-$ID-"
              COMMAND_TITLE="Cloud Windows Command $ID"
              [[ -n "$RUNNER_IMAGE" ]] || RUNNER_IMAGE="windows-2025"
              [[ -n "$DESKTOP_USERNAME" ]] || DESKTOP_USERNAME="admin"
              ;;
            ubuntu)
              WORKFLOW="cloud-ubuntu-managed.yml"
              CACHE_PREFIX="managed-desktop-ubuntu-$ID-"
              COMMAND_TITLE="Cloud Ubuntu Command $ID"
              [[ -n "$RUNNER_IMAGE" ]] || RUNNER_IMAGE="ubuntu-24.04"
              [[ -n "$DESKTOP_USERNAME" ]] || DESKTOP_USERNAME="clouduser"
              ;;
            android)
              WORKFLOW="cloud-phone-managed.yml"
              CACHE_PREFIX="managed-avd-$ID-"
              COMMAND_TITLE="Cloud Phone Command $ID"
              ;;
            *)
              echo "::error::unsupported system_type: $SYSTEM"
              exit 1
              ;;
          esac

          cf_post() {
            local path="$1"
            local body="$2"
            curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 \
              -H "X-Bootstrap-Ticket: $BOOTSTRAP_TICKET" \
              -H 'content-type: application/json' \
              --data "$body" \
              "$WEB_URL$path"
          }

          cf_status() {
            local body
            body="$(jq -cn \
              --arg key "$INSTANCE_KEY" \
              --arg repo "$REPO" \
              --arg op "$OPERATION_ID" \
              '{instanceKey:$key,repository:$repo,operationId:$op}')"
            cf_post "/api/automation/status" "$body"
          }

          report_cf() {
            local status="$1"
            local message="${2:-}"
            local ready_run_id="${3:-0}"
            local body
            body="$(jq -cn \
              --arg key "$INSTANCE_KEY" \
              --arg repo "$REPO" \
              --arg op "$OPERATION_ID" \
              --arg status "$status" \
              --arg message "$message" \
              --argjson source "${SOURCE_RUN_ID:-0}" \
              --argjson ready "$ready_run_id" \
              '{instanceKey:$key,repository:$repo,operationId:$op,status:$status,message:$message,sourceRunId:$source,readyRunId:$ready}')"
            cf_post "/api/automation/report" "$body" >/dev/null
          }

          unexpected_error() {
            local rc=$?
            trap - ERR
            if [[ "$AUTOMATIC" == "true" && "$ACTION" == "rotate" ]]; then
              report_cf failed "unexpected control failure rc=$rc line=${BASH_LINENO[0]:-0}" 0 || true
            fi
            exit "$rc"
          }
          trap unexpected_error ERR

          latest_instance_run() {
            gh api "repos/$REPO/actions/workflows/$WORKFLOW/runs?branch=$BRANCH&event=workflow_dispatch&per_page=100" \
              --jq ".workflow_runs[] | select((.display_title // .name // \"\") | contains(\"· $ID /\")) | [.id,.status,(.conclusion // \"\"),(.created_at // \"\")] | @tsv" \
              | head -n 1 || true
          }

          run_status() {
            local run_id="$1"
            gh api "repos/$REPO/actions/runs/$run_id" --jq '[.status,(.conclusion // "")] | @tsv' 2>/dev/null || true
          }

          cache_for_run() {
            local run_id="$1"
            gh api "repos/$REPO/actions/caches?per_page=100&sort=created_at&direction=desc" \
              --jq ".actions_caches[] | select((.key | startswith(\"$CACHE_PREFIX\")) and ((.key == \"$CACHE_PREFIX$run_id\") or (.key | endswith(\"-$run_id\")))) | .key" \
              | head -n 1 || true
          }

          latest_cache() {
            gh api "repos/$REPO/actions/caches?per_page=100&sort=created_at&direction=desc" \
              --jq ".actions_caches[] | select(.key | startswith(\"$CACHE_PREFIX\")) | .key" \
              | head -n 1 || true
          }

          request_backup() {
            local run_id="$1"
            local body issue_no
            if [[ "$SYSTEM" == "android" ]]; then
              body="$(jq -cn --arg id "$ID" --argjson run "$run_id" --arg requested "$(date -u +%FT%TZ)" \
                '{version:1,command:"backup",phone_id:$id,run_id:$run,requested_at:$requested}')"
            else
              body="$(jq -cn --arg system "$SYSTEM" --arg id "$ID" --argjson run "$run_id" --arg requested "$(date -u +%FT%TZ)" \
                '{version:1,command:"backup",system_type:$system,machine_id:$id,run_id:$run,requested_at:$requested}')"
            fi
            issue_no="$(gh api "repos/$REPO/issues?state=open&per_page=100" \
              --jq ".[] | select(.pull_request|not) | select(.title == \"$COMMAND_TITLE\") | .number" | head -n 1 || true)"
            if [[ -n "$issue_no" ]]; then
              gh api --method PATCH "repos/$REPO/issues/$issue_no" -f body="$body" -f state=open >/dev/null
            else
              issue_no="$(gh api --method POST "repos/$REPO/issues" -f title="$COMMAND_TITLE" -f body="$body" --jq '.number')"
            fi
            echo "$issue_no"
          }

          wait_backup_complete() {
            local run_id="$1"
            local cache="" status="" conclusion=""
            for attempt in $(seq 1 160); do
              cache="$(cache_for_run "$run_id")"
              read -r status conclusion < <(run_status "$run_id")
              if [[ -n "$cache" && "$status" == "completed" && "$conclusion" == "success" ]]; then
                echo "$cache"
                return 0
              fi
              if [[ "$status" == "completed" && -n "$conclusion" && "$conclusion" != "success" ]]; then
                if [[ -n "$cache" ]]; then
                  echo "::warning::source run ended $conclusion but backup cache exists: $cache" >&2
                  echo "$cache"
                  return 0
                fi
                echo "::error::backup run $run_id ended as $conclusion without a cache" >&2
                return 1
              fi
              sleep 15
            done
            echo "::error::backup timeout for run $run_id" >&2
            return 1
          }

          prune_managed_history() {
            mapfile -t completed < <(
              gh api "repos/$REPO/actions/workflows/$WORKFLOW/runs?branch=$BRANCH&event=workflow_dispatch&per_page=100" \
                --jq ".workflow_runs[] | select((.display_title // .name // \"\") | contains(\"· $ID /\")) | select(.status == \"completed\") | .id"
            )
            if (( ${#completed[@]} > 3 )); then
              for victim in "${completed[@]:3}"; do
                [[ -n "$victim" ]] || continue
                echo "Deleting old managed Run $victim; keeping latest three completed"
                gh api --method DELETE "repos/$REPO/actions/runs/$victim" >/dev/null || true
              done
            fi
          }

          prune_control_history() {
            mapfile -t completed_control < <(
              gh api "repos/$REPO/actions/workflows/cloud-manager-automation.yml/runs?branch=$BRANCH&event=workflow_dispatch&per_page=100" \
                --jq ".workflow_runs[] | select((.display_title // .name // \"\") | contains(\"$INSTANCE_KEY\")) | select(.status == \"completed\") | .id"
            )
            # Current control Run is active; keep two completed now so current
            # becomes the third retained Run when it finishes.
            if (( ${#completed_control[@]} > 2 )); then
              for victim in "${completed_control[@]:2}"; do
                [[ -n "$victim" ]] || continue
                echo "Deleting old control Run $victim; current Run will become third retained"
                gh api --method DELETE "repos/$REPO/actions/runs/$victim" >/dev/null || true
              done
            fi
          }

          dispatch_managed() {
            local mode="$1"
            local payload
            if [[ "$SYSTEM" == "windows" || "$SYSTEM" == "ubuntu" ]]; then
              payload="$(jq -cn \
                --arg ref "$BRANCH" --arg mode "$mode" --arg id "$ID" --arg name "$NAME" \
                --arg image "$RUNNER_IMAGE" --arg user "$DESKTOP_USERNAME" \
                --arg ticket "$BOOTSTRAP_TICKET" --arg web "$WEB_URL" \
                '{ref:$ref,inputs:{mode:$mode,machine_id:$id,machine_name:$name,runner_image:$image,desktop_username:$user,bootstrap_ticket:$ticket,web_url:$web}}')"
            else
              payload="$(jq -cn \
                --arg ref "$BRANCH" --arg mode "$mode" --arg id "$ID" --arg name "$NAME" \
                --arg ticket "$BOOTSTRAP_TICKET" --arg web "$WEB_URL" --arg package "$PACKAGE_NAME" \
                --arg apk "$APK_URL" --arg apps "$NEW_APPS_B64" --arg api "$API_LEVEL" \
                --arg target "$TARGET" --arg arch "$ARCH" --arg profile "$PROFILE" \
                --arg cores "$CORES" --arg ram "$RAM_MB" --arg manufacturer "$MANUFACTURER" \
                --arg brand "$BRAND" --arg model "$MODEL" --arg s5 "$USE_S5" \
                '{ref:$ref,inputs:{mode:$mode,phone_id:$id,phone_name:$name,bootstrap_ticket:$ticket,web_url:$web,package_name:$package,apk_url:$apk,new_phone_apk_urls_b64:$apps,api_level:$api,target:$target,arch:$arch,profile:$profile,cores:$cores,ram_mb:$ram,device_manufacturer:$manufacturer,device_brand:$brand,device_model:$model,use_s5:$s5}}')"
            fi
            printf '%s' "$payload" | gh api --method POST "repos/$REPO/actions/workflows/$WORKFLOW/dispatches" --input - >/dev/null
          }

          wait_new_run() {
            local previous_id="$1"
            local line="" new_id=""
            for attempt in $(seq 1 40); do
              line="$(latest_instance_run)"
              new_id="$(cut -f1 <<<"$line")"
              if [[ -n "$new_id" && "$new_id" != "$previous_id" ]]; then
                echo "$line"
                return 0
              fi
              sleep 2
            done
            echo "::error::new managed run was not created" >&2
            return 1
          }

          wait_ready() {
            local run_id="$1"
            local status_json="" service_status="" service_run_id=0 intent_status="" ready_id=0
            local run_state="" conclusion=""
            for attempt in $(seq 1 120); do
              status_json="$(cf_status 2>/dev/null || true)"
              if [[ -n "$status_json" ]]; then
                service_status="$(jq -r '.serviceStatus // ""' <<<"$status_json")"
                service_run_id="$(jq -r '.serviceRunId // 0' <<<"$status_json")"
                intent_status="$(jq -r '.intentStatus // ""' <<<"$status_json")"
                if [[ "$AUTOMATIC" == "true" && "$ACTION" == "rotate" && "$intent_status" == "complete" ]]; then
                  ready_id="$(jq -r '.intentReadyRunId // .serviceRunId // 0' <<<"$status_json")"
                  [[ "$ready_id" != "0" ]] && { echo "$ready_id"; return 0; }
                fi
                if [[ "$service_run_id" == "$run_id" && "$service_status" == "ready" ]]; then
                  echo "$run_id"
                  return 0
                fi
                if [[ "$service_run_id" == "$run_id" && "$service_status" == "failed" ]]; then
                  echo "::error::managed run $run_id reported failed to Cloudflare" >&2
                  return 1
                fi
              fi

              read -r run_state conclusion < <(run_status "$run_id")
              if [[ "$run_state" == "completed" ]]; then
                if [[ "$conclusion" == "success" ]]; then
                  echo "::error::managed run $run_id completed before reporting ready" >&2
                else
                  echo "::error::managed run $run_id ended as ${conclusion:-unknown}" >&2
                fi
                return 1
              fi
              sleep 15
            done
            echo "::error::managed run $run_id did not become ready within 30 minutes" >&2
            return 1
          }

          cancel_run_if_active() {
            local run_id="$1"
            local st="" conclusion=""
            read -r st conclusion < <(run_status "$run_id")
            if [[ "$st" == "queued" || "$st" == "in_progress" ]]; then
              gh api --method POST "repos/$REPO/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
            fi
          }

          ensure_ready() {
            local mode="$1"
            local candidate="" candidate_id="" candidate_status=""
            local before_id="" new_line="" new_id=""
            local delay=20
            local status_json="" ready_id=0

            for attempt in 1 2 3; do
              if [[ "$AUTOMATIC" == "true" && "$ACTION" == "rotate" ]]; then
                status_json="$(cf_status 2>/dev/null || true)"
                if [[ -n "$status_json" && "$(jq -r '.intentStatus // ""' <<<"$status_json")" == "complete" ]]; then
                  ready_id="$(jq -r '.intentReadyRunId // .serviceRunId // 0' <<<"$status_json")"
                  echo "Operation already completed by managed Run $ready_id" >&2
                  echo "$ready_id"
                  return 0
                fi
              fi

              candidate="$(latest_instance_run)"
              candidate_id="$(cut -f1 <<<"$candidate")"
              candidate_status="$(cut -f2 <<<"$candidate")"

              if [[ -n "$candidate_id" && "$candidate_id" != "0" && "$candidate_id" != "$SOURCE_RUN_ID"                     && ( "$candidate_status" == "queued" || "$candidate_status" == "in_progress" ) ]]; then
                echo "Adopting existing replacement candidate Run $candidate_id" >&2
                if wait_ready "$candidate_id"; then
                  echo "$candidate_id"
                  return 0
                fi
                cancel_run_if_active "$candidate_id"
              fi

              before_id="$candidate_id"
              echo "Dispatching $SYSTEM managed mode=$mode attempt=$attempt/3" >&2
              dispatch_managed "$mode"
              new_line="$(wait_new_run "$before_id")"
              new_id="$(cut -f1 <<<"$new_line")"
              if [[ -z "$new_id" || "$new_id" == "0" ]]; then
                echo "::warning::dispatch did not yield a managed Run" >&2
              elif wait_ready "$new_id"; then
                echo "$new_id"
                return 0
              else
                cancel_run_if_active "$new_id"
              fi

              if (( attempt < 3 )); then
                echo "Managed replacement attempt $attempt failed; retrying after ${delay}s" >&2
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done
            return 1
          }

          prune_control_history
          echo "Automation action=$ACTION instance=$INSTANCE_KEY operation=$OPERATION_ID source=$SOURCE_RUN_ID system=$SYSTEM"

          if [[ "$AUTOMATIC" == "true" && "$ACTION" == "rotate" ]]; then
            early_status="$(cf_status 2>/dev/null || true)"
            if [[ -n "$early_status" && "$(jq -r '.intentStatus // ""' <<<"$early_status")" == "complete" ]]; then
              echo "Operation $OPERATION_ID is already complete; exiting idempotently"
              exit 0
            fi
            report_cf running "GitHub control run $GITHUB_RUN_ID started" 0 || true
          fi

          current="$(latest_instance_run)"
          current_id="$(cut -f1 <<<"$current")"
          current_status="$(cut -f2 <<<"$current")"

          case "$ACTION" in
            start)
              ready_run="$(ensure_ready new)" || {
                echo "::error::start failed after all managed retries"
                exit 1
              }
              echo "START_READY_RUN=$ready_run"
              ;;
            restore)
              backup="$(latest_cache)"
              [[ -n "$backup" ]] || { echo "::error::no restorable backup exists"; exit 1; }
              ready_run="$(ensure_ready restore)" || {
                echo "::error::restore failed after all managed retries"
                exit 1
              }
              echo "RESTORE_READY_RUN=$ready_run"
              ;;
            backup)
              [[ "$current_status" == "in_progress" ]] || { echo "::error::no active Runner to back up"; exit 1; }
              issue="$(request_backup "$current_id")"
              echo "Backup requested via issue #$issue for Run $current_id"
              cache="$(wait_backup_complete "$current_id")"
              echo "Backup saved: $cache"
              prune_managed_history
              ;;
            rotate)
              source_id="$SOURCE_RUN_ID"
              if [[ -z "$source_id" || "$source_id" == "0" ]]; then
                source_id="$current_id"
                SOURCE_RUN_ID="$source_id"
                if [[ "$AUTOMATIC" == "true" && "$source_id" != "0" ]]; then
                  report_cf running "source Run locked to $source_id" 0 || true
                fi
              fi

              source_cache=""
              if [[ -n "$source_id" && "$source_id" != "0" ]]; then
                source_cache="$(cache_for_run "$source_id")"
                read -r source_status source_conclusion < <(run_status "$source_id")
                if [[ "$source_status" == "in_progress" || "$source_status" == "queued" ]]; then
                  issue="$(request_backup "$source_id")"
                  echo "Rotation backup requested via issue #$issue for source Run $source_id"
                  source_cache="$(wait_backup_complete "$source_id")"
                  echo "Rotation source backup saved: $source_cache"
                elif [[ -n "$source_cache" ]]; then
                  echo "Source Run $source_id already has backup cache: $source_cache"
                else
                  echo "::warning::source Run $source_id is not active and has no fresh cache; using latest available backup if present"
                fi
              fi

              backup="$(latest_cache)"
              mode="new"
              [[ -n "$backup" ]] && mode="restore"
              echo "Replacement mode=$mode backup=${backup:-none}"

              ready_run="$(ensure_ready "$mode")" || {
                message="rotation replacement failed after all managed retries"
                if [[ "$AUTOMATIC" == "true" ]]; then
                  report_cf failed "$message" 0 || true
                fi
                echo "::error::$message"
                exit 1
              }

              echo "ROTATION_READY_RUN=$ready_run"
              prune_managed_history
              if [[ "$AUTOMATIC" == "true" ]]; then
                report_cf complete "replacement ready" "$ready_run" || true
              fi
              ;;
            stop)
              if [[ "$current_status" == "queued" || "$current_status" == "in_progress" ]]; then
                stopped=false
                for cancel_attempt in 1 2 3; do
                  gh api --method POST "repos/$REPO/actions/runs/$current_id/cancel" >/dev/null 2>&1 || true
                  for _ in $(seq 1 20); do
                    read -r st conclusion < <(run_status "$current_id")
                    if [[ "$st" == "completed" ]]; then stopped=true; break; fi
                    sleep 3
                  done
                  [[ "$stopped" == "true" ]] && break
                  sleep 5
                done
                [[ "$stopped" == "true" ]] || { echo "::error::Run $current_id did not stop"; exit 1; }
                echo "Stopped Run $current_id conclusion=$conclusion"
              else
                echo "No active Run to stop"
              fi
              ;;
            *)
              echo "::error::unsupported action: $ACTION"
              exit 1
              ;;
          esac

          prune_managed_history
          echo "AUTOMATION_COMPLETE action=$ACTION operation=$OPERATION_ID"
