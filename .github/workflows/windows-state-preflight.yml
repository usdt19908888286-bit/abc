name: Windows Managed State Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-state:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2022
          - windows-2025
    steps:
      - name: Checkout shared restore primitives
        uses: actions/checkout@v4

      - name: Preflight shared Windows restore primitives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modulePath = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\windows-managed-state.ps1'
          . $modulePath

          $owned = 'HKEY_LOCAL_MACHINE\SOFTWARE\Classes\CLSID\{00021401-0000-0000-C000-000000000046}\Elevation'
          $ordinary = 'HKEY_LOCAL_MACHINE\SOFTWARE\Classes\Example.Product\Settings'
          if (-not (Test-ManagedWindowsOwnedRegistryPath -RegistryPath $owned)) { throw 'Windows-owned Elevation path was not detected' }
          if (Test-ManagedWindowsOwnedRegistryPath -RegistryPath $ordinary) { throw 'Ordinary application registry path was incorrectly classified as Windows-owned' }
          Write-Host 'PREFLIGHT_PROTECTED_REGISTRY_OK'

          $quoted = '"C:\Windows\System32\cmd.exe" /c exit 0'
          $unquoted = 'C:\Windows\System32\cmd.exe /c exit 0'
          $changedArgs = 'C:\Windows\System32\cmd.exe /c exit 1'
          if (-not (Test-ManagedStartupCommandEquivalent -Expected $quoted -Actual $unquoted)) { throw 'Startup semantic equivalent command was rejected' }
          if (Test-ManagedStartupCommandEquivalent -Expected $quoted -Actual $changedArgs) { throw 'Startup semantic comparison accepted changed arguments' }
          Write-Host 'PREFLIGHT_STARTUP_SEMANTICS_OK'

          $runPath = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
          $runName = "OmniMCP-Preflight-$env:GITHUB_RUN_ID"
          $manifestPath = Join-Path $env:RUNNER_TEMP 'managed-startup-preflight.json'
          $runValue = '"C:\Windows\System32\cmd.exe" /c exit 0'
          $manifest = @([pscustomobject]@{ path=$runPath; name=$runName; value=$runValue; kind='String' })
          ConvertTo-Json -InputObject $manifest -Depth 4 | Set-Content -LiteralPath $manifestPath -Encoding UTF8

          $deleter = $null
          try {
            Remove-ItemProperty -Path $runPath -Name $runName -Force -ErrorAction SilentlyContinue
            # Simulate an installer/service asynchronously normalizing away its Run entry
            # while restore is stabilizing. The shared helper must repair the mutation.
            $deleter = Start-Job -ArgumentList $runPath,$runName -ScriptBlock {
              param($Path,$Name)
              Start-Sleep -Milliseconds 1800
              Remove-ItemProperty -Path $Path -Name $Name -Force -ErrorAction SilentlyContinue
            }
            $restored = Restore-ManagedStartupEntries -ManifestPath $manifestPath -Phase 'preflight-stable' -ReconcilePasses 5 -PassDelayMilliseconds 1000
            if ($restored -ne 1) { throw "Unexpected startup restore count: $restored" }
            Wait-Job -Job $deleter | Out-Null
            Receive-Job -Job $deleter -ErrorAction Stop | Out-Null
            Start-Sleep -Milliseconds 500
            $actual = [string](Get-Item -LiteralPath $runPath).GetValue($runName,$null,[Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            if ($actual -ne $runValue) { throw "Startup stabilization did not survive async deletion expected=[$runValue] actual=[$actual]" }
            Write-Host 'PREFLIGHT_STARTUP_STABILIZATION_OK'
          } finally {
            if ($null -ne $deleter) { Remove-Job -Job $deleter -Force -ErrorAction SilentlyContinue }
            Remove-ItemProperty -Path $runPath -Name $runName -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $manifestPath -Force -ErrorAction SilentlyContinue
          }

          $sourceTask = "OmniMCP-Preflight-Source-$env:GITHUB_RUN_ID"
          $restoredTask = "OmniMCP-Preflight-Restored-$env:GITHUB_RUN_ID"
          try {
            & schtasks.exe /Create /TN $sourceTask /TR 'cmd.exe /c exit 0' /SC ONLOGON /RU SYSTEM /F | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "schtasks source creation failed exit=$LASTEXITCODE" }
            $taskXml = Export-ScheduledTask -TaskName $sourceTask -ErrorAction Stop
            & schtasks.exe /Delete /TN $sourceTask /F | Out-Null
            $sourceTask = ''

            Register-ManagedScheduledTaskXml -TaskName $restoredTask -TaskPath '\' -Xml $taskXml | Out-Null
            $task = Get-ScheduledTask -TaskName $restoredTask -TaskPath '\' -ErrorAction Stop
            if ($null -eq $task) { throw 'Restored SYSTEM task is missing' }
            $principal = ([string]$task.Principal.UserId).Trim()
            if ($principal -notin @('SYSTEM','S-1-5-18','NT AUTHORITY\SYSTEM')) { throw "Unexpected restored SYSTEM task principal: $principal" }
            Write-Host "PREFLIGHT_SCHEDULED_TASK_OK principal=$principal"
          } finally {
            if ($sourceTask) { & schtasks.exe /Delete /TN $sourceTask /F 2>$null | Out-Null }
            & schtasks.exe /Delete /TN $restoredTask /F 2>$null | Out-Null
          }

          Write-Host "WINDOWS_MANAGED_STATE_PREFLIGHT_OK runner=$env:ImageOS image=$env:ImageVersion"
