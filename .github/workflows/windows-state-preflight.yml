name: Windows Managed State Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-state:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2022
          - windows-2025
    steps:
      - name: Checkout shared restore primitives
        uses: actions/checkout@v4

      - name: Preflight shared Windows restore primitives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modulePath = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\windows-managed-state.ps1'
          . $modulePath

          $owned = 'HKEY_LOCAL_MACHINE\SOFTWARE\Classes\CLSID\{00021401-0000-0000-C000-000000000046}\Elevation'
          $ordinary = 'HKEY_LOCAL_MACHINE\SOFTWARE\Classes\Example.Product\Settings'
          if (-not (Test-ManagedWindowsOwnedRegistryPath -RegistryPath $owned)) { throw 'Windows-owned Elevation path was not detected' }
          if (Test-ManagedWindowsOwnedRegistryPath -RegistryPath $ordinary) { throw 'Ordinary application registry path was incorrectly classified as Windows-owned' }
          Write-Host 'PREFLIGHT_PROTECTED_REGISTRY_OK'


          $volatileAclMissing = 'C:\ProgramData\Netease\GameViewer\cache_setting.ini: The system cannot find the file specified.'
          $volatileAclDirectory = 'C:\ProgramData\Example\cache\session.db: The system cannot find the file specified.'
          $durableAclMissing = 'C:\ProgramData\Netease\GameViewer\config.ini: The system cannot find the file specified.'
          if (-not (Test-ManagedVolatileAclMissingLine -Line $volatileAclMissing)) { throw 'cache_setting.ini was not classified as volatile ACL state' }
          if (-not (Test-ManagedVolatileAclMissingLine -Line $volatileAclDirectory)) { throw 'cache directory payload was not classified as volatile ACL state' }
          if (Test-ManagedVolatileAclMissingLine -Line $durableAclMissing) { throw 'Durable config.ini was incorrectly classified as volatile ACL state' }
          Write-Host 'PREFLIGHT_VOLATILE_ACL_CLASSIFIER_OK'

          $quoted = '"C:\Windows\System32\cmd.exe" /c exit 0'
          $unquoted = 'C:\Windows\System32\cmd.exe /c exit 0'
          $changedArgs = 'C:\Windows\System32\cmd.exe /c exit 1'
          if (-not (Test-ManagedStartupCommandEquivalent -Expected $quoted -Actual $unquoted)) { throw 'Startup semantic equivalent command was rejected' }
          if (Test-ManagedStartupCommandEquivalent -Expected $quoted -Actual $changedArgs) { throw 'Startup semantic comparison accepted changed arguments' }
          Write-Host 'PREFLIGHT_STARTUP_SEMANTICS_OK'

          $serviceBacked = Get-ManagedStartupServiceBacking -StartupValue '"C:\Program Files\Example\Example.exe" -startup' -Services @(
            [pscustomobject]@{ name='ExampleSvc'; path='"C:\Program Files\Example\Example.exe" -service'; start=2 },
            [pscustomobject]@{ name='ManualSvc'; path='"C:\Program Files\Other\Other.exe"'; start=3 }
          )
          if ($null -eq $serviceBacked -or [string]$serviceBacked.name -ne 'ExampleSvc') { throw 'Automatic service-backed startup entry was not detected' }
          $notServiceBacked = Get-ManagedStartupServiceBacking -StartupValue '"C:\Program Files\Example\Tray.exe" -startup' -Services @(
            [pscustomobject]@{ name='ExampleSvc'; path='"C:\Program Files\Example\Example.exe" -service'; start=2 }
          )
          if ($null -ne $notServiceBacked) { throw 'Unrelated startup executable was incorrectly classified as service-backed' }
          Write-Host 'PREFLIGHT_STARTUP_SERVICE_BACKING_OK'

          $mockApp = [pscustomobject]@{
            registry_path='HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Everything'
            name='Everything 1.4.1.1024 (x64)'
            version='1.4.1.1024'
            install_location='C:\Program Files\Everything'
          }
          $mockPackages = @([pscustomobject]@{ manager='choco'; package_id='everything'; version='1.4.1.1024'; source='chocolatey'; display_name='' })
          $matchedPackage = Find-ManagedPackageForApplication -Application $mockApp -PackagePlan $mockPackages
          if ($null -eq $matchedPackage -or [string]$matchedPackage.package_id -ne 'everything') { throw 'Package-managed application was not matched to its reconstruction source' }
          $mockPlan = @([pscustomobject]@{
            registry_path=$mockApp.registry_path; app_name=$mockApp.name; app_version=$mockApp.version;
            strategy='rehydrate'; manager='choco'; package_id='everything'; package_version='1.4.1.1024'
          })
          if (-not (Test-ManagedApplicationUsesRehydration -Application $mockApp -ApplicationPlan $mockPlan)) { throw 'Rehydration application strategy was not detected' }
          if (-not (Test-ManagedPathUsesRehydration -Path 'C:\Program Files\Everything\Everything.exe' -ApplicationPlan $mockPlan)) { throw 'Rehydratable Program Files path was not detected' }
          if (Test-ManagedPathUsesRehydration -Path 'C:\Program Files\Unrelated\Other.exe' -ApplicationPlan $mockPlan) { throw 'Unrelated path was incorrectly classified as rehydratable' }
          $emptyState = Join-Path $env:RUNNER_TEMP "managed-rehydrate-empty-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $emptyState -Force | Out-Null
          try {
            $emptyResult = Invoke-ManagedSoftwareRehydrate -StateRoot $emptyState
            if ([int]$emptyResult.total -ne 0 -or [int]$emptyResult.restored -ne 0 -or [int]$emptyResult.failed -ne 0) { throw 'Empty reconstruction plan did not return a no-op result' }
            @([pscustomobject]@{ manager='unavailable-test-manager'; package_id='example'; version='1.0'; source='test' }) |
              ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $emptyState 'rehydration-plan.json') -Encoding UTF8
            $global:LASTEXITCODE = 7
            $fallbackResult = Invoke-ManagedSoftwareRehydrate -StateRoot $emptyState
            if ([int]$fallbackResult.total -ne 1 -or [int]$fallbackResult.failed -ne 1 -or -not [bool]$fallbackResult.fallback_required) {
              throw 'Unavailable package source did not degrade to software-capsule fallback'
            }
            if ($LASTEXITCODE -ne 0) { throw "Software-capsule fallback leaked native exit code: $LASTEXITCODE" }
          } finally {
            Remove-Item -LiteralPath $emptyState -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'PREFLIGHT_SOFTWARE_REHYDRATION_OK'

          $runPath = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
          $runName = "OmniMCP-Preflight-$env:GITHUB_RUN_ID"
          $manifestPath = Join-Path $env:RUNNER_TEMP 'managed-startup-preflight.json'
          $runValue = '"C:\Windows\System32\cmd.exe" /c exit 0'
          $manifest = @([pscustomobject]@{ path=$runPath; name=$runName; value=$runValue; kind='String' })
          ConvertTo-Json -InputObject $manifest -Depth 4 | Set-Content -LiteralPath $manifestPath -Encoding UTF8

          $deleter = $null
          try {
            Remove-ItemProperty -Path $runPath -Name $runName -Force -ErrorAction SilentlyContinue
            # Simulate an installer/service asynchronously normalizing away its Run entry
            # while restore is stabilizing. The shared helper must repair the mutation.
            $deleter = Start-Job -ArgumentList $runPath,$runName -ScriptBlock {
              param($Path,$Name)
              Start-Sleep -Milliseconds 1800
              try { Remove-ItemProperty -Path $Path -Name $Name -Force -ErrorAction Stop } catch { }
            }
            $restored = Restore-ManagedStartupEntries -ManifestPath $manifestPath -Phase 'preflight-stable' -ReconcilePasses 5 -PassDelayMilliseconds 1000
            if ($restored -ne 1) { throw "Unexpected startup restore count: $restored" }
            Wait-Job -Job $deleter | Out-Null
            Receive-Job -Job $deleter -ErrorAction Stop | Out-Null
            Start-Sleep -Milliseconds 500
            $actual = [string](Get-Item -LiteralPath $runPath).GetValue($runName,$null,[Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            if ($actual -ne $runValue) { throw "Startup stabilization did not survive async deletion expected=[$runValue] actual=[$actual]" }
            Write-Host 'PREFLIGHT_STARTUP_STABILIZATION_OK'
          } finally {
            if ($null -ne $deleter) { Remove-Job -Job $deleter -Force -ErrorAction SilentlyContinue }
            Remove-ItemProperty -Path $runPath -Name $runName -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $manifestPath -Force -ErrorAction SilentlyContinue
          }

          $sourceTask = "OmniMCP-Preflight-Source-$env:GITHUB_RUN_ID"
          $restoredTask = "OmniMCP-Preflight-Restored-$env:GITHUB_RUN_ID"
          try {
            & schtasks.exe /Create /TN $sourceTask /TR 'cmd.exe /c exit 0' /SC ONLOGON /RU SYSTEM /F | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "schtasks source creation failed exit=$LASTEXITCODE" }
            $taskXml = Export-ScheduledTask -TaskName $sourceTask -ErrorAction Stop
            & schtasks.exe /Delete /TN $sourceTask /F | Out-Null
            $sourceTask = ''

            Register-ManagedScheduledTaskXml -TaskName $restoredTask -TaskPath '\' -Xml $taskXml | Out-Null
            $task = Get-ScheduledTask -TaskName $restoredTask -TaskPath '\' -ErrorAction Stop
            if ($null -eq $task) { throw 'Restored SYSTEM task is missing' }
            $principal = ([string]$task.Principal.UserId).Trim()
            if ($principal -notin @('SYSTEM','S-1-5-18','NT AUTHORITY\SYSTEM')) { throw "Unexpected restored SYSTEM task principal: $principal" }
            Write-Host "PREFLIGHT_SCHEDULED_TASK_OK principal=$principal"
          } finally {
            if ($sourceTask) { & schtasks.exe /Delete /TN $sourceTask /F 2>$null | Out-Null }
            & schtasks.exe /Delete /TN $restoredTask /F 2>$null | Out-Null
          }

          Write-Host "WINDOWS_MANAGED_STATE_PREFLIGHT_OK runner=$env:ImageOS image=$env:ImageVersion"
