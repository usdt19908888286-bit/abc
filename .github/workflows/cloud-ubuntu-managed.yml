name: Managed Ubuntu Cloud PC
run-name: ${{ inputs.machine_name || 'Managed Ubuntu' }} · ${{ inputs.machine_id || '001' }} / ${{ inputs.runner_image || 'ubuntu-24.04' }} / ${{ inputs.mode || 'new' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Start fresh or restore the latest managed user-data backup
        required: true
        default: new
        type: choice
        options:
          - new
          - restore
      machine_id:
        description: Logical machine ID
        required: true
        default: '001'
        type: string
      machine_name:
        description: Friendly machine name
        required: false
        default: 'UBUNTU-001'
        type: string
      runner_image:
        description: Ubuntu GitHub-hosted runner image selected from the live actions/runner-images catalog
        required: true
        default: ubuntu-24.04
        type: string
      desktop_username:
        description: Ubuntu local account used for SSH
        required: true
        default: clouduser
        type: string
      bootstrap_ticket:
        description: Cloudflare bootstrap ticket
        required: true
        type: string
      web_url:
        description: Current Web URL
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: managed-ubuntu-${{ inputs.machine_id || '001' }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ${{ inputs.runner_image }}
    timeout-minutes: 360
    env:
      MACHINE_ID: ${{ inputs.machine_id || '001' }}
      MACHINE_NAME: ${{ inputs.machine_name || 'UBUNTU-001' }}
      DESKTOP_USERNAME: ${{ inputs.desktop_username || 'clouduser' }}
      RUNNER_IMAGE: ${{ inputs.runner_image }}
      MACHINE_MODE: ${{ inputs.mode || 'new' }}
      WEB_URL: ${{ inputs.web_url }}
    steps:
      - name: Bootstrap runtime from Cloudflare
        env:
          BOOTSTRAP_TICKET: ${{ inputs.bootstrap_ticket }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${BOOTSTRAP_TICKET}"
          INSTANCE_KEY="instance:ubuntu:${MACHINE_ID}"
          BODY=$(printf '{"instanceKey":"%s","repository":"%s","runId":%s}' "$INSTANCE_KEY" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          WEB_URL="${WEB_URL%/}"
          case "$WEB_URL" in https://*) ;; *) echo '::error::Cloudflare control URL is invalid'; exit 1 ;; esac
          curl -fsS --connect-timeout 10 --max-time 75 --retry 1 --retry-delay 2 -H "X-Bootstrap-Ticket: ${BOOTSTRAP_TICKET}" -H 'content-type: application/json' --data "$BODY" "${WEB_URL}/api/runner/bootstrap" -o /tmp/cloud-bootstrap.json
          TS_CLIENT_ID=$(jq -r '.tailscaleClientId // empty' /tmp/cloud-bootstrap.json)
          TS_CLIENT_SECRET=$(jq -r '.tailscaleClientSecret // empty' /tmp/cloud-bootstrap.json)
          CLOUD_PASSWORD=$(jq -r '.desktopPassword // empty' /tmp/cloud-bootstrap.json)
          TUNNEL_MODE=$(jq -r '.tunnelMode // "tailscale"' /tmp/cloud-bootstrap.json)
          TS_DNS_HOSTNAME=$(jq -r '.tailscaleHostname // empty' /tmp/cloud-bootstrap.json)
          CF_TUNNEL_HOSTNAME=$(jq -r '.cloudflareHostname // empty' /tmp/cloud-bootstrap.json)
          CF_TUNNEL_TOKEN=$(jq -r '.cloudflareTunnelToken // empty' /tmp/cloud-bootstrap.json)
          UBUNTU_SOCKS5_ENABLED=$(jq -r 'if .ubuntuSocks5Enabled then "true" else "false" end' /tmp/cloud-bootstrap.json)
          UBUNTU_SOCKS5_PORT=$(jq -r '.ubuntuSocks5Port // "1080"' /tmp/cloud-bootstrap.json)
          UBUNTU_SOCKS5_USERNAME=$(jq -r '.ubuntuSocks5Username // "cloudproxy"' /tmp/cloud-bootstrap.json)
          UBUNTU_SOCKS5_PASSWORD=$(jq -r '.ubuntuSocks5Password // empty' /tmp/cloud-bootstrap.json)
          UBUNTU_SOCKS5_HOSTNAME=$(jq -r '.ubuntuSocks5Hostname // empty' /tmp/cloud-bootstrap.json)
          FANOUT_ENABLED=$(jq -r 'if .fanoutEnabled then "true" else "false" end' /tmp/cloud-bootstrap.json)
          [ -n "$TS_CLIENT_ID" ] && [ -n "$TS_CLIENT_SECRET" ] || { echo '::error::Cloudflare Tailscale configuration is incomplete'; exit 1; }
          [ -n "$CLOUD_PASSWORD" ] || { echo '::error::Cloudflare desktop password is empty'; exit 1; }
          if [ "$TUNNEL_MODE" = 'cloudflare' ] || [ "$TUNNEL_MODE" = 'dual' ]; then
            [ -n "$CF_TUNNEL_HOSTNAME" ] && [ -n "$CF_TUNNEL_TOKEN" ] || { echo '::error::Cloudflare Tunnel bootstrap is incomplete'; exit 1; }
          fi
          if [ "$UBUNTU_SOCKS5_ENABLED" = 'true' ]; then
            [ -n "$UBUNTU_SOCKS5_PASSWORD" ] || { echo '::error::Ubuntu SOCKS5 password is empty'; exit 1; }
            [ -n "$UBUNTU_SOCKS5_HOSTNAME" ] && [ -n "$CF_TUNNEL_TOKEN" ] || { echo '::error::Ubuntu SOCKS5 Cloudflare bootstrap is incomplete'; exit 1; }
          fi
          for value in "$TS_CLIENT_ID" "$TS_CLIENT_SECRET" "$CLOUD_PASSWORD" "$CF_TUNNEL_TOKEN" "$UBUNTU_SOCKS5_PASSWORD"; do [ -z "$value" ] || echo "::add-mask::$value"; done
          printf 'TS_CLIENT_ID=%s\nTS_CLIENT_SECRET=%s\nCLOUD_PASSWORD=%s\nINSTANCE_KEY=%s\nTUNNEL_MODE=%s\nTS_DNS_HOSTNAME=%s\nCF_TUNNEL_HOSTNAME=%s\nCF_TUNNEL_TOKEN=%s\nUBUNTU_SOCKS5_ENABLED=%s\nUBUNTU_SOCKS5_PORT=%s\nUBUNTU_SOCKS5_USERNAME=%s\nUBUNTU_SOCKS5_PASSWORD=%s\nUBUNTU_SOCKS5_HOSTNAME=%s\nFANOUT_ENABLED=%s\n' \
            "$TS_CLIENT_ID" "$TS_CLIENT_SECRET" "$CLOUD_PASSWORD" "$INSTANCE_KEY" "$TUNNEL_MODE" "$TS_DNS_HOSTNAME" "$CF_TUNNEL_HOSTNAME" "$CF_TUNNEL_TOKEN" "$UBUNTU_SOCKS5_ENABLED" "$UBUNTU_SOCKS5_PORT" "$UBUNTU_SOCKS5_USERNAME" "$UBUNTU_SOCKS5_PASSWORD" "$UBUNTU_SOCKS5_HOSTNAME" "$FANOUT_ENABLED" >> "$GITHUB_ENV"
          rm -f /tmp/cloud-bootstrap.json
          echo 'CLOUDFLARE_BOOTSTRAP_OK'

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$MACHINE_ID" in ''|*[!0-9]*) echo '::error::machine_id must contain digits only'; exit 1 ;; esac
          [[ "$DESKTOP_USERNAME" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo '::error::desktop_username is invalid'; exit 1; }
          printf '%s\n' "$RUNNER_IMAGE" | grep -Eq '^ubuntu-[0-9]{2}\.[0-9]{2}$' || { echo "::error::Unsupported Ubuntu runner image label: $RUNNER_IMAGE"; exit 1; }
          case "$MACHINE_MODE" in new|restore) ;; *) echo "::error::Unsupported mode: $MACHINE_MODE"; exit 1 ;; esac
          [ -n "${CLOUD_PASSWORD:-}" ] || { echo '::error::Desktop password secret is empty'; exit 1; }
          if [ "${UBUNTU_SOCKS5_ENABLED:-false}" = 'true' ]; then
            [[ "${UBUNTU_SOCKS5_PORT:-}" =~ ^[0-9]+$ ]] && [ "$UBUNTU_SOCKS5_PORT" -ge 1 ] && [ "$UBUNTU_SOCKS5_PORT" -le 65535 ] || { echo '::error::Ubuntu SOCKS5 port must be 1-65535'; exit 1; }
            [[ "${UBUNTU_SOCKS5_USERNAME:-}" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo '::error::Ubuntu SOCKS5 username is invalid'; exit 1; }
            [ -n "${UBUNTU_SOCKS5_PASSWORD:-}" ] || { echo '::error::Ubuntu SOCKS5 password is empty'; exit 1; }
          fi

      - name: Prepare Tailscale hostname
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          # Network identity is independent from the display/business name.
          # The same machine ID always reuses the same Tailscale/MagicDNS hostname.
          ts_hostname="ubuntu-${MACHINE_ID}"
          echo "ts_hostname=${ts_hostname}" >> "$GITHUB_OUTPUT"
          echo "TAILSCALE_STABLE_HOSTNAME=${ts_hostname}"

      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_CLIENT_ID }}
          oauth-secret: ${{ env.TS_CLIENT_SECRET }}
          tags: tag:github-phone
          hostname: ${{ steps.identity.outputs.ts_hostname }}
          version: latest

      - name: Report Tailscale presence to Cloudflare
        env:
          BOOTSTRAP_TICKET: ${{ inputs.bootstrap_ticket }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${BOOTSTRAP_TICKET}"
          TS_IPV4=$(tailscale ip -4 | head -n1)
          [ -n "$TS_IPV4" ] || { echo '::error::No Tailscale IPv4 address was assigned'; exit 1; }
          WEB_URL="${WEB_URL%/}"
          case "$WEB_URL" in https://*) ;; *) echo '::error::Cloudflare Web URL is invalid'; exit 1 ;; esac
          BODY=$(jq -nc --arg key "$INSTANCE_KEY" --arg repo "$GITHUB_REPOSITORY" --argjson run "$GITHUB_RUN_ID" --arg node "ubuntu-${MACHINE_ID}" --arg ts "${TS_IPV4}:22" --arg tsHost "${TS_DNS_HOSTNAME:-}" --arg cf "${CF_TUNNEL_HOSTNAME:-}" --arg mode "${TUNNEL_MODE:-tailscale}" '{instanceKey:$key,repository:$repo,runId:$run,nodeName:$node,address:$ts,tailscaleAddress:$ts,tailscaleHostname:$tsHost,cloudflareAddress:$cf,cloudflareHostname:$cf,tunnelMode:$mode,status:"network_ready"}')
          curl -fsS --retry 3 -H "X-Bootstrap-Ticket: ${BOOTSTRAP_TICKET}" -H 'content-type: application/json' --data "$BODY" "${WEB_URL}/api/runner/report" -o /tmp/cloud-early-report.json
          echo "TAILSCALE_EARLY_REPORT_OK=${TS_IPV4}:22"

      - name: Restore latest Ubuntu user backup
        if: ${{ inputs.mode == 'restore' }}
        uses: actions/cache/restore@v5
        with:
          path: /tmp/managed-desktop-backup
          key: managed-desktop-ubuntu-${{ inputs.machine_id }}-${{ inputs.runner_image }}-restore-${{ github.run_id }}
          restore-keys: |
            managed-desktop-ubuntu-${{ inputs.machine_id }}-${{ inputs.runner_image }}-
            managed-desktop-ubuntu-${{ inputs.machine_id }}-

      - name: Validate Ubuntu backup compatibility
        if: ${{ inputs.mode == 'restore' }}
        shell: bash
        run: |
          set -euo pipefail
          metadata=/tmp/managed-desktop-backup/metadata.json
          [ -s "$metadata" ] || { echo '::error::Ubuntu backup metadata.json is missing'; exit 1; }
          backup_system=$(jq -r '.system_type // empty' "$metadata")
          backup_machine=$(jq -r '.machine_id // empty' "$metadata")
          backup_image=$(jq -r '.runner_image // empty' "$metadata")
          [ "$backup_system" = 'ubuntu' ] || { echo "::error::Backup system type is not Ubuntu: $backup_system"; exit 1; }
          [ "$backup_machine" = "$MACHINE_ID" ] || { echo "::error::Ubuntu backup machine ID mismatch: backup=$backup_machine current=$MACHINE_ID"; exit 1; }
          [ -n "$backup_image" ] || { echo '::error::Ubuntu backup does not record runner_image; cross-version safety cannot be verified'; exit 1; }
          [ "$backup_image" = "$RUNNER_IMAGE" ] || { echo "::error::Ubuntu backup version mismatch: backup=$backup_image current=$RUNNER_IMAGE"; exit 1; }
          echo "MANAGED_UBUNTU_BACKUP_COMPATIBILITY_OK image=$backup_image machine=$backup_machine"

      - name: Enable private SSH session and restore data
        shell: bash
        run: |
          set -euo pipefail

          MANAGED_UBUNTU_INFRA_UNITS=/tmp/managed-ubuntu-quiesce-infra-units.txt

          managed_init_quiesce_infra_units() {
            : >"$MANAGED_UBUNTU_INFRA_UNITS"
            local pid="$$" cgroup_line unit ppid
            # Preserve whichever systemd service actually owns this workflow process.
            # GitHub-hosted runners currently execute below hosted-compute-agent.service,
            # while self-hosted images may use a different service name. Walking the
            # live parent/cgroup chain makes this independent of that provider detail.
            while [[ "$pid" =~ ^[0-9]+$ ]] && [ "$pid" -gt 1 ] && [ -r "/proc/${pid}/cgroup" ]; do
              while IFS= read -r cgroup_line || [ -n "$cgroup_line" ]; do
                unit="${cgroup_line##*/}"
                case "$unit" in
                  *.service) printf '%s\n' "$unit" >>"$MANAGED_UBUNTU_INFRA_UNITS" ;;
                esac
              done <"/proc/${pid}/cgroup"
              ppid=$(awk '/^PPid:/ {print $2; exit}' "/proc/${pid}/status" 2>/dev/null || true)
              [ -n "$ppid" ] && [ "$ppid" != "$pid" ] || break
              pid="$ppid"
            done
            # Keep the workflow account's user manager. Application-user managers are
            # still stopped after loginctl terminate-user below.
            printf 'user@%s.service\n' "$(id -u)" >>"$MANAGED_UBUNTU_INFRA_UNITS"
            LC_ALL=C sort -u -o "$MANAGED_UBUNTU_INFRA_UNITS" "$MANAGED_UBUNTU_INFRA_UNITS"
            while IFS= read -r unit || [ -n "$unit" ]; do
              [ -n "$unit" ] && echo "MANAGED_UBUNTU_INFRA_UNIT_KEEP unit=$unit"
            done <"$MANAGED_UBUNTU_INFRA_UNITS"
          }

          managed_keep_quiesce_unit() {
            local unit="$1"
            if [ -s "$MANAGED_UBUNTU_INFRA_UNITS" ] && grep -Fxq -- "$unit" "$MANAGED_UBUNTU_INFRA_UNITS"; then
              return 0
            fi
            case "$unit" in
              ssh.service|ssh.socket|tailscaled.service|systemd-networkd.service|NetworkManager.service|systemd-resolved.service|networkd-dispatcher.service|systemd-journald.service|systemd-journald.socket|systemd-journald-dev-log.socket|systemd-udevd.service|systemd-udevd-control.socket|systemd-udevd-kernel.socket|systemd-logind.service|systemd-timesyncd.service|dbus.service|dbus.socket|polkit.service|waagent.service|walinuxagent.service|WALinuxAgent.service|actions.runner.*.service|github-actions-runner*.service)
                return 0
                ;;
            esac
            return 1
          }

          managed_init_quiesce_infra_units

          managed_capture_active_units() {
            local dir="$1"
            mkdir -p "$dir"
            (systemctl list-units --type=service --state=running --no-legend --no-pager 2>/dev/null || true) \
              | awk '{print $1}' | sed '/^[[:space:]]*$/d' | LC_ALL=C sort -u >"$dir/services.txt"
            for unit_type in socket timer path; do
              (systemctl list-units --type="$unit_type" --state=active --no-legend --no-pager 2>/dev/null || true) \
                | awk '{print $1}' | sed '/^[[:space:]]*$/d' | LC_ALL=C sort -u >"$dir/${unit_type}s.txt"
            done
          }

          managed_stop_unit_file() {
            local file="$1"
            [ -f "$file" ] || return 0
            while IFS= read -r unit || [ -n "$unit" ]; do
              [ -n "$unit" ] || continue
              managed_keep_quiesce_unit "$unit" && continue
              sudo systemctl stop "$unit" >/dev/null 2>&1 \
                || echo "::warning::Could not stop $unit while quiescing Ubuntu state"
            done <"$file"
          }

          managed_verify_unit_file_quiet() {
            local file="$1"
            local failed=0
            [ -f "$file" ] || return 0
            while IFS= read -r unit || [ -n "$unit" ]; do
              [ -n "$unit" ] || continue
              managed_keep_quiesce_unit "$unit" && continue
              if systemctl is-active --quiet "$unit" 2>/dev/null; then
                echo "::error::Ubuntu snapshot is not quiescent; unit is still active: $unit"
                failed=1
              fi
            done <"$file"
            return "$failed"
          }

          managed_quiesce_from_dir() {
            local dir="$1"
            local failed=0
            # Stop activators before services so timers/sockets/paths cannot race the snapshot.
            for kind in timers paths sockets services; do
              managed_stop_unit_file "$dir/${kind}.txt"
            done
            sync
            for kind in timers paths sockets services; do
              managed_verify_unit_file_quiet "$dir/${kind}.txt" || failed=1
            done
            [ "$failed" -eq 0 ] || exit 1
          }

          managed_start_unit_file() {
            local file="$1"
            [ -f "$file" ] || return 0
            while IFS= read -r unit || [ -n "$unit" ]; do
              [ -n "$unit" ] || continue
              managed_keep_quiesce_unit "$unit" && continue
              sudo systemctl start "$unit" >/dev/null 2>&1 \
                || { echo "::error::Failed to restore active Ubuntu unit $unit"; exit 1; }
              systemctl is-active --quiet "$unit" 2>/dev/null \
                || { echo "::error::Restored Ubuntu unit is not active: $unit"; exit 1; }
            done <"$file"
          }

          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server rsync jq dpkg-repack acl

          # V3/V4 use a clean-runner baseline. Installer/package state is replayed by
          # package managers where possible; non-package filesystem changes are
          # captured separately and restored only after package replay.
          apt-mark showmanual | LC_ALL=C sort -u >/tmp/managed-ubuntu-baseline-manual.txt
          dpkg-query -W -f='${binary:Package}\t${Version}\n' 2>/dev/null | LC_ALL=C sort -u \
            >/tmp/managed-ubuntu-baseline-packages.tsv

          if ! id "$DESKTOP_USERNAME" >/dev/null 2>&1; then
            if getent group "$DESKTOP_USERNAME" >/dev/null 2>&1; then
              sudo useradd -m -s /bin/bash -g "$DESKTOP_USERNAME" "$DESKTOP_USERNAME"
            else
              sudo useradd -m -s /bin/bash "$DESKTOP_USERNAME"
            fi
          fi
          printf '%s:%s\n' "$DESKTOP_USERNAME" "$CLOUD_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo "$DESKTOP_USERNAME"

          (systemctl list-unit-files --state=enabled --no-legend --no-pager 2>/dev/null || true) \
            | awk '{print $1}' | sed '/^[[:space:]]*$/d' | LC_ALL=C sort -u \
            >/tmp/managed-ubuntu-baseline-systemd-enabled.txt
          (systemctl list-units --type=service --state=running --no-legend --no-pager 2>/dev/null || true) \
            | awk '{print $1}' | sed '/^[[:space:]]*$/d' | LC_ALL=C sort -u \
            >/tmp/managed-ubuntu-baseline-systemd-running.txt
          if command -v snap >/dev/null 2>&1; then
            (snap list 2>/dev/null || true) | awk 'NR>1 {print $1}' | LC_ALL=C sort -u \
              >/tmp/managed-ubuntu-baseline-snaps.txt
          else
            : >/tmp/managed-ubuntu-baseline-snaps.txt
          fi

          # Record a metadata baseline for installer-owned system locations. The
          # manifest uses lstat metadata (not file contents) to keep startup fast;
          # backup hashes every changed regular file and restore verifies those hashes.
          sudo python3 - <<'PY' >/tmp/managed-ubuntu-baseline-files.json
          import fnmatch
          import json
          import os
          import stat

          ROOTS = [
              '/etc', '/opt', '/usr/local', '/usr/bin', '/usr/sbin', '/usr/lib',
              '/usr/libexec', '/usr/share', '/usr/src', '/var/lib', '/var/opt',
              '/var/snap', '/var/www', '/srv', '/root',
          ]
          EXCLUDES = [
              '/etc/apt', '/usr/share/keyrings', '/etc/hostname', '/etc/hosts',
              '/etc/resolv.conf', '/etc/machine-id', '/etc/fstab', '/etc/crypttab',
              '/etc/passwd', '/etc/group', '/etc/shadow', '/etc/gshadow',
              '/etc/subuid', '/etc/subgid', '/etc/netplan', '/etc/network',
              '/etc/cloud', '/etc/ssh/ssh_host_*',
              '/etc/ssh/sshd_config.d/99-managed-cloud.conf', '/var/lib/apt',
              '/var/lib/dpkg', '/var/lib/systemd', '/var/lib/cloud',
              '/var/lib/snapd', '/var/lib/flatpak', '/var/lib/tailscale',
              '/var/lib/NetworkManager', '/var/lib/dbus', '/var/lib/waagent',
              '/var/lib/private', '/root/.cache',
          ]

          def excluded(path):
              path = os.path.normpath(path)
              for pattern in EXCLUDES:
                  if '*' in pattern:
                      if fnmatch.fnmatch(path, pattern):
                          return True
                  else:
                      pattern = os.path.normpath(pattern)
                      if path == pattern or path.startswith(pattern + os.sep):
                          return True
              return False

          def fingerprint(path):
              st = os.lstat(path)
              mode = st.st_mode
              if stat.S_ISREG(mode): kind = 'f'
              elif stat.S_ISDIR(mode): kind = 'd'
              elif stat.S_ISLNK(mode): kind = 'l'
              else: kind = 'o'
              return [
                  kind, stat.S_IMODE(mode), st.st_uid, st.st_gid,
                  st.st_size, st.st_mtime_ns,
                  os.readlink(path) if kind == 'l' else '',
              ]

          result = {}
          stack = [root for root in ROOTS if os.path.lexists(root)]
          while stack:
              path = stack.pop()
              if excluded(path):
                  continue
              try:
                  fp = fingerprint(path)
              except OSError:
                  continue
              result[path] = fp
              if fp[0] != 'd':
                  continue
              try:
                  with os.scandir(path) as it:
                      for entry in it:
                          child = entry.path
                          if not excluded(child):
                              stack.append(child)
              except OSError:
                  pass
          print(json.dumps(result, separators=(',', ':'), sort_keys=True))
          PY

          if [ "$MACHINE_MODE" = 'restore' ]; then
            APT_STATE=/tmp/managed-desktop-backup/apt
            if [ -s "$APT_STATE/config.tar" ]; then
              sudo tar --acls --xattrs -xpf "$APT_STATE/config.tar" -C /
              echo 'MANAGED_UBUNTU_APT_CONFIG_RESTORE_APPLIED'
            fi

            if [ -s "$APT_STATE/restore-packages.txt" ]; then
              mapfile -t RESTORE_APT_PACKAGES < <(sed '/^[[:space:]]*$/d' "$APT_STATE/restore-packages.txt" | LC_ALL=C sort -u)
              mapfile -t RESTORE_APT_MANUAL < <(sed '/^[[:space:]]*$/d' "$APT_STATE/manual-added.txt" 2>/dev/null | LC_ALL=C sort -u)
              if [ "${#RESTORE_APT_PACKAGES[@]}" -gt 0 ]; then
                echo "MANAGED_UBUNTU_APT_RESTORE_COUNT=${#RESTORE_APT_PACKAGES[@]}"
                sudo apt-get update -qq || echo '::warning::apt update failed; cached .deb fallback will be attempted.'
                RESTORE_APT_SPECS=()
                for pkg in "${RESTORE_APT_PACKAGES[@]}"; do
                  saved_version=$(awk -F '\t' -v p="$pkg" '$1 == p {print $2; exit}' "$APT_STATE/versions.tsv" 2>/dev/null || true)
                  if [ -n "$saved_version" ]; then RESTORE_APT_SPECS+=("${pkg}=${saved_version}"); else RESTORE_APT_SPECS+=("$pkg"); fi
                done
                if ! sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${RESTORE_APT_SPECS[@]}"; then
                  sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${RESTORE_APT_PACKAGES[@]}" || true
                fi

                NEED_DEB_APT_PACKAGES=()
                for pkg in "${RESTORE_APT_PACKAGES[@]}"; do
                  saved_version=$(awk -F '\t' -v p="$pkg" '$1 == p {print $2; exit}' "$APT_STATE/versions.tsv" 2>/dev/null || true)
                  actual_status=$(dpkg-query -W -f='${db:Status-Status}' "$pkg" 2>/dev/null || true)
                  actual_version=$(dpkg-query -W -f='${Version}' "$pkg" 2>/dev/null || true)
                  if [ "$actual_status" != installed ] || { [ -n "$saved_version" ] && [ "$actual_version" != "$saved_version" ]; }; then
                    NEED_DEB_APT_PACKAGES+=("$pkg")
                  fi
                done
                if [ "${#NEED_DEB_APT_PACKAGES[@]}" -gt 0 ]; then
                  shopt -s nullglob
                  RESTORE_DEBS=("$APT_STATE"/debs/*.deb)
                  shopt -u nullglob
                  if [ "${#RESTORE_DEBS[@]}" -gt 0 ]; then
                    sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --allow-downgrades "${RESTORE_DEBS[@]}" || true
                  fi
                fi

                UNRESTORED_APT_PACKAGES=()
                VERSION_MISMATCH_APT_PACKAGES=()
                for pkg in "${RESTORE_APT_PACKAGES[@]}"; do
                  actual_status=$(dpkg-query -W -f='${db:Status-Status}' "$pkg" 2>/dev/null || true)
                  if [ "$actual_status" != installed ]; then
                    UNRESTORED_APT_PACKAGES+=("$pkg")
                    continue
                  fi
                  saved_version=$(awk -F '\t' -v p="$pkg" '$1 == p {print $2; exit}' "$APT_STATE/versions.tsv" 2>/dev/null || true)
                  actual_version=$(dpkg-query -W -f='${Version}' "$pkg" 2>/dev/null || true)
                  if [ -n "$saved_version" ] && [ "$actual_version" != "$saved_version" ]; then
                    VERSION_MISMATCH_APT_PACKAGES+=("${pkg}:${actual_version}->${saved_version}")
                  fi
                done
                if [ "${#UNRESTORED_APT_PACKAGES[@]}" -gt 0 ]; then
                  printf '::error::Ubuntu package restore failed for: %s\n' "${UNRESTORED_APT_PACKAGES[*]}"
                  exit 1
                fi
                if [ "${#VERSION_MISMATCH_APT_PACKAGES[@]}" -gt 0 ]; then
                  printf '::error::Exact saved apt version restore failed for: %s\n' "${VERSION_MISMATCH_APT_PACKAGES[*]}"
                  exit 1
                fi
                if [ "${#RESTORE_APT_MANUAL[@]}" -gt 0 ]; then
                  sudo apt-mark manual "${RESTORE_APT_MANUAL[@]}" >/dev/null 2>&1 || true
                fi
                echo 'MANAGED_UBUNTU_APT_RESTORE_APPLIED'
              fi
            elif [ -s "$APT_STATE/manual-added.txt" ]; then
              # Backward compatibility with V2 backups.
              mapfile -t RESTORE_APT_PACKAGES < <(sed '/^[[:space:]]*$/d' "$APT_STATE/manual-added.txt" | LC_ALL=C sort -u)
              if [ "${#RESTORE_APT_PACKAGES[@]}" -gt 0 ]; then
                sudo apt-get update -qq || true
                sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${RESTORE_APT_PACKAGES[@]}" || true
                for pkg in "${RESTORE_APT_PACKAGES[@]}"; do
                  dpkg-query -W -f='${db:Status-Status}' "$pkg" 2>/dev/null | grep -qx installed \
                    || { echo "::error::Ubuntu V2 package restore failed for $pkg"; exit 1; }
                done
                sudo apt-mark manual "${RESTORE_APT_PACKAGES[@]}" >/dev/null 2>&1 || true
                echo 'MANAGED_UBUNTU_APT_RESTORE_APPLIED_V2'
              fi
            else
              echo 'MANAGED_UBUNTU_APT_RESTORE_LEGACY_BACKUP'
            fi

            SNAP_STATE=/tmp/managed-desktop-backup/snap
            if [ -s "$SNAP_STATE/added.tsv" ]; then
              command -v snap >/dev/null 2>&1 || { echo '::error::Snap backup exists but snap is unavailable after package restore.'; exit 1; }
              sudo systemctl start snapd.socket >/dev/null 2>&1 || true
              while IFS=$'\t' read -r snap_name snap_rev snap_channel snap_notes || [ -n "$snap_name" ]; do
                [ -n "$snap_name" ] || continue
                if snap list "$snap_name" >/dev/null 2>&1; then continue; fi
                SNAP_ARGS=(install "$snap_name")
                [ -z "$snap_channel" ] || [ "$snap_channel" = '-' ] || SNAP_ARGS+=("--channel=$snap_channel")
                [[ "$snap_notes" == *classic* ]] && SNAP_ARGS+=(--classic)
                if ! sudo snap "${SNAP_ARGS[@]}"; then
                  cached_snap=$(find "$SNAP_STATE/files" -maxdepth 1 -type f -name "${snap_name}_${snap_rev}.snap" -print -quit 2>/dev/null || true)
                  [ -n "$cached_snap" ] || { echo "::error::Snap restore failed for $snap_name"; exit 1; }
                  LOCAL_SNAP_ARGS=(install "$cached_snap" --dangerous)
                  [[ "$snap_notes" == *classic* ]] && LOCAL_SNAP_ARGS+=(--classic)
                  sudo snap "${LOCAL_SNAP_ARGS[@]}"
                fi
                snap list "$snap_name" >/dev/null 2>&1 || { echo "::error::Snap verification failed for $snap_name"; exit 1; }
              done <"$SNAP_STATE/added.tsv"
              echo 'MANAGED_UBUNTU_SNAP_RESTORE_APPLIED'
            fi

            # Package replay may auto-start daemons on a fresh runner. Freeze every
            # non-infrastructure systemd writer before restoring filesystem state.
            # Critical runner/network units stay alive only so this GitHub job can
            # finish and report/upload; their mutable state paths are excluded from
            # the managed snapshot.
            RESTORE_QUIESCE_DIR=/tmp/managed-ubuntu-restore-active
            rm -rf "$RESTORE_QUIESCE_DIR"
            managed_capture_active_units "$RESTORE_QUIESCE_DIR"
            sudo loginctl terminate-user "$DESKTOP_USERNAME" >/dev/null 2>&1 || true
            sudo pkill -TERM -u "$DESKTOP_USERNAME" >/dev/null 2>&1 || true
            sleep 2
            managed_quiesce_from_dir "$RESTORE_QUIESCE_DIR"
            echo 'MANAGED_UBUNTU_QUIESCED_FOR_RESTORE'

            SYSTEM_STATE=/tmp/managed-desktop-backup/system
            if [ -s "$SYSTEM_STATE/delta.tar" ]; then
              sudo tar --acls --xattrs -xpf "$SYSTEM_STATE/delta.tar" -C /
              sudo python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys
          state = json.load(open('/tmp/managed-desktop-backup/system/verify.json', encoding='utf-8'))
          errors = []
          for rel, expected in state.get('files', {}).items():
              path = '/' + rel.lstrip('/')
              try:
                  h = hashlib.sha256()
                  with open(path, 'rb') as f:
                      for chunk in iter(lambda: f.read(1024 * 1024), b''):
                          h.update(chunk)
                  if h.hexdigest() != expected:
                      errors.append(f'hash:{path}')
              except Exception:
                  errors.append(f'missing:{path}')
          for rel, expected in state.get('links', {}).items():
              path = '/' + rel.lstrip('/')
              try:
                  if not os.path.islink(path) or os.readlink(path) != expected:
                      errors.append(f'link:{path}')
              except Exception:
                  errors.append(f'missing-link:{path}')
          if errors:
              print('::error::Ubuntu system delta verification failed: ' + ', '.join(errors[:20]))
              sys.exit(1)
          print('MANAGED_UBUNTU_SYSTEM_DELTA_VERIFIED')
          PY
              sudo ldconfig >/dev/null 2>&1 || true
              echo 'MANAGED_UBUNTU_SYSTEM_DELTA_RESTORE_APPLIED'
            fi

            sudo rsync -aHAX /tmp/managed-desktop-backup/home/ "/home/${DESKTOP_USERNAME}/"
            sudo chown -R "${DESKTOP_USERNAME}:${DESKTOP_USERNAME}" "/home/${DESKTOP_USERNAME}"

            # Flatpak is reconstructed from signed remotes instead of restoring a
            # partial OSTree repository. We retain each remote's trusted GPG key,
            # recreate the remote, then reinstall the recorded refs. This avoids
            # refs pointing at objects that were not carried in the backup.
            FLATPAK_STATE=/tmp/managed-desktop-backup/flatpak
            if [ -d "$FLATPAK_STATE" ] && { [ -s "$FLATPAK_STATE/system-remotes.tsv" ] || [ -s "$FLATPAK_STATE/user-remotes.tsv" ] || [ -s "$FLATPAK_STATE/system-refs.tsv" ] || [ -s "$FLATPAK_STATE/user-refs.tsv" ]; }; then
              command -v flatpak >/dev/null 2>&1 || { echo '::error::Flatpak backup exists but flatpak is unavailable after package restore.'; exit 1; }
              FLATPAK_USER=(sudo -H -u "$DESKTOP_USERNAME" env -u SUDO_USER -u SUDO_UID -u SUDO_GID flatpak)
              SYSTEM_KEYS=/tmp/managed-flatpak-system-keys
              USER_KEYS=/tmp/managed-flatpak-user-keys
              rm -rf "$SYSTEM_KEYS" "$USER_KEYS"
              mkdir -p "$SYSTEM_KEYS" "$USER_KEYS"

              # New V3 backups store trusted keys explicitly.
              [ ! -d "$FLATPAK_STATE/system-keys" ] || cp -a "$FLATPAK_STATE/system-keys/." "$SYSTEM_KEYS/" 2>/dev/null || true
              [ ! -d "$FLATPAK_STATE/user-keys" ] || cp -a "$FLATPAK_STATE/user-keys/." "$USER_KEYS/" 2>/dev/null || true

              # Compatibility with early V3 caches: extract only trusted keyring
              # files from the old metadata tar, never its refs/config.
              if [ -s "$FLATPAK_STATE/system-repo-meta.tar" ]; then
                while IFS= read -r member || [ -n "$member" ]; do
                  case "$member" in
                    var/lib/flatpak/repo/*.trustedkeys.gpg)
                      sudo tar -xOf "$FLATPAK_STATE/system-repo-meta.tar" "$member" >"$SYSTEM_KEYS/$(basename "$member")"
                      ;;
                  esac
                done < <(sudo tar -tf "$FLATPAK_STATE/system-repo-meta.tar")
              fi

              # Early V3 Home backups may contain a user OSTree repo. Preserve only
              # its trusted keys, then discard the repo so refs are rebuilt cleanly.
              USER_REPO="/home/${DESKTOP_USERNAME}/.local/share/flatpak/repo"
              if [ -d "$USER_REPO" ]; then
                sudo find "$USER_REPO" -maxdepth 1 -type f -name '*.trustedkeys.gpg' -exec cp -a {} "$USER_KEYS/" \; || true
                sudo rm -rf "$USER_REPO"
              fi
              chmod -R a+rX "$SYSTEM_KEYS" "$USER_KEYS" 2>/dev/null || true

              if [ -s "$FLATPAK_STATE/system-remotes.tsv" ]; then
                while IFS=$'\t' read -r remote_name remote_url || [ -n "$remote_name" ]; do
                  [ -n "$remote_name" ] && [ -n "$remote_url" ] || continue
                  actual_url=$(flatpak remotes --system --columns=name,url 2>/dev/null | awk -F '\t' -v n="$remote_name" '$1 == n {print $2; exit}')
                  if [ -z "$actual_url" ]; then
                    key_file="$SYSTEM_KEYS/${remote_name}.trustedkeys.gpg"
                    [ -s "$key_file" ] || { echo "::error::Flatpak system remote GPG key missing: $remote_name"; exit 1; }
                    sudo flatpak remote-add --system --if-not-exists --gpg-import="$key_file" "$remote_name" "$remote_url"
                  elif [ "$actual_url" != "$remote_url" ]; then
                    sudo flatpak remote-modify --system --url="$remote_url" "$remote_name"
                  fi
                  actual_url=$(flatpak remotes --system --columns=name,url 2>/dev/null | awk -F '\t' -v n="$remote_name" '$1 == n {print $2; exit}')
                  [ "$actual_url" = "$remote_url" ] || { echo "::error::Flatpak system remote restore failed: $remote_name"; exit 1; }
                done <"$FLATPAK_STATE/system-remotes.tsv"
              fi

              if [ -s "$FLATPAK_STATE/user-remotes.tsv" ]; then
                while IFS=$'\t' read -r remote_name remote_url || [ -n "$remote_name" ]; do
                  [ -n "$remote_name" ] && [ -n "$remote_url" ] || continue
                  actual_url=$("${FLATPAK_USER[@]}" remotes --user --columns=name,url 2>/dev/null | awk -F '\t' -v n="$remote_name" '$1 == n {print $2; exit}')
                  if [ -z "$actual_url" ]; then
                    key_file="$USER_KEYS/${remote_name}.trustedkeys.gpg"
                    [ -s "$key_file" ] || { echo "::error::Flatpak user remote GPG key missing: $remote_name"; exit 1; }
                    "${FLATPAK_USER[@]}" remote-add --user --if-not-exists --gpg-import="$key_file" "$remote_name" "$remote_url"
                  elif [ "$actual_url" != "$remote_url" ]; then
                    "${FLATPAK_USER[@]}" remote-modify --user --url="$remote_url" "$remote_name"
                  fi
                  actual_url=$("${FLATPAK_USER[@]}" remotes --user --columns=name,url 2>/dev/null | awk -F '\t' -v n="$remote_name" '$1 == n {print $2; exit}')
                  [ "$actual_url" = "$remote_url" ] || { echo "::error::Flatpak user remote restore failed: $remote_name"; exit 1; }
                done <"$FLATPAK_STATE/user-remotes.tsv"
              fi

              if [ -s "$FLATPAK_STATE/system-refs.tsv" ]; then
                while IFS=$'\t' read -r ref origin || [ -n "$ref" ]; do
                  [ -n "$ref" ] && [ -n "$origin" ] || continue
                  flatpak list --system --columns=ref 2>/dev/null | grep -Fxq "$ref" \
                    || sudo flatpak install -y --noninteractive --system "$origin" "$ref"
                  flatpak list --system --columns=ref 2>/dev/null | grep -Fxq "$ref" \
                    || { echo "::error::Flatpak system ref verification failed: $ref"; exit 1; }
                done <"$FLATPAK_STATE/system-refs.tsv"
              fi
              if [ -s "$FLATPAK_STATE/user-refs.tsv" ]; then
                while IFS=$'\t' read -r ref origin || [ -n "$ref" ]; do
                  [ -n "$ref" ] && [ -n "$origin" ] || continue
                  "${FLATPAK_USER[@]}" list --user --columns=ref 2>/dev/null | grep -Fxq "$ref" \
                    || "${FLATPAK_USER[@]}" install -y --noninteractive --user "$origin" "$ref"
                  "${FLATPAK_USER[@]}" list --user --columns=ref 2>/dev/null | grep -Fxq "$ref" \
                    || { echo "::error::Flatpak user ref verification failed: $ref"; exit 1; }
                done <"$FLATPAK_STATE/user-refs.tsv"
              fi
              echo 'MANAGED_UBUNTU_FLATPAK_RESTORE_APPLIED'
            fi

            CRON_STATE=/tmp/managed-desktop-backup/cron
            if command -v crontab >/dev/null 2>&1 && [ -d "$CRON_STATE" ]; then
              [ ! -f "$CRON_STATE/root.cron" ] || sudo crontab "$CRON_STATE/root.cron"
              [ ! -f "$CRON_STATE/user.cron" ] || sudo -u "$DESKTOP_USERNAME" crontab "$CRON_STATE/user.cron"
              echo 'MANAGED_UBUNTU_CRON_RESTORE_APPLIED'
            fi

            SYSTEMD_STATE=/tmp/managed-desktop-backup/systemd
            sudo systemctl daemon-reload
            if [ -s "$SYSTEMD_STATE/enabled-removed.txt" ]; then
              while IFS= read -r unit || [ -n "$unit" ]; do
                [ -n "$unit" ] || continue
                case "$unit" in ssh.service|ssh.socket|tailscaled.service|systemd-networkd.service|NetworkManager.service) continue ;; esac
                sudo systemctl disable "$unit" >/dev/null 2>&1 || true
              done <"$SYSTEMD_STATE/enabled-removed.txt"
            fi
            if [ -s "$SYSTEMD_STATE/enabled-added.txt" ]; then
              while IFS= read -r unit || [ -n "$unit" ]; do
                [ -n "$unit" ] || continue
                sudo systemctl enable "$unit" >/dev/null 2>&1 || { echo "::error::Failed to enable restored unit $unit"; exit 1; }
              done <"$SYSTEMD_STATE/enabled-added.txt"
            fi
            RESTORE_RUNTIME_DIR=/tmp/managed-ubuntu-runtime-restore
            rm -rf "$RESTORE_RUNTIME_DIR"
            mkdir -p "$RESTORE_RUNTIME_DIR"

            if [ -s "$SYSTEMD_STATE/runtime-services.txt" ]; then
              cp "$SYSTEMD_STATE/runtime-services.txt" "$RESTORE_RUNTIME_DIR/services.txt"
            else
              # Backward compatibility with V3 backups: preserve fresh-runner baseline
              # services and add the user/application services that the old backup did
              # explicitly record as running-added.
              cat "$RESTORE_QUIESCE_DIR/services.txt" >"$RESTORE_RUNTIME_DIR/services.txt"
              if [ -s "$SYSTEMD_STATE/running-added.txt" ]; then
                cat "$SYSTEMD_STATE/running-added.txt" >>"$RESTORE_RUNTIME_DIR/services.txt"
              fi
              sed '/^[[:space:]]*$/d' "$RESTORE_RUNTIME_DIR/services.txt" | LC_ALL=C sort -u \
                >"$RESTORE_RUNTIME_DIR/services.tmp"
              mv "$RESTORE_RUNTIME_DIR/services.tmp" "$RESTORE_RUNTIME_DIR/services.txt"
            fi

            for kind in sockets timers paths; do
              if [ -s "$SYSTEMD_STATE/runtime-${kind}.txt" ]; then
                cp "$SYSTEMD_STATE/runtime-${kind}.txt" "$RESTORE_RUNTIME_DIR/${kind}.txt"
              else
                cp "$RESTORE_QUIESCE_DIR/${kind}.txt" "$RESTORE_RUNTIME_DIR/${kind}.txt" 2>/dev/null || :
                case "$kind" in
                  sockets) suffix='\.socket$' ;;
                  timers) suffix='\.timer$' ;;
                  paths) suffix='\.path$' ;;
                esac
                if [ -s "$SYSTEMD_STATE/enabled-added.txt" ]; then
                  { grep -E "$suffix" "$SYSTEMD_STATE/enabled-added.txt" 2>/dev/null || true; cat "$RESTORE_RUNTIME_DIR/${kind}.txt"; } \
                    | sed '/^[[:space:]]*$/d' | LC_ALL=C sort -u >"$RESTORE_RUNTIME_DIR/${kind}.tmp"
                  mv "$RESTORE_RUNTIME_DIR/${kind}.tmp" "$RESTORE_RUNTIME_DIR/${kind}.txt"
                fi
              fi
            done

            # Services first so dependencies are available; activators follow and
            # recover socket/timer/path driven application behavior.
            managed_start_unit_file "$RESTORE_RUNTIME_DIR/services.txt"
            managed_start_unit_file "$RESTORE_RUNTIME_DIR/sockets.txt"
            managed_start_unit_file "$RESTORE_RUNTIME_DIR/paths.txt"
            managed_start_unit_file "$RESTORE_RUNTIME_DIR/timers.txt"
            echo 'MANAGED_UBUNTU_RUNTIME_STATE_RESTORED'
            echo 'MANAGED_DESKTOP_RESTORE_APPLIED'
          else
            echo 'MANAGED_DESKTOP_FRESH_START'
          fi

          TS_IPV4=$(tailscale ip -4 | head -n1)
          [ -n "$TS_IPV4" ] || { echo '::error::No Tailscale IPv4 address was assigned'; exit 1; }

          sudo mkdir -p /etc/ssh/sshd_config.d
          sudo install -d -m 0755 /run/sshd
          sudo tee /etc/ssh/sshd_config.d/99-managed-cloud.conf >/dev/null <<EOF
          ListenAddress ${TS_IPV4}
          ListenAddress 127.0.0.1
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          PermitRootLogin no
          AllowUsers ${DESKTOP_USERNAME}
          EOF
          sudo sshd -t
          sudo systemctl restart ssh

          echo 'MANAGED_UBUNTU_READY'
          echo "TAILSCALE_SSH=${TS_IPV4}:22"
          echo "SSH_USER=${DESKTOP_USERNAME}"
          echo "UBUNTU_RUNNER_IMAGE=$RUNNER_IMAGE"
          echo "MANAGED_DESKTOP_MODE=$MACHINE_MODE"

      - name: Deploy Ubuntu SOCKS5 service
        if: ${{ env.UBUNTU_SOCKS5_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${UBUNTU_SOCKS5_PASSWORD}"
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dante-server libpam-pwdfile openssl

          # SOCKS5 credentials are intentionally isolated from Linux/SSH accounts.
          # The proxy username may be identical to DESKTOP_USERNAME without sharing
          # its shell, UID, /etc/shadow password, or any other system-account state.
          SOCKS5_HASH=$(printf '%s\n' "$UBUNTU_SOCKS5_PASSWORD" | openssl passwd -6 -stdin)
          [ -n "$SOCKS5_HASH" ] || { echo '::error::Unable to hash Ubuntu SOCKS5 password'; exit 1; }
          sudo install -d -m 0755 /etc/cloud-manager
          printf '%s:%s\n' "$UBUNTU_SOCKS5_USERNAME" "$SOCKS5_HASH" | sudo tee /etc/cloud-manager/socks5.passwd >/dev/null
          sudo chown root:root /etc/cloud-manager/socks5.passwd
          sudo chmod 600 /etc/cloud-manager/socks5.passwd
          sudo tee /etc/pam.d/cloud-manager-socks5 >/dev/null <<'EOF'
          auth required pam_pwdfile.so pwdfile=/etc/cloud-manager/socks5.passwd nodelay
          account required pam_permit.so
          session required pam_permit.so
          password required pam_deny.so
          EOF

          EXT_IF=$(ip route show default | awk 'NR==1 {print $5}')
          [ -n "$EXT_IF" ] || { echo '::error::Unable to determine Ubuntu egress interface'; exit 1; }
          sudo tee /etc/danted.conf >/dev/null <<EOF
          logoutput: syslog
          internal: 127.0.0.1 port = ${UBUNTU_SOCKS5_PORT}
          external: ${EXT_IF}
          clientmethod: none
          socksmethod: pam.username
          user.privileged: root
          user.unprivileged: nobody
          client pass {
            from: 127.0.0.1/32 to: 0.0.0.0/0
            log: error
          }
          socks pass {
            from: 127.0.0.1/32 to: 0.0.0.0/0
            command: connect bind udpassociate
            socksmethod: pam.username
            pam.servicename: cloud-manager-socks5
            log: error
          }
          EOF
          sudo systemctl enable danted >/dev/null 2>&1 || true
          sudo systemctl restart danted
          SOCKS5_LISTENER_READY=0
          for _ in $(seq 1 20); do
            if ss -ltnH | grep -Eq "127\\.0\\.0\\.1:${UBUNTU_SOCKS5_PORT}[[:space:]]"; then
              SOCKS5_LISTENER_READY=1
              break
            fi
            sudo systemctl is-active --quiet danted || break
            sleep 0.5
          done
          if [ "$SOCKS5_LISTENER_READY" != '1' ]; then
            echo '::error::Ubuntu SOCKS5 listener is not ready'
            sudo systemctl status danted --no-pager || true
            sudo journalctl -u danted -n 120 --no-pager || true
            ss -ltnp || true
            exit 1
          fi
          curl -fsS --connect-timeout 8 --max-time 20 --socks5-hostname "127.0.0.1:${UBUNTU_SOCKS5_PORT}" --proxy-user "${UBUNTU_SOCKS5_USERNAME}:${UBUNTU_SOCKS5_PASSWORD}" https://www.cloudflare.com/cdn-cgi/trace -o /tmp/cloud-manager-socks5-selftest
          grep -q '^ip=' /tmp/cloud-manager-socks5-selftest || { echo '::error::Ubuntu SOCKS5 authentication/egress self-test failed'; exit 1; }
          rm -f /tmp/cloud-manager-socks5-selftest
          echo "UBUNTU_SOCKS5_READY=127.0.0.1:${UBUNTU_SOCKS5_PORT}"

      - name: Start Cloudflare tunnel
        if: ${{ env.TUNNEL_MODE == 'cloudflare' || env.TUNNEL_MODE == 'dual' || env.UBUNTU_SOCKS5_ENABLED == 'true' || env.FANOUT_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CF_TUNNEL_TOKEN:-}" ] || { echo '::error::Cloudflare Tunnel token is missing'; exit 1; }
          if [ "${TUNNEL_MODE:-tailscale}" = 'cloudflare' ] || [ "${TUNNEL_MODE:-tailscale}" = 'dual' ]; then
            [ -n "${CF_TUNNEL_HOSTNAME:-}" ] || { echo '::error::Cloudflare SSH hostname is missing'; exit 1; }
          fi
          if [ "${UBUNTU_SOCKS5_ENABLED:-false}" = 'true' ]; then
            [ -n "${UBUNTU_SOCKS5_HOSTNAME:-}" ] || { echo '::error::Cloudflare SOCKS5 hostname is missing'; exit 1; }
          fi
          echo "::add-mask::${CF_TUNNEL_TOKEN}"
          CLOUDFLARED=/tmp/cloudflared-managed
          TOKEN_FILE=/tmp/cloudflared-managed-token
          LOG_FILE=/tmp/cloudflared-managed.log
          curl -fsSL --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o "$CLOUDFLARED"
          chmod +x "$CLOUDFLARED"
          printf '%s' "$CF_TUNNEL_TOKEN" > "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"
          : > "$LOG_FILE"
          nohup "$CLOUDFLARED" tunnel --no-autoupdate --loglevel info --logfile "$LOG_FILE" run --token-file "$TOKEN_FILE" >/dev/null 2>&1 &
          echo $! >/tmp/cloudflared-managed.pid
          READY=0
          for _ in $(seq 1 60); do
            if grep -q 'Registered tunnel connection' "$LOG_FILE" 2>/dev/null; then READY=1; break; fi
            kill -0 "$(cat /tmp/cloudflared-managed.pid)" 2>/dev/null || break
            sleep 1
          done
          if [ "$READY" != '1' ]; then tail -n 80 "$LOG_FILE" || true; echo '::error::Cloudflare TCP tunnel did not connect'; exit 1; fi
          [ -z "${CF_TUNNEL_HOSTNAME:-}" ] || echo "CLOUDFLARE_SSH_TUNNEL=${CF_TUNNEL_HOSTNAME}"
          [ -z "${UBUNTU_SOCKS5_HOSTNAME:-}" ] || echo "CLOUDFLARE_SOCKS5_TUNNEL=${UBUNTU_SOCKS5_HOSTNAME}:${UBUNTU_SOCKS5_PORT}"

      - name: Sync runtime state
        env:
          BOOTSTRAP_TICKET: ${{ inputs.bootstrap_ticket }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${BOOTSTRAP_TICKET}"
          TS_IPV4=$(tailscale ip -4 | head -n1)
          [ -n "$TS_IPV4" ] || { echo '::error::No Tailscale IPv4 address was assigned'; exit 1; }
          INSTANCE_KEY="instance:ubuntu:${MACHINE_ID}"
          BODY=$(jq -nc \
            --arg key "$INSTANCE_KEY" --arg repo "$GITHUB_REPOSITORY" --argjson run "$GITHUB_RUN_ID" \
            --arg node "ubuntu-${MACHINE_ID}" --arg ts "${TS_IPV4}:22" \
            --arg tsHost "${TS_DNS_HOSTNAME:-}" --arg cf "${CF_TUNNEL_HOSTNAME:-}" --arg mode "${TUNNEL_MODE:-tailscale}" \
            '{instanceKey:$key,repository:$repo,runId:$run,nodeName:$node,address:$ts,tailscaleAddress:$ts,tailscaleHostname:$tsHost,cloudflareAddress:$cf,cloudflareHostname:$cf,tunnelMode:$mode,status:"in_progress"}')
          WEB_URL="${WEB_URL%/}"
          case "$WEB_URL" in https://*) ;; *) echo '::error::Cloudflare control URL is invalid'; exit 1 ;; esac
          curl -fsS --retry 3 -H "X-Bootstrap-Ticket: ${BOOTSTRAP_TICKET}" -H 'content-type: application/json' --data "$BODY" "${WEB_URL}/api/runner/report" -o /tmp/cloud-report.json
          echo "CLOUDFLARE_RUNNER_REPORT_OK=${TS_IPV4}:22"
          jq -r 'select(.tailscaleDomain != null and .tailscaleDomain != "") | "TAILSCALE_FIXED_DOMAIN=" + .tailscaleDomain' /tmp/cloud-report.json || true
          jq -r 'select(.cloudflareDomain != null and .cloudflareDomain != "") | "CLOUDFLARE_FIXED_DOMAIN=" + .cloudflareDomain' /tmp/cloud-report.json || true
          rm -f /tmp/cloud-report.json

      - name: Keep Ubuntu session alive and watch backup command
        id: session
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          MANAGED_UBUNTU_INFRA_UNITS=/tmp/managed-ubuntu-quiesce-infra-units.txt

          managed_init_quiesce_infra_units() {
            : >"$MANAGED_UBUNTU_INFRA_UNITS"
            local pid="$$" cgroup_line unit ppid
            # Preserve whichever systemd service actually owns this workflow process.
            # GitHub-hosted runners currently execute below hosted-compute-agent.service,
            # while self-hosted images may use a different service name. Walking the
            # live parent/cgroup chain makes this independent of that provider detail.
            while [[ "$pid" =~ ^[0-9]+$ ]] && [ "$pid" -gt 1 ] && [ -r "/proc/${pid}/cgroup" ]; do
              while IFS= read -r cgroup_line || [ -n "$cgroup_line" ]; do
                unit="${cgroup_line##*/}"
                case "$unit" in
                  *.service) printf '%s\n' "$unit" >>"$MANAGED_UBUNTU_INFRA_UNITS" ;;
                esac
              done <"/proc/${pid}/cgroup"
              ppid=$(awk '/^PPid:/ {print $2; exit}' "/proc/${pid}/status" 2>/dev/null || true)
              [ -n "$ppid" ] && [ "$ppid" != "$pid" ] || break
              pid="$ppid"
            done
            # Keep the workflow account's user manager. Application-user managers are
            # still stopped after loginctl terminate-user below.
            printf 'user@%s.service\n' "$(id -u)" >>"$MANAGED_UBUNTU_INFRA_UNITS"
            LC_ALL=C sort -u -o "$MANAGED_UBUNTU_INFRA_UNITS" "$MANAGED_UBUNTU_INFRA_UNITS"
            while IFS= read -r unit || [ -n "$unit" ]; do
              [ -n "$unit" ] && echo "MANAGED_UBUNTU_INFRA_UNIT_KEEP unit=$unit"
            done <"$MANAGED_UBUNTU_INFRA_UNITS"
          }

          managed_keep_quiesce_unit() {
            local unit="$1"
            if [ -s "$MANAGED_UBUNTU_INFRA_UNITS" ] && grep -Fxq -- "$unit" "$MANAGED_UBUNTU_INFRA_UNITS"; then
              return 0
            fi
            case "$unit" in
              ssh.service|ssh.socket|tailscaled.service|systemd-networkd.service|NetworkManager.service|systemd-resolved.service|networkd-dispatcher.service|systemd-journald.service|systemd-journald.socket|systemd-journald-dev-log.socket|systemd-udevd.service|systemd-udevd-control.socket|systemd-udevd-kernel.socket|systemd-logind.service|systemd-timesyncd.service|dbus.service|dbus.socket|polkit.service|waagent.service|walinuxagent.service|WALinuxAgent.service|actions.runner.*.service|github-actions-runner*.service)
                return 0
                ;;
            esac
            return 1
          }

          managed_init_quiesce_infra_units

          managed_capture_active_units() {
            local dir="$1"
            mkdir -p "$dir"
            (systemctl list-units --type=service --state=running --no-legend --no-pager 2>/dev/null || true) \
              | awk '{print $1}' | sed '/^[[:space:]]*$/d' | LC_ALL=C sort -u >"$dir/services.txt"
            for unit_type in socket timer path; do
              (systemctl list-units --type="$unit_type" --state=active --no-legend --no-pager 2>/dev/null || true) \
                | awk '{print $1}' | sed '/^[[:space:]]*$/d' | LC_ALL=C sort -u >"$dir/${unit_type}s.txt"
            done
          }

          managed_stop_unit_file() {
            local file="$1"
            [ -f "$file" ] || return 0
            while IFS= read -r unit || [ -n "$unit" ]; do
              [ -n "$unit" ] || continue
              managed_keep_quiesce_unit "$unit" && continue
              sudo systemctl stop "$unit" >/dev/null 2>&1 \
                || echo "::warning::Could not stop $unit while quiescing Ubuntu state"
            done <"$file"
          }

          managed_verify_unit_file_quiet() {
            local file="$1"
            local failed=0
            [ -f "$file" ] || return 0
            while IFS= read -r unit || [ -n "$unit" ]; do
              [ -n "$unit" ] || continue
              managed_keep_quiesce_unit "$unit" && continue
              if systemctl is-active --quiet "$unit" 2>/dev/null; then
                echo "::error::Ubuntu snapshot is not quiescent; unit is still active: $unit"
                failed=1
              fi
            done <"$file"
            return "$failed"
          }

          managed_quiesce_from_dir() {
            local dir="$1"
            local failed=0
            for kind in timers paths sockets services; do
              managed_stop_unit_file "$dir/${kind}.txt"
            done
            sync
            for kind in timers paths sockets services; do
              managed_verify_unit_file_quiet "$dir/${kind}.txt" || failed=1
            done
            [ "$failed" -eq 0 ] || exit 1
          }

          stage_backup() {
            rm -rf /tmp/managed-desktop-backup /tmp/managed-ubuntu-backup-active
            mkdir -p \
              /tmp/managed-desktop-backup/home \
              /tmp/managed-desktop-backup/apt/debs \
              /tmp/managed-desktop-backup/snap/files \
              /tmp/managed-desktop-backup/flatpak/system-keys \
              /tmp/managed-desktop-backup/flatpak/user-keys \
              /tmp/managed-desktop-backup/systemd \
              /tmp/managed-desktop-backup/cron \
              /tmp/managed-desktop-backup/system

            # Capture exact desired runtime state before anything is stopped. New
            # backups restore this state instead of assuming only newly-added services
            # can write application data.
            (systemctl list-unit-files --state=enabled --no-legend --no-pager 2>/dev/null || true) \
              | awk '{print $1}' | sed '/^[[:space:]]*$/d' | LC_ALL=C sort -u \
              >/tmp/managed-ubuntu-current-systemd-enabled.txt
            managed_capture_active_units /tmp/managed-ubuntu-backup-active
            cp /tmp/managed-ubuntu-backup-active/services.txt /tmp/managed-ubuntu-current-systemd-running.txt
            cp /tmp/managed-ubuntu-backup-active/services.txt /tmp/managed-desktop-backup/systemd/runtime-services.txt
            cp /tmp/managed-ubuntu-backup-active/sockets.txt /tmp/managed-desktop-backup/systemd/runtime-sockets.txt
            cp /tmp/managed-ubuntu-backup-active/timers.txt /tmp/managed-desktop-backup/systemd/runtime-timers.txt
            cp /tmp/managed-ubuntu-backup-active/paths.txt /tmp/managed-desktop-backup/systemd/runtime-paths.txt
            comm -13 /tmp/managed-ubuntu-baseline-systemd-enabled.txt /tmp/managed-ubuntu-current-systemd-enabled.txt \
              >/tmp/managed-desktop-backup/systemd/enabled-added.txt
            comm -23 /tmp/managed-ubuntu-baseline-systemd-enabled.txt /tmp/managed-ubuntu-current-systemd-enabled.txt \
              >/tmp/managed-desktop-backup/systemd/enabled-removed.txt
            comm -13 /tmp/managed-ubuntu-baseline-systemd-running.txt /tmp/managed-ubuntu-current-systemd-running.txt \
              >/tmp/managed-desktop-backup/systemd/running-added.txt

            # snap list needs snapd; inventory it before quiescing, then copy the
            # immutable .snap payloads only after snapd has been stopped.
            if command -v snap >/dev/null 2>&1; then
              (snap list 2>/dev/null || true) >/tmp/managed-ubuntu-current-snap-list.txt
            else
              : >/tmp/managed-ubuntu-current-snap-list.txt
            fi

            # End interactive/user workloads, disable systemd activators, then stop
            # every non-infrastructure running service. This includes baseline Docker,
            # containerd, cron, snapd and any future application daemon without having
            # to know its name in advance.
            sudo loginctl terminate-user "$DESKTOP_USERNAME" >/dev/null 2>&1 || true
            sudo pkill -TERM -u "$DESKTOP_USERNAME" >/dev/null 2>&1 || true
            sleep 2
            managed_quiesce_from_dir /tmp/managed-ubuntu-backup-active

            # Fail closed if an unknown surviving process still has a writable file
            # descriptor inside the state we are about to snapshot. This catches
            # daemons started outside systemd as well as future runner-image services.
            sudo python3 - "$DESKTOP_USERNAME" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          desktop_user = sys.argv[1]
          roots = [
              '/etc', '/opt', '/usr/local', '/usr/bin', '/usr/sbin', '/usr/lib',
              '/usr/libexec', '/usr/share', '/usr/src', '/var/lib', '/var/opt',
              '/var/snap', '/var/www', '/srv', '/root', f'/home/{desktop_user}',
          ]
          excludes = [
              '/etc/apt', '/usr/share/keyrings', '/etc/hostname', '/etc/hosts',
              '/etc/resolv.conf', '/etc/machine-id', '/etc/fstab', '/etc/crypttab',
              '/etc/passwd', '/etc/group', '/etc/shadow', '/etc/gshadow',
              '/etc/subuid', '/etc/subgid', '/etc/netplan', '/etc/network',
              '/etc/cloud', '/var/lib/apt', '/var/lib/dpkg', '/var/lib/systemd',
              '/var/lib/cloud', '/var/lib/snapd', '/var/lib/flatpak',
              '/var/lib/tailscale', '/var/lib/NetworkManager', '/var/lib/dbus',
              '/var/lib/waagent', '/var/lib/private', '/root/.cache',
              f'/home/{desktop_user}/.cache',
              f'/home/{desktop_user}/.local/share/flatpak/repo',
          ]
          infra_units_path = Path('/tmp/managed-ubuntu-quiesce-infra-units.txt')
          infra_excludes_path = Path('/tmp/managed-ubuntu-infra-writer-excludes.json')
          infra_units = set()
          if infra_units_path.exists():
              infra_units = set(infra_units_path.read_text(encoding='utf-8', errors='replace').splitlines())
          coarse_dirs = set(roots) | {'/usr', '/var', '/home'}

          def beneath(path, base):
              return path == base or path.startswith(base + os.sep)

          def managed(path):
              path = os.path.normpath(path)
              if not any(beneath(path, root) for root in roots):
                  return False
              return not any(beneath(path, item) for item in excludes)

          def infra_unit_for(proc):
              try:
                  lines = (proc / 'cgroup').read_text(encoding='utf-8', errors='replace').splitlines()
              except OSError:
                  return ''
              for line in lines:
                  unit = line.rsplit('/', 1)[-1]
                  if unit in infra_units:
                      return unit
              return ''

          def infra_exclusion(target):
              target = os.path.normpath(target)
              try:
                  if os.path.isdir(target):
                      return target
              except OSError:
                  pass
              parent = os.path.dirname(target)
              # Prefer excluding the writer's runtime directory so rotations/new
              # files cannot race the snapshot. Never broaden an exclusion to a
              # managed top-level root such as /etc, /opt or /var/lib.
              if not parent or parent == '/' or parent in coarse_dirs:
                  return target
              return parent

          writers = []
          infra_writers = []
          infra_excludes = set()
          for proc in Path('/proc').iterdir():
              if not proc.name.isdigit():
                  continue
              fd_dir = proc / 'fd'
              try:
                  fds = list(fd_dir.iterdir())
              except OSError:
                  continue
              for fd in fds:
                  try:
                      target = os.readlink(fd)
                      if target.endswith(' (deleted)'):
                          target = target[:-10]
                      if not target.startswith('/') or not managed(target):
                          continue
                      flags_text = (proc / 'fdinfo' / fd.name).read_text(errors='replace')
                      flags_line = next((line for line in flags_text.splitlines() if line.startswith('flags:')), '')
                      if not flags_line:
                          continue
                      flags = int(flags_line.split(':', 1)[1].strip(), 8)
                      if (flags & os.O_ACCMODE) == os.O_RDONLY:
                          continue
                      unit = infra_unit_for(proc)
                      if unit:
                          exclusion = infra_exclusion(target)
                          infra_excludes.add(exclusion)
                          infra_writers.append((int(proc.name), target, unit, exclusion))
                          continue
                      try:
                          cmd = (proc / 'cmdline').read_bytes().replace(b'\0', b' ').decode('utf-8', 'replace').strip()
                      except OSError:
                          cmd = ''
                      writers.append((int(proc.name), target, cmd[:160]))
                  except (OSError, ValueError, StopIteration):
                      continue

          infra_excludes_path.write_text(
              json.dumps(sorted(infra_excludes), separators=(',', ':')),
              encoding='utf-8',
          )
          for pid, path, unit, exclusion in sorted(set(infra_writers))[:20]:
              print(f'MANAGED_UBUNTU_INFRA_WRITER_EXCLUDE unit={unit} pid={pid} path={path} exclude={exclusion}')
          if writers:
              for pid, path, cmd in sorted(set(writers))[:20]:
                  print(f'::error::Ubuntu snapshot still has writer pid={pid} path={path} cmd={cmd}')
              sys.exit(1)
          print(f'MANAGED_UBUNTU_SNAPSHOT_WRITERS_QUIET infraExcludes={len(infra_excludes)}')
          PY
            echo 'MANAGED_UBUNTU_QUIESCED_FOR_BACKUP'

            sudo rsync -aHAX --delete --exclude='.cache/' --exclude='.local/share/flatpak/repo/' "/home/${DESKTOP_USERNAME}/" /tmp/managed-desktop-backup/home/

            # Package-manager state: sources/keys, manual package delta, package
            # version delta, plus exact .deb payloads where possible.
            sudo tar --acls --xattrs -cpf /tmp/managed-desktop-backup/apt/config.tar -C / etc/apt usr/share/keyrings
            apt-mark showmanual | LC_ALL=C sort -u >/tmp/managed-ubuntu-current-manual.txt
            comm -13 /tmp/managed-ubuntu-baseline-manual.txt /tmp/managed-ubuntu-current-manual.txt \
              >/tmp/managed-desktop-backup/apt/manual-added.txt
            dpkg-query -W -f='${binary:Package}\t${Version}\n' 2>/dev/null | LC_ALL=C sort -u \
              >/tmp/managed-ubuntu-current-packages.tsv
            python3 - <<'PY'
          from pathlib import Path
          def read(path):
              out = {}
              for line in Path(path).read_text(encoding='utf-8', errors='replace').splitlines():
                  if '\t' not in line:
                      continue
                  name, version = line.split('\t', 1)
                  out[name] = version
              return out
          baseline = read('/tmp/managed-ubuntu-baseline-packages.tsv')
          current = read('/tmp/managed-ubuntu-current-packages.tsv')
          changed = sorted((name, version) for name, version in current.items() if baseline.get(name) != version)
          dest = Path('/tmp/managed-desktop-backup/apt/version-changed.tsv')
          dest.write_text(''.join(f'{name}\t{version}\n' for name, version in changed), encoding='utf-8')
          manual = set(Path('/tmp/managed-desktop-backup/apt/manual-added.txt').read_text(encoding='utf-8').split())
          restore = sorted(manual | {name for name, _ in changed})
          Path('/tmp/managed-desktop-backup/apt/restore-packages.txt').write_text(''.join(f'{name}\n' for name in restore), encoding='utf-8')
          Path('/tmp/managed-desktop-backup/apt/versions.tsv').write_text(''.join(f'{name}\t{current[name]}\n' for name in restore if name in current), encoding='utf-8')
          PY
            while IFS= read -r pkg || [ -n "$pkg" ]; do
              [ -n "$pkg" ] || continue
              version=$(awk -F '\t' -v p="$pkg" '$1 == p {print $2; exit}' /tmp/managed-desktop-backup/apt/versions.tsv)
              [ -n "$version" ] || continue
              (
                cd /tmp/managed-desktop-backup/apt/debs
                apt-get download "${pkg}=${version}" >/dev/null 2>&1 \
                  || apt-get download "$pkg" >/dev/null 2>&1 \
                  || sudo dpkg-repack "$pkg" >/dev/null 2>&1 \
                  || true
              )
            done </tmp/managed-desktop-backup/apt/restore-packages.txt
            echo "MANAGED_UBUNTU_APT_BACKUP_COUNT=$(wc -l </tmp/managed-desktop-backup/apt/restore-packages.txt | tr -d ' ')"

            # Snap installer-state with cached snap payload fallback. The inventory
            # was captured before quiescing because snapd is intentionally stopped now.
            if [ -s /tmp/managed-ubuntu-current-snap-list.txt ]; then
              awk 'NR>1 {print $1}' /tmp/managed-ubuntu-current-snap-list.txt | LC_ALL=C sort -u >/tmp/managed-ubuntu-current-snaps.txt
              comm -13 /tmp/managed-ubuntu-baseline-snaps.txt /tmp/managed-ubuntu-current-snaps.txt >/tmp/managed-ubuntu-added-snaps.txt
              : >/tmp/managed-desktop-backup/snap/added.tsv
              while IFS= read -r snap_name || [ -n "$snap_name" ]; do
                [ -n "$snap_name" ] || continue
                snap_line=$(awk -v n="$snap_name" '$1 == n {print $1 "\t" $3 "\t" $4 "\t" $6; exit}' /tmp/managed-ubuntu-current-snap-list.txt)
                [ -n "$snap_line" ] || continue
                printf '%s\n' "$snap_line" >>/tmp/managed-desktop-backup/snap/added.tsv
                snap_rev=$(printf '%s\n' "$snap_line" | cut -f2)
                snap_file="/var/lib/snapd/snaps/${snap_name}_${snap_rev}.snap"
                [ ! -f "$snap_file" ] || sudo cp -a "$snap_file" /tmp/managed-desktop-backup/snap/files/
              done </tmp/managed-ubuntu-added-snaps.txt
            fi

            # Flatpak state: keep only remote/ref inventory and trusted GPG keys.
            # Do not archive partial OSTree refs/config without objects: doing so can
            # leave refs pointing at missing commits on a fresh runner. Apps/runtimes
            # are reinstalled from their signed remotes; app data remains in Home.
            if command -v flatpak >/dev/null 2>&1; then
              FLATPAK_USER=(sudo -H -u "$DESKTOP_USERNAME" env -u SUDO_USER -u SUDO_UID -u SUDO_GID flatpak)
              flatpak remotes --system --columns=name,url 2>/dev/null >/tmp/managed-desktop-backup/flatpak/system-remotes.tsv || true
              flatpak list --system --columns=ref,origin 2>/dev/null >/tmp/managed-desktop-backup/flatpak/system-refs.tsv || true
              "${FLATPAK_USER[@]}" remotes --user --columns=name,url 2>/dev/null >/tmp/managed-desktop-backup/flatpak/user-remotes.tsv || true
              "${FLATPAK_USER[@]}" list --user --columns=ref,origin 2>/dev/null >/tmp/managed-desktop-backup/flatpak/user-refs.tsv || true
              if [ -d /var/lib/flatpak/repo ]; then
                sudo find /var/lib/flatpak/repo -maxdepth 1 -type f -name '*.trustedkeys.gpg' \
                  -exec cp -a {} /tmp/managed-desktop-backup/flatpak/system-keys/ \; || true
              fi
              USER_FLATPAK_REPO="/home/${DESKTOP_USERNAME}/.local/share/flatpak/repo"
              if [ -d "$USER_FLATPAK_REPO" ]; then
                sudo find "$USER_FLATPAK_REPO" -maxdepth 1 -type f -name '*.trustedkeys.gpg' \
                  -exec cp -a {} /tmp/managed-desktop-backup/flatpak/user-keys/ \; || true
              fi
            fi

            # Root and desktop-user crontabs are outside the normal /etc tree.
            if command -v crontab >/dev/null 2>&1; then
              sudo crontab -l 2>/dev/null >/tmp/managed-desktop-backup/cron/root.cron || :
              sudo -u "$DESKTOP_USERNAME" crontab -l 2>/dev/null >/tmp/managed-desktop-backup/cron/user.cron || :
            fi

            # Generic installer/filesystem delta. Newly installed dpkg-owned /usr
            # files are skipped because APT owns them; changes to baseline package
            # files are still captured, as are manual installers and app data.
            sudo python3 - <<'PY'
          import fnmatch
          import glob
          import hashlib
          import json
          import os
          import stat
          from pathlib import Path

          ROOTS = [
              '/etc', '/opt', '/usr/local', '/usr/bin', '/usr/sbin', '/usr/lib',
              '/usr/libexec', '/usr/share', '/usr/src', '/var/lib', '/var/opt',
              '/var/snap', '/var/www', '/srv', '/root',
          ]
          EXCLUDES = [
              '/etc/apt', '/usr/share/keyrings', '/etc/hostname', '/etc/hosts',
              '/etc/resolv.conf', '/etc/machine-id', '/etc/fstab', '/etc/crypttab',
              '/etc/passwd', '/etc/group', '/etc/shadow', '/etc/gshadow',
              '/etc/subuid', '/etc/subgid', '/etc/netplan', '/etc/network',
              '/etc/cloud', '/etc/ssh/ssh_host_*',
              '/etc/ssh/sshd_config.d/99-managed-cloud.conf', '/var/lib/apt',
              '/var/lib/dpkg', '/var/lib/systemd', '/var/lib/cloud',
              '/var/lib/snapd', '/var/lib/flatpak', '/var/lib/tailscale',
              '/var/lib/NetworkManager', '/var/lib/dbus', '/var/lib/waagent',
              '/var/lib/private', '/root/.cache',
          ]
          dynamic_excludes_path = Path('/tmp/managed-ubuntu-infra-writer-excludes.json')
          dynamic_excludes = []
          if dynamic_excludes_path.exists():
              try:
                  dynamic_excludes = json.loads(dynamic_excludes_path.read_text(encoding='utf-8'))
              except (OSError, json.JSONDecodeError):
                  dynamic_excludes = []
          dynamic_excludes = sorted({
              os.path.normpath(item) for item in dynamic_excludes
              if isinstance(item, str) and item.startswith('/')
          })
          EXCLUDES.extend(dynamic_excludes)
          print(f'MANAGED_UBUNTU_INFRA_DYNAMIC_EXCLUDES count={len(dynamic_excludes)}')

          def excluded(path):
              path = os.path.normpath(path)
              for pattern in EXCLUDES:
                  if '*' in pattern:
                      if fnmatch.fnmatch(path, pattern):
                          return True
                  else:
                      pattern = os.path.normpath(pattern)
                      if path == pattern or path.startswith(pattern + os.sep):
                          return True
              return False

          def fingerprint(path):
              st = os.lstat(path)
              mode = st.st_mode
              if stat.S_ISREG(mode): kind = 'f'
              elif stat.S_ISDIR(mode): kind = 'd'
              elif stat.S_ISLNK(mode): kind = 'l'
              else: kind = 'o'
              return [kind, stat.S_IMODE(mode), st.st_uid, st.st_gid, st.st_size, st.st_mtime_ns, os.readlink(path) if kind == 'l' else '']

          def scan():
              out = {}
              stack = [root for root in ROOTS if os.path.lexists(root)]
              while stack:
                  path = stack.pop()
                  if excluded(path):
                      continue
                  try:
                      fp = fingerprint(path)
                  except OSError:
                      continue
                  out[path] = fp
                  if fp[0] != 'd':
                      continue
                  try:
                      with os.scandir(path) as it:
                          for entry in it:
                              if not excluded(entry.path):
                                  stack.append(entry.path)
                  except OSError:
                      pass
              return out

          baseline = json.load(open('/tmp/managed-ubuntu-baseline-files.json', encoding='utf-8'))
          current = scan()
          dpkg_owned = set()
          for filename in glob.glob('/var/lib/dpkg/info/*.list'):
              try:
                  for raw in Path(filename).read_text(encoding='utf-8', errors='replace').splitlines():
                      if raw.startswith('/'):
                          dpkg_owned.add(os.path.normpath(raw))
              except OSError:
                  pass

          changed = []
          verify = {'files': {}, 'links': {}}
          for path in sorted(current):
              fp = current[path]
              if baseline.get(path) == fp or fp[0] == 'o':
                  continue
              if path.startswith('/usr/') and path in dpkg_owned and path not in baseline:
                  continue
              rel = path.lstrip('/')
              changed.append(rel)
              if fp[0] == 'f':
                  h = hashlib.sha256()
                  try:
                      with open(path, 'rb') as f:
                          for chunk in iter(lambda: f.read(1024 * 1024), b''):
                              h.update(chunk)
                      verify['files'][rel] = h.hexdigest()
                  except OSError:
                      pass
              elif fp[0] == 'l':
                  verify['links'][rel] = fp[6]

          out = Path('/tmp/managed-desktop-backup/system')
          payload = b''.join(item.encode('utf-8', errors='surrogateescape') + b'\0' for item in changed)
          (out / 'changed-paths.bin').write_bytes(payload)
          (out / 'verify.json').write_text(json.dumps(verify, separators=(',', ':'), sort_keys=True), encoding='utf-8')
          (out / 'summary.json').write_text(json.dumps({'changed_paths': len(changed), 'verified_files': len(verify['files']), 'verified_links': len(verify['links'])}, separators=(',', ':')), encoding='utf-8')
          PY
            if [ -s /tmp/managed-desktop-backup/system/changed-paths.bin ]; then
              sudo tar --acls --xattrs --no-recursion --null \
                -C / -cpf /tmp/managed-desktop-backup/system/delta.tar \
                -T /tmp/managed-desktop-backup/system/changed-paths.bin
            fi

            sudo chown -R "$USER:$USER" /tmp/managed-desktop-backup
            python3 - <<'PY' >/tmp/managed-desktop-backup/metadata.json
          import json, os
          from datetime import datetime, timezone
          print(json.dumps({
              'version': 4,
              'system_type': 'ubuntu',
              'machine_id': os.environ['MACHINE_ID'],
              'desktop_username': os.environ['DESKTOP_USERNAME'],
              'runner_image': os.environ['RUNNER_IMAGE'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'created_at': datetime.now(timezone.utc).isoformat(),
              'scope': 'managed-home-plus-installer-state-v4-quiesced-without-dot-cache',
              'features': ['apt','apt-config','snap','flatpak','system-delta','systemd','cron','quiesced-snapshot','runtime-unit-state'],
          }, separators=(',', ':')))
          PY
            echo 'MANAGED_UBUNTU_V4_BACKUP_STAGED'
            echo 'MANAGED_DESKTOP_BACKUP_STAGED'
          }

          COMMAND_TITLE="Cloud Ubuntu Command ${MACHINE_ID}"
          while true; do
            ISSUE_NO=$(gh api "/repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
              --jq ".[] | select(.pull_request == null) | select(.title == \"${COMMAND_TITLE}\") | .number" \
              2>/dev/null | head -n1 || true)
            if [ -n "$ISSUE_NO" ]; then
              ISSUE_BODY=$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NO}" --jq '.body // ""' 2>/dev/null || true)
              CMD_JSON=$(printf '%s\n' "$ISSUE_BODY" | grep -m1 '^{' || true)
              if [ -n "$CMD_JSON" ]; then
                CMD=$(jq -r '.command // ""' <<<"$CMD_JSON" 2>/dev/null || true)
                TARGET_SYSTEM=$(jq -r '.system_type // ""' <<<"$CMD_JSON" 2>/dev/null || true)
                TARGET_RUN=$(jq -r '.run_id // 0' <<<"$CMD_JSON" 2>/dev/null || true)
                TARGET_MACHINE=$(jq -r '.machine_id // ""' <<<"$CMD_JSON" 2>/dev/null || true)
                if [ "$CMD" = 'backup' ] && [ "$TARGET_SYSTEM" = 'ubuntu' ] && [ "$TARGET_RUN" = "$GITHUB_RUN_ID" ] && [ "$TARGET_MACHINE" = "$MACHINE_ID" ]; then
                  echo "BACKUP_REQUEST_RECEIVED issue=${ISSUE_NO}"
                  printf '%s' "$ISSUE_NO" >/tmp/managed-backup-issue-number
                  stage_backup
                  echo 'should_save=true' >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
            fi
            sleep 10
            systemctl is-active --quiet ssh || sudo systemctl restart ssh
          done


      - name: Save Ubuntu comprehensive state backup to GitHub Actions Cache
        if: steps.session.outputs.should_save == 'true'
        uses: actions/cache/save@v5
        with:
          path: /tmp/managed-desktop-backup
          key: managed-desktop-ubuntu-${{ inputs.machine_id }}-${{ inputs.runner_image }}-${{ github.run_id }}

      - name: Close consumed Ubuntu backup command
        if: steps.session.outputs.should_save == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/managed-backup-issue-number ]; then
            ISSUE_NO=$(cat /tmp/managed-backup-issue-number)
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NO}" -f state=closed >/dev/null
          fi
          echo 'MANAGED_DESKTOP_BACKUP_SAVED'
          echo 'MANAGED_UBUNTU_BACKUP_SAVED'

      - name: Report Ubuntu workflow failure to Cloudflare
        if: ${{ failure() }}
        env:
          BOOTSTRAP_TICKET: ${{ inputs.bootstrap_ticket }}
        shell: bash
        run: |
          set +e
          echo "::add-mask::${BOOTSTRAP_TICKET}"
          WEB_URL="${WEB_URL%/}"
          case "$WEB_URL" in https://*) ;; *) exit 0 ;; esac
          TS_IPV4=$(tailscale ip -4 2>/dev/null | head -n1)
          TS_ADDR=""
          [ -z "$TS_IPV4" ] || TS_ADDR="${TS_IPV4}:22"
          BODY=$(jq -nc --arg key "$INSTANCE_KEY" --arg repo "$GITHUB_REPOSITORY" --argjson run "$GITHUB_RUN_ID" --arg node "ubuntu-${MACHINE_ID}" --arg ts "$TS_ADDR" --arg tsHost "${TS_DNS_HOSTNAME:-}" --arg cf "${CF_TUNNEL_HOSTNAME:-}" --arg mode "${TUNNEL_MODE:-tailscale}" '{instanceKey:$key,repository:$repo,runId:$run,nodeName:$node,address:$ts,tailscaleAddress:$ts,tailscaleHostname:$tsHost,cloudflareAddress:$cf,cloudflareHostname:$cf,tunnelMode:$mode,status:"failure"}')
          curl -fsS -H "X-Bootstrap-Ticket: ${BOOTSTRAP_TICKET}" -H 'content-type: application/json' --data "$BODY" "${WEB_URL}/api/runner/report" -o /tmp/cloud-failure-report.json || true
