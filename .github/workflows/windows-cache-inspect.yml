name: Windows cache inspect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore known software-capsule cache
        uses: actions/cache/restore@v5
        with:
          path: '${{ runner.temp }}\managed-desktop-backup'
          key: managed-desktop-windows-005-inspect-${{ github.run_id }}
          restore-keys: |
            managed-desktop-windows-005-35207222767
            managed-desktop-windows-005-
      - name: Inspect saved task identities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'managed-desktop-backup'
          $state = Join-Path $root 'state'
          $metadata = Get-Content -LiteralPath (Join-Path $root 'metadata.json') -Raw | ConvertFrom-Json
          Write-Host "INSPECT_METADATA sourceSid=$($metadata.source_sid) sourceUser=$($metadata.source_user)"
          foreach ($a in @($metadata.source_local_accounts)) { Write-Host "INSPECT_ACCOUNT name=$($a.name) sid=$($a.sid)" }
          $manifest = @(Get-Content -LiteralPath (Join-Path $state 'scheduled-tasks.json') -Raw | ConvertFrom-Json)
          foreach ($task in $manifest) {
            Write-Host "INSPECT_TASK name=$($task.name) path=$($task.path) source=$($task.definition_source) file=$($task.file)"
            $xmlPath = Join-Path (Join-Path $state 'tasks') ([string]$task.file)
            [xml]$xml = Get-Content -LiteralPath $xmlPath -Raw
            foreach ($node in @($xml.SelectNodes("//*[local-name()='UserId' or local-name()='GroupId' or local-name()='Author' or local-name()='SecurityDescriptor']"))) {
              Write-Host "INSPECT_XML node=$($node.LocalName) value=[$($node.InnerText)] parent=$($node.ParentNode.LocalName)"
            }
            foreach ($attr in @($xml.SelectNodes('//@*'))) {
              if ([string]$attr.Value -match '(?i)runner|admin|S-1-5-|\\') { Write-Host "INSPECT_ATTR name=$($attr.Name) value=[$($attr.Value)] owner=$($attr.OwnerElement.LocalName)" }
            }
          }
